  funBriSldr.addEventListener('input', () => { funBriVal = +funBriSldr.value; if (snsrOn.bri) { snsrBaseline.bri = funBriVal; reZeroSensor('bri'); } applyFunFilters(); saveSettings(); });
  funConSldr.addEventListener('input', () => { funConVal = +funConSldr.value; if (snsrOn.con) { snsrBaseline.con = funConVal; reZeroSensor('con'); } applyFunFilters(); saveSettings(); });
  funAbrSldr.addEventListener('input', () => { funAbrVal = +funAbrSldr.value; if (snsrOn.abr) { snsrBaseline.abr = funAbrVal; reZeroSensor('abr'); } applyFunFilters(); saveSettings(); });
  funPxlSldr.addEventListener('input', () => { funPxlVal = +funPxlSldr.value; if (snsrOn.pxl) { snsrBaseline.pxl = funPxlVal; reZeroSensor('pxl'); } applyFunFilters(); saveSettings(); });
  funSection.addEventListener('click', e => {
    const fxRow = e.target.closest('.fx-row');
    const fx = fxRow?.querySelector('.snsr-row')?.dataset.fx;
    const inv = e.target.closest('.inv-btn');
    if (inv && fx) { fxInvert[fx] = !fxInvert[fx]; inv.classList.toggle('on', fxInvert[fx]); saveSettings(); return; }
    const bnc = e.target.closest('.bnc-btn');
    if (bnc && fx) { fxBounce[fx] = !fxBounce[fx]; bnc.classList.toggle('on', fxBounce[fx]); saveSettings(); return; }
    const btn = e.target.closest('.snsr-tgl');
    if (!btn) return;
    toggleSensor(btn.closest('.snsr-row').dataset.fx, btn.dataset.sensor);
  });
  permBtn.addEventListener('click',       () => startCamera());
  blindBtn.addEventListener('click',      toggleBlindMode);
  retryBtn.addEventListener('click', () => {
    errOverlay.classList.add('hidden');
    permOverlay.classList.remove('hidden');
    startCamera();
  });

  zoomSlider.addEventListener('input', () => {
    zoomVal.textContent = parseFloat(zoomSlider.value).toFixed(1) + '×';
    pct(zoomSlider);
    applyZoom(zoomSlider.value);
  });
  focusSldr.addEventListener('input', () => {
    const v = parseFloat(focusSldr.value);
    focusVal.textContent = fmtFocus(v);
    pct(focusSldr);
    applyFocus(v);
  });
  evSlider.addEventListener('input', () => {
    const v = parseFloat(evSlider.value);
    evVal.textContent = v > 0 ? `+${v}` : `${v}`;
    pct(evSlider);
    applyEV(v);
  });
  expTimeSldr.addEventListener('input', () => applyExpTime(expTimeSldr.value));
  isoSldr.addEventListener('input',     () => applyISO(isoSldr.value));
  leDurSldr.addEventListener('input', () => {
    leDurIdx = parseInt(leDurSldr.value);
    updateLeDurDisplay();
    saveSettings();
  });

  document.querySelectorAll('#ratioSelector .pill').forEach(b =>
    b.addEventListener('click', () => {
      const r = b.dataset.ratio;
      if (currentRatio === r && RATIO_FLIP[r]) setRatio(RATIO_FLIP[r]);
      else setRatio(r);
    }));
  customWInput.addEventListener('change', () => { applyCustomRatio(); saveSettings(); });
  customHInput.addEventListener('change', () => { applyCustomRatio(); saveSettings(); });
  document.querySelectorAll('#qualitySelector .pill').forEach(b =>
    b.addEventListener('click', () => { if (!b.disabled) setQuality(b.dataset.quality); }));
  customQualWInput.addEventListener('change', () => {
    recQualW = Math.max(1, parseInt(customQualWInput.value) || 1280);
    customQualWInput.value = recQualW;
    saveSettings();
    if (ready) startCamera(currentDeviceId);
  });
  customQualHInput.addEventListener('change', () => {
    recQualH = Math.max(1, parseInt(customQualHInput.value) || 720);
    customQualHInput.value = recQualH;
    saveSettings();
    if (ready) startCamera(currentDeviceId);
  });
  document.querySelectorAll('#leModeRow .pill').forEach(b =>
    b.addEventListener('click', () => setLeMode(b.dataset.leMode)));
  function setRecFps(fps) {
    recFps = fps;
    document.querySelectorAll('#fpsSelector .pill').forEach(b =>
      b.classList.toggle('active', +b.dataset.fps === fps));
    saveSettings();
  }
  // Restore saved FPS selection in UI
  document.querySelectorAll('#fpsSelector .pill').forEach(b => {
    b.classList.toggle('active', +b.dataset.fps === recFps);
    b.addEventListener('click', () => setRecFps(+b.dataset.fps));
  });
  document.querySelectorAll('.swatch:not(.swatch-custom)').forEach(s =>
    s.addEventListener('click', () => { setCFColor(s.dataset.color); updateCFColorBtn(); closeCFPopup(); }));
  cfPicker.addEventListener('input', () => {
    cfColor = cfPicker.value;
    customSwatch.style.background = cfColor;
    document.querySelectorAll('.swatch:not(.swatch-custom)').forEach(s => s.classList.remove('active'));
    customSwatch.classList.add('active');
    updateCFBorder();
    updateCFColorBtn();
  });
  cfPicker.addEventListener('change', saveSettings);

  // Close CF popup on outside click
  document.addEventListener('click', (e) => {
    if (cfPopupOpen && !cfPopup.contains(e.target) && e.target !== cfColorBtn) closeCFPopup();
  });

  // Volume rocker → shutter (capture phase for priority, passive:false for preventDefault)
  document.addEventListener('keydown', onKey, { capture: true, passive: false });
  window.addEventListener('keydown',   onKey, { capture: true, passive: false });

  navigator.mediaDevices?.addEventListener?.('devicechange', enumerateDevices);
}

init();
</script>
</body>
</html>
