<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cam — luci.cat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=JetBrains+Mono:wght@400;500&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root,body[data-theme="dark"]{
  --bg:#010c16;--surface:#031524;--surface2:#071e30;
  --glass:rgba(1,18,32,.54);--glass2:rgba(4,22,38,.48);
  --border:rgba(0,180,215,.16);--border-s:#0c3a50;--border-h:#1a6a88;
  --text:#cce8f4;--text-m:#3d8faa;--text-d:#1a4d60;
  --accent:#ff8c30;--accent-dim:rgba(255,140,48,.14);--accent-glow:rgba(255,140,48,.55);
  --cx:#00c8e8;--cx-dim:rgba(0,200,232,.08);
  --danger:#ff3d5a;--r:3px;--rs:2px
}
body[data-theme="light"]{
  --bg:#e6ecf2;--surface:#f0f4f9;--surface2:#dde4ed;
  --glass:rgba(240,244,249,.7);--glass2:rgba(225,232,240,.62);
  --border:rgba(28,60,100,.2);--border-s:#6a82a0;--border-h:#3a5878;
  --text:#0a1828;--text-m:#3a5878;--text-d:#6a82a0;
  --accent:#c64a18;--accent-dim:rgba(198,74,24,.18);--accent-glow:rgba(198,74,24,.4);
  --cx:#0f4e80;--cx-dim:rgba(15,78,128,.12);
  --danger:#b82040;--r:3px;--rs:2px
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);font-size:15px;line-height:1.5}

/* ── App shell ── */
.app{
  display:flex;flex-direction:column;
  height:100dvh;height:100vh;
  padding-top:env(safe-area-inset-top);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
.app-main{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.cam-area{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}

/* ── Header ── */
.header{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px 8px;
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  flex-shrink:0;z-index:20;position:relative;
}
/* thin cyan accent line under header */
.header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cx),transparent);
  opacity:.35;
}
.header h1{
  font-family:'Silkscreen',monospace;font-size:19px;font-weight:400;letter-spacing:2px;
  background:linear-gradient(110deg,var(--accent) 30%,var(--cx));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
body[data-theme="light"] .header h1{
  background:linear-gradient(110deg,var(--accent),var(--cx));
  -webkit-background-clip:text;background-clip:text;
}
.hdr-space{flex:1}
.icon-btn{
  width:32px;height:32px;flex-shrink:0;border-radius:var(--rs);
  border:1px solid var(--border);background:var(--glass2);color:var(--text-m);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;padding:0;position:relative;
  clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,0 100%); /* notched corner */
}
.icon-btn:hover,.icon-btn:active{border-color:var(--cx);color:var(--cx);background:var(--cx-dim)}
.icon-btn svg{width:16px;height:16px;display:block}
.lang-btn{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1px}

/* ── Blind mode: same hide-controls behaviour as V, the rest stays put
   but more translucent so the camera dominates. Tap-to-shoot. ── */
body.blind-mode .header,
body.blind-mode .capture-bar,
body.blind-mode .right-panel{opacity:.55;transition:opacity .2s}
body.blind-mode .header:hover,
body.blind-mode .capture-bar:hover,
body.blind-mode .right-panel:hover{opacity:1}
body.blind-mode .viewport-wrap{cursor:crosshair}

/* ── Viewport ── */
.viewport-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  background:var(--bg);overflow:hidden;min-height:0;position:relative;
}
.viewport{position:relative;background:var(--bg);overflow:hidden;max-width:100%;max-height:100%}
.viewport[data-ratio="free"]{width:100%;height:100%}
.viewport[data-ratio="1:1"] {aspect-ratio:1/1}
.viewport[data-ratio="4:3"] {aspect-ratio:4/3}
.viewport[data-ratio="3:4"] {aspect-ratio:3/4}
.viewport[data-ratio="16:9"]{aspect-ratio:16/9}
.viewport[data-ratio="9:16"]{aspect-ratio:9/16}
.viewport:not([data-ratio="free"]){width:auto;height:auto;max-width:100%;max-height:100%}

#preview{width:100%;height:100%;object-fit:cover;display:block;background:var(--bg)}
#preview.mirrored{transform:scaleX(-1)}

/* Color frame: persistent border on viewport */
.cf-border{
  position:absolute;inset:0;pointer-events:none;z-index:3;
  box-sizing:border-box;
  border:0px solid transparent;
  transition:border-width .2s,border-color .2s;
}
.cf-border.active{border-width:22px;border-color:var(--cf,#fff)}

.capture-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;transition:opacity .05s}
.capture-flash.flash{opacity:.9}

.rec-badge{
  position:absolute;top:10px;left:10px;display:none;align-items:center;gap:5px;
  background:rgba(0,0,0,.7);border:1px solid rgba(255,40,60,.35);
  color:#ff3040;font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:2px;
  padding:3px 8px 3px 6px;border-radius:2px;z-index:4;
}
.rec-badge.visible{display:flex}
.rec-dot{width:6px;height:6px;border-radius:50%;background:#ff3040;flex-shrink:0;animation:recBlink .9s ease-in-out infinite}
@keyframes recBlink{0%,100%{opacity:1}50%{opacity:0}}

/* ── LE overlay ── */
.le-overlay{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4)}
.le-overlay.hidden{display:none}
.le-card{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  background:rgba(1,14,26,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(0,200,232,.2);
  padding:22px 34px;border-radius:3px;color:#cce8f4;min-width:180px;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);
}
.le-timer{font-family:'JetBrains Mono',monospace;font-size:38px;letter-spacing:2px}
.le-label{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:1.2px;text-transform:uppercase;margin-top:-6px}
.le-bar-track{width:100%;height:2px;background:rgba(255,255,255,.12);border-radius:2px}
.le-bar-fill{height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width .15s linear}
.le-cancel{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  color:rgba(0,200,232,.5);background:none;border:1px solid rgba(0,200,232,.18);
  border-radius:2px;padding:5px 16px;cursor:pointer;transition:all .15s;
}
.le-cancel:hover{color:var(--cx);border-color:rgba(0,200,232,.5)}

.overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:10;padding:28px;text-align:center;color:#fff;
}
.overlay.hidden{display:none}
.review-overlay{padding:16px;justify-content:flex-end;gap:12px;background:rgba(0,0,0,.88)}
.review-img{flex:1 1 auto;min-height:0;width:auto;max-width:100%;object-fit:contain;border-radius:var(--r)}
.review-actions{display:flex;gap:10px;flex-shrink:0;width:100%}
.review-actions .perm-btn{flex:1;margin-top:0}
.review-discard-btn{background:transparent!important;border:1px solid rgba(255,255,255,.3)!important;color:#fff!important}
.overlay-icon{width:58px;height:58px;opacity:.5;margin-bottom:4px}
.overlay p{font-size:15px;color:rgba(255,255,255,.72);max-width:260px;line-height:1.5}
.perm-btn{
  margin-top:4px;padding:10px 28px;
  background:var(--accent);color:#000;
  border:none;border-radius:var(--r);
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:opacity .15s;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);
}
.perm-btn:active{opacity:.8}

/* ── Right panel: floats above the camera, doesn't squish it ── */
.right-panel{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  display:flex;flex-direction:column;
  background:rgba(1,18,32,.34);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(0,200,232,.18);
}
body[data-theme="light"] .right-panel{background:rgba(228,216,194,.42)}
/* thin cyan accent line at top edge */
.right-panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cx) 30%,var(--cx) 70%,transparent);
  opacity:.32;z-index:1;pointer-events:none;
}

/* ── Controls ── */
.controls{
  padding:10px 14px 12px;
  display:flex;flex-direction:column;gap:8px;
  overflow-x:hidden;overflow-y:auto;
  max-height:46vh;
  scrollbar-width:thin;scrollbar-color:var(--border-s) transparent;
  transition:max-height .3s ease,opacity .2s,padding .3s;
}
.controls::-webkit-scrollbar{width:2px}
.controls::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:2px}
.controls.hidden{max-height:0;opacity:0;padding-top:0;padding-bottom:0;overflow:hidden}

/* ── Section headers ── */
.sec{
  display:flex;align-items:center;gap:8px;
  font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--cx);font-family:'JetBrains Mono',monospace;
  margin-top:6px;flex-shrink:0;opacity:.75;
}
.sec::before{
  content:'';display:inline-block;width:5px;height:5px;
  background:var(--cx);transform:rotate(45deg);flex-shrink:0;opacity:.85;
}
.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

/* ── Control rows (label | slider | value) ── */
.crow{
  display:grid;grid-template-columns:48px 1fr 44px;
  align-items:center;gap:6px;
}
.clbl{
  font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--text-d);white-space:nowrap;font-family:'JetBrains Mono',monospace;
  display:inline-flex;align-items:center;gap:5px;
}
.cdot{
  display:inline-block;width:5px;height:5px;flex-shrink:0;
  background:var(--d,var(--cx));transform:rotate(45deg);
  box-shadow:0 0 4px var(--d,var(--cx));
}
.ctrl-bump{margin-top:2px}
.cval{
  font-size:11px;font-family:'JetBrains Mono',monospace;
  color:var(--text-m);text-align:right;white-space:nowrap;
}

/* ── Sliders ── */
.cslider{
  -webkit-appearance:none;appearance:none;
  width:100%;height:3px;border-radius:2px;outline:none;border:none;cursor:pointer;
  background:linear-gradient(to right,
    var(--accent) calc(var(--pct, 0%) * 1%),
    var(--border-s) calc(var(--pct, 0%) * 1%));
}
.cslider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:12px;height:12px;border-radius:1px;
  background:var(--accent);border:1px solid var(--bg);
  box-shadow:0 0 6px var(--accent-glow);cursor:pointer;
  transform:rotate(45deg); /* diamond shape */
}
.cslider::-moz-range-thumb{
  width:10px;height:10px;border-radius:1px;
  background:var(--accent);border:1px solid var(--bg);cursor:pointer;
  transform:rotate(45deg);
}
.cslider:active::-webkit-slider-thumb{box-shadow:0 0 12px var(--accent-glow),0 0 0 4px var(--accent-dim)}

/* ── Pill rows ── */
.pill-row{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pill-row::-webkit-scrollbar{display:none}
.pill{
  flex-shrink:0;padding:4px 10px;border-radius:2px;
  border:1px solid var(--border);background:var(--glass2);
  color:var(--text-m);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
  cursor:pointer;transition:all .15s;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase;
}
.pill:hover{border-color:var(--cx);color:var(--cx)}
.pill.active{background:var(--accent);border-color:var(--accent);color:var(--bg)}
body[data-theme="light"] .pill.active{color:#fff}

/* ── Toggle pills ── */
.tgl-row{display:flex;gap:5px;flex-wrap:wrap}
.tgl{
  display:inline-flex;align-items:center;gap:5px;
  flex-shrink:0;padding:4px 10px 4px 8px;border-radius:2px;
  border:1px solid var(--border);background:var(--glass2);
  color:var(--text-m);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
  cursor:pointer;transition:all .15s;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase;
}
.tgl svg{width:11px;height:11px;display:block;flex-shrink:0}
.tgl.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
body[data-theme="light"] .tgl.on{color:#fff}

/* ── Color swatches ── */
.swatch-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-left:2px}
.swatch{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  border:2px solid transparent;cursor:pointer;
  transition:border-color .15s,transform .12s;
  outline:1px solid rgba(128,128,128,.2);
}
.swatch:hover{transform:scale(1.12)}
.swatch.active{border-color:var(--accent);transform:scale(1.15)}
.swatch-custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden}
.swatch-custom input[type="color"]{position:absolute;inset:0;opacity:0;cursor:pointer;width:130%;height:130%;top:-15%;left:-15%}
.cf-color-btn{
  width:20px;height:20px;flex-shrink:0;border-radius:var(--rs);padding:0;
  border:2px solid var(--border);background:#fff;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 4px) 0,100% 4px,100% 100%,0 100%);
  opacity:.2;pointer-events:none;transition:opacity .15s,border-color .15s;
}
.cf-color-btn.active{opacity:1;pointer-events:auto;border-color:var(--accent)}
.cf-popup{
  position:fixed;z-index:200;
  display:flex;gap:7px;align-items:center;padding:9px 11px;
  background:var(--surface);border:1px solid var(--border-h);border-radius:var(--r);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  filter:drop-shadow(0 4px 18px rgba(0,0,0,.45));
}
.cf-popup.hidden{display:none}

/* ── Capture bar (full width, always at bottom of .app) ── */
.capture-bar{
  flex-shrink:0;
  padding:6px 16px calc(env(safe-area-inset-bottom) + 8px);
  background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-top:1px solid var(--border);position:relative;
}
.capture-bar::before{
  content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--cx),transparent);
  opacity:.4;
}
.capture-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:2px 0}
.cap-left{display:flex;justify-content:flex-start;padding-left:6px}
.cap-right{display:flex;justify-content:flex-end;padding-right:6px}

.shutter-btn{
  width:72px;height:72px;flex-shrink:0;border-radius:50%;
  border:2px solid var(--accent);background:transparent;
  cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;padding:0;
  transition:opacity .25s,border-color .25s,box-shadow .25s;
  box-shadow:0 0 0 1px rgba(255,140,48,.18),0 0 18px rgba(255,140,48,.16);
}
.shutter-btn::after{
  content:'';width:56px;height:56px;border-radius:50%;
  background:var(--text);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35);
  transition:width .12s,height .12s,background .25s;
}
.shutter-btn:active::after,.shutter-btn.pressing::after{width:48px;height:48px}
.shutter-btn.off{opacity:.3;cursor:not-allowed}
.shutter-btn.ghost{opacity:.18;border-color:rgba(255,255,255,.2)}
.shutter-btn.ghost::after{background:rgba(255,255,255,.4)}
.shutter-btn.le-mode{border-color:var(--cx);box-shadow:0 0 14px rgba(0,200,232,.25)}
.shutter-btn.le-capturing{animation:lePulse 1s ease-in-out infinite}
@keyframes lePulse{0%,100%{box-shadow:0 0 0 0 rgba(0,200,232,.5)}50%{box-shadow:0 0 0 10px rgba(0,200,232,0)}}

.cap-hide-btn{
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--border);background:var(--glass2);
  color:var(--text-m);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0;
}
.cap-hide-btn:hover{border-color:var(--accent);color:var(--accent)}
.cap-hide-btn svg{width:16px;height:16px;display:block;transition:transform .3s}
.cap-hide-btn.revealed svg{transform:rotate(180deg)}

.record-btn{
  width:50px;height:50px;flex-shrink:0;border-radius:50%;
  border:2px solid var(--border-s);background:var(--glass2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;padding:0;
}
.record-btn:hover{border-color:var(--danger)}
.record-btn.recording{border-color:var(--danger);background:rgba(220,32,64,.12)}
.record-btn.off{opacity:.3;cursor:not-allowed}
.record-btn svg{width:20px;height:20px;color:var(--danger);display:block}

.rec-timer-row{display:flex;justify-content:center;height:14px;margin-top:3px}
.rec-timer{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--danger);display:none}
.rec-timer.visible{display:block}

/* ── Toast ── */
.toast{
  position:fixed;bottom:calc(env(safe-area-inset-bottom) + 95px);left:50%;
  transform:translateX(-50%) translateY(14px);
  background:rgba(0,0,0,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;
  white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Crop UI (free mode only) ── */
.crop-ui{position:absolute;inset:0;z-index:4;display:none;pointer-events:none}
.viewport[data-ratio="free"] .crop-ui{display:block}
.crop-region{
  position:absolute;pointer-events:none;
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 0 0 9999px rgba(0,0,0,.42);
  transition:none;
}
/* Horizontal handles (top/bottom) */
.crop-h{
  position:absolute;left:50%;transform:translateX(-50%);
  width:52px;height:22px;cursor:row-resize;pointer-events:all;
  display:flex;align-items:center;justify-content:center;
}
.crop-h::after{
  content:'';display:block;width:36px;height:3px;border-radius:2px;
  background:rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(0,0,0,.4);
}
/* Vertical handles (left/right) */
.crop-v{
  position:absolute;top:50%;transform:translateY(-50%);
  width:22px;height:52px;cursor:col-resize;pointer-events:all;
  display:flex;align-items:center;justify-content:center;
}
.crop-v::after{
  content:'';display:block;width:3px;height:36px;border-radius:2px;
  background:rgba(255,255,255,.85);box-shadow:1px 0 4px rgba(0,0,0,.4);
}

/* ── Custom ratio row ── */
.custom-ratio-row{display:flex;align-items:center;gap:8px;padding:2px 0}
.custom-ratio-row input{
  width:46px;padding:5px 6px;text-align:center;
  background:var(--glass2);border:1px solid var(--border);border-radius:var(--rs);
  color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;
  -moz-appearance:textfield;outline:none;transition:border-color .15s;
}
.custom-ratio-row input::-webkit-inner-spin-button,
.custom-ratio-row input::-webkit-outer-spin-button{-webkit-appearance:none}
.custom-ratio-row input:focus{border-color:var(--accent)}
.cr-sep{font-size:15px;color:var(--text-d);font-family:'JetBrains Mono',monospace}
.cr-hint{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-d)}

/* ── Capture animations ── */
/* Expanding ring from shutter button */
@keyframes shutterRing{
  from{transform:scale(1);opacity:.6}
  to  {transform:scale(2.4);opacity:0}
}
.shutter-ring{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid var(--accent);pointer-events:none;
  animation:shutterRing .55s cubic-bezier(.2,.6,.4,1) forwards;
}
/* Edge glow around the whole screen */
#edgeFlash{position:fixed;inset:0;pointer-events:none;z-index:89;opacity:0}
@keyframes edgePop{
  0%  {opacity:1;box-shadow:inset 0 0 0 3px rgba(255,255,255,.65),inset 0 0 28px rgba(255,255,255,.08)}
  100%{opacity:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,0),inset 0 0 60px rgba(255,255,255,0)}
}
#edgeFlash.pop{animation:edgePop .55s ease-out forwards}

/* ── Session pill (above capture row) ── */
.session-pill{
  display:none;align-items:center;gap:8px;
  padding:5px 16px 0;
  font-size:12px;font-family:'JetBrains Mono',monospace;
}
.session-pill.visible{display:flex}
.session-pill-count{color:var(--accent);font-weight:500}
.session-pill-count.full{color:var(--danger)}
.session-view-btn{
  margin-left:auto;font-size:12px;font-family:inherit;font-weight:600;
  color:var(--accent);background:none;border:none;cursor:pointer;padding:2px 0;
}
.session-view-btn:active{opacity:.7}
/* Session mode: shutter gets a stack ring */
.shutter-btn.session-mode{box-shadow:0 0 0 3px rgba(255,176,112,.35),0 0 14px rgba(255,176,112,.2)}

/* ── Gallery overlay ── */
.gallery-ov{
  position:fixed;inset:0;z-index:45;
  display:flex;flex-direction:column;
  background:var(--bg);
}
.gallery-ov.hidden{display:none}
.gallery-hdr{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px 8px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.gallery-hdr-title{
  font-family:'Silkscreen',monospace;font-size:16px;font-weight:400;letter-spacing:.5px;
  background:linear-gradient(135deg,var(--accent),#7eaad4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
body[data-theme="light"] .gallery-hdr-title{
  background:linear-gradient(135deg,#e89854,#f0c474);-webkit-background-clip:text;background-clip:text;
}
.gallery-hdr-sub{font-size:12px;color:var(--text-d);font-family:'JetBrains Mono',monospace}
.gallery-hdr-space{flex:1}
.gallery-selall{
  font-size:12px;font-weight:600;color:var(--text-m);
  background:none;border:none;cursor:pointer;padding:4px 8px;font-family:inherit;
}
.gallery-selall:hover{color:var(--text)}
.gallery-close{
  width:32px;height:32px;border-radius:var(--rs);
  border:1px solid var(--border);background:var(--glass2);
  color:var(--text-m);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.gallery-close svg{width:14px;height:14px;display:block}

.gallery-grid{
  flex:1;overflow-y:auto;
  display:grid;grid-template-columns:repeat(3,1fr);gap:2px;
  padding:2px;
  scrollbar-width:thin;scrollbar-color:var(--border-s) transparent;
}
@media(min-width:500px){.gallery-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:800px){.gallery-grid{grid-template-columns:repeat(5,1fr)}}

.gthumb{
  position:relative;aspect-ratio:1;cursor:pointer;overflow:hidden;background:#111;
  transition:opacity .15s;
}
.gthumb.off{opacity:.35}
.gthumb img{width:100%;height:100%;object-fit:cover;display:block}
.gthumb .gcheck{
  position:absolute;top:5px;right:5px;
  width:20px;height:20px;border-radius:50%;
  border:2px solid rgba(255,255,255,.6);
  background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.gthumb:not(.off) .gcheck{background:var(--accent);border-color:var(--accent)}
.gthumb:not(.off) .gcheck svg{display:block}
.gcheck svg{width:10px;height:10px;display:none;stroke:#000;stroke-width:2.5}
.gthumb .gnum{
  position:absolute;bottom:4px;left:5px;
  font-size:10px;font-family:'JetBrains Mono',monospace;
  color:rgba(255,255,255,.7);text-shadow:0 1px 3px rgba(0,0,0,.8);
}
.gthumb video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.gthumb .gplay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.gthumb .gplay svg{
  width:28px;height:28px;color:#fff;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,.6));
  background:rgba(0,0,0,.45);border-radius:50%;padding:7px;
}

.gallery-footer{
  display:flex;gap:10px;
  padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
  border-top:1px solid var(--border);flex-shrink:0;
}
.gallery-save{
  flex:1;padding:12px;
  background:var(--accent);color:#000;
  border:none;border-radius:var(--r);
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
  transition:opacity .15s;
}
.gallery-save:active{opacity:.8}
.gallery-save:disabled{opacity:.35;cursor:not-allowed}
.gallery-clear{
  padding:12px 16px;
  background:none;color:var(--danger);
  border:1px solid var(--danger);border-radius:var(--r);
  font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  transition:opacity .15s;white-space:nowrap;
}
.gallery-clear:active{opacity:.7}

/* ── Desktop: same vertical layout as phone, just more control height ── */
@media(min-width:640px){
  .controls{max-height:36vh}
}

@media(max-height:620px) and (max-width:639px){
  .header{padding:6px 12px 4px}
  .header h1{font-size:17px}
  .controls{gap:6px;padding:7px 12px 9px;max-height:38vh}
  .shutter-btn{width:62px;height:62px}
  .shutter-btn::after{width:50px;height:50px}
  .record-btn{width:44px;height:44px}
}

let curLang = 'en';
function t(key, ...args) {
  const dict = I18N[curLang] || I18N.en;
  const v = dict[key] ?? I18N.en[key] ?? key;
  return typeof v === 'function' ? v(...args) : v;
}
function applyI18n() {
  document.title = t('title') + ' — luci.cat';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    const v = t(k);
    if (typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.dataset.i18nTitle);

  document.querySelectorAll('[data-i18n-aria]').forEach(el => {

  if (typeof renderCamSelector === 'function' && devices.length) renderCamSelector();
  if (typeof updateSessionPill === 'function') updateSessionPill();
  if (typeof updateGalleryHeader === 'function') updateGalleryHeader();
  if (typeof updateLeDurDisplay === 'function') updateLeDurDisplay();
  if (typeof langBtn !== 'undefined' && langBtn) langBtn.textContent = curLang.toUpperCase();
}
function detectLang() {
  const stored = (() => {
    try { return JSON.parse(localStorage.getItem('cam_prefs') || '{}').lang; } catch { return null; }
  })();
  if (stored && LANGS.includes(stored)) return stored;
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('pt')) return 'pt';
  if (nav.startsWith('ca')) return 'ca';
  return 'en';
}
function cycleLang() {
  curLang = LANGS[(LANGS.indexOf(curLang) + 1) % LANGS.length];
  applyI18n();
  saveSettings();
}

function triggerCaptureAnim() {
  // Expanding ring from shutter button
  const ring = document.createElement('div');
  ring.className = 'shutter-ring';
  shutterBtn.appendChild(ring);
  ring.addEventListener('animationend', () => ring.remove(), { once: true });
  // Edge glow — force reflow to restart if fired rapidly
  edgeFlash.classList.remove('pop');

function toggleSessionMode() {
  isSessionMode = !isSessionMode;
  sessionBtn.classList.toggle('on', isSessionMode);
  sessionBtn.style.borderColor = isSessionMode ? 'var(--accent)' : '';
  sessionBtn.style.background  = isSessionMode ? 'var(--accent)' : '';
  sessionBtn.style.color       = isSessionMode ? 'var(--bg)' : '';
  shutterBtn.classList.toggle('session-mode', isSessionMode);
  updateSessionPill();
  if (isSessionMode) showToast(t('sessionOn'), 3000);
  else               showToast(t('sessionOff'));
}

function updateSessionPill() {
  const n = sessionPhotos.length;
  if (!isSessionMode && n === 0) { sessionPill.classList.remove('visible'); return; }
  sessionPill.classList.add('visible');
  sessionCount.textContent = `${n} / ${SESSION_MAX}`;
  sessionCount.classList.toggle('full', n >= SESSION_MAX);
  sessionViewBtn.textContent = n > 0 ? t('view') : '';
  sessionViewBtn.style.display = n > 0 ? '' : 'none';
  gallerySave.disabled = sessionPhotos.filter(p => p.selected).length === 0;
}

function addToSession(blob, meta = {}) {
  const url = URL.createObjectURL(blob);
  sessionPhotos.push({ blob, url, selected: true, isVideo: !!meta.isVideo, ext: meta.ext || 'png' });
  updateSessionPill();
  renderGalleryGrid();
  if (sessionPhotos.length >= SESSION_MAX) {
    showToast(t('sessionFull', SESSION_MAX), 3500);
    openGallery();
  }
}

function openGallery() {
  galleryOv.classList.remove('hidden');
  renderGalleryGrid();
  updateGalleryHeader();
}
function closeGallery() {
  galleryOv.classList.add('hidden');
}

function renderGalleryGrid() {
  galleryGrid.innerHTML = '';
  sessionPhotos.forEach((photo, i) => {
    const div = document.createElement('div');
    div.className = 'gthumb' + (photo.selected ? '' : ' off') + (photo.isVideo ? ' gvid' : '');
    const media = photo.isVideo
      ? `<video src="${photo.url}" muted playsinline preload="metadata"></video>
         <div class="gplay"><svg viewBox="0 0 14 14" fill="currentColor"><path d="M3 2l9 5-9 5z"/></svg></div>`
      : `<img src="${photo.url}" loading="lazy">`;
    div.innerHTML = `
      ${media}
      <div class="gcheck"><svg viewBox="0 0 10 10" fill="none"><polyline points="1.5,5 4,7.5 8.5,2" stroke="inherit" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="gnum">${i + 1}</span>`;
    div.addEventListener('click', () => {
      photo.selected = !photo.selected;
      div.classList.toggle('off', !photo.selected);
      updateGalleryHeader();
      updateSessionPill();
    });
    galleryGrid.appendChild(div);
  });
  updateGalleryHeader();
}

function updateGalleryHeader() {
  const n = sessionPhotos.length;
  const sel = sessionPhotos.filter(p => p.selected).length;
  galleryHdrSub.textContent = t('selectedOf', sel, n);
  gallerySave.textContent = sel > 0 ? t('savePhotos', sel) : t('saveSelected');
  gallerySave.disabled = sel === 0;
  gallerySelAll.textContent = sel === n && n > 0 ? t('deselectAll') : t('selectAll');
}

async function saveSessionPhotos() {
  const toSave = sessionPhotos.filter(p => p.selected);
  if (!toSave.length) return;
  const ts = timestamp();
  const items = toSave.map((p, i) => ({
    blob: p.blob,
    filename: `cam_session_${ts}_${i + 1}.${p.ext || 'png'}`,
  }));
  const ok = await saveBlobsBatch(items);
  if (!ok) return;
  const kept = sessionPhotos.filter(p => !p.selected);
  toSave.forEach(p => URL.revokeObjectURL(p.url));
  sessionPhotos = kept;
  updateSessionPill();
  renderGalleryGrid();
  if (sessionPhotos.length === 0) closeGallery();
  showToast(t('savedPhotos', toSave.length));
}

function clearSession() {
  sessionPhotos.forEach(p => URL.revokeObjectURL(p.url));
  sessionPhotos = [];
  updateSessionPill();
  renderGalleryGrid();
  closeGallery();
  showToast(t('sessionCleared'));
}

}

  soundEnabled = !soundEnabled;

}
function playShutterBlip() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    const sr = audioCtx.sampleRate;

    // Low body pulse — physical weight / the "gl"
    const body = audioCtx.createOscillator();
    const bodyGain = audioCtx.createGain();
    body.type = 'sine';
    body.frequency.value = 310;
    bodyGain.gain.setValueAtTime(0.0001, t0);
    bodyGain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.0008);
    bodyGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.016);
    body.connect(bodyGain).connect(audioCtx.destination);
    body.start(t0); body.stop(t0 + 0.02);

    // High-freq bandpassed noise — the crisp "ick" texture
    const n = Math.ceil(sr * 0.022);
    const nbuf = audioCtx.createBuffer(1, n, sr);
    const nd = nbuf.getChannelData(0);
    for (let i = 0; i < n; i++) nd[i] = (Math.random() * 2 - 1) * Math.exp(-i / (n * 0.28));
    const nsrc = audioCtx.createBufferSource();
    nsrc.buffer = nbuf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 4800; bp.Q.value = 1.8;
    const ng = audioCtx.createGain(); ng.gain.value = 0.2;
    nsrc.connect(bp).connect(ng).connect(audioCtx.destination);
    nsrc.start(t0);
  } catch {}
}

// ── Crop ───────────────────────────────────────────────────────────────────
function updateCropRegion() {
  const vp = viewport.getBoundingClientRect();
  const w = vp.width, h = vp.height;
  const minSz = 60;
  cropT = Math.max(0, Math.min(cropT, h - cropB - minSz));
  cropB = Math.max(0, Math.min(cropB, h - cropT - minSz));
  cropL = Math.max(0, Math.min(cropL, w - cropR - minSz));
  cropR = Math.max(0, Math.min(cropR, w - cropL - minSz));

  cropRegion.style.top    = cropT + 'px';
  cropRegion.style.left   = cropL + 'px';
  cropRegion.style.right  = cropR + 'px';
  cropRegion.style.bottom = cropB + 'px';

  cdTop.style.top       = cropT + 'px';
  cdBottom.style.bottom = cropB + 'px';
  cdLeft.style.left     = cropL + 'px';
  cdRight.style.right   = cropR + 'px';
}

function resetCrop() {
  cropT = cropB = cropL = cropR = 0;
  updateCropRegion();
}

function makeDraggable(el, onDrag) {
  let sx, sy, sv;
  function start(e) {
    const p = e.touches?.[0] || e;
    sx = p.clientX; sy = p.clientY;
    sv = { t: cropT, b: cropB, l: cropL, r: cropR };
    document.addEventListener('mousemove', move);
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
    e.preventDefault();
  }
  function move(e) {
    const p = e.touches?.[0] || e;
    onDrag(p.clientX - sx, p.clientY - sy, sv);
    updateCropRegion();
    e.preventDefault();
  }
  function end() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('touchmove', move);
    document.removeEventListener('mouseup', end);
    document.removeEventListener('touchend', end);
  }
  el.addEventListener('mousedown', start);
  el.addEventListener('touchstart', start, { passive: false });
}

function initCrop() {
  const vp = () => viewport.getBoundingClientRect();
  makeDraggable(cdTop,    (dx, dy, s) => { cropT = Math.max(0, s.t + dy); });
  makeDraggable(cdBottom, (dx, dy, s) => { cropB = Math.max(0, s.b - dy); });
  makeDraggable(cdLeft,   (dx, dy, s) => { cropL = Math.max(0, s.l + dx); });
  makeDraggable(cdRight,  (dx, dy, s) => { cropR = Math.max(0, s.r - dx); });
  // Double-tap viewport to reset crop
  let lastTap = 0;
  vpWrap.addEventListener('touchend', e => {
    if (currentRatio !== 'free') return;
    const now = Date.now();
    if (now - lastTap < 320) resetCrop();
    lastTap = now;
  });
  updateCropRegion();
}

// ── Settings ───────────────────────────────────────────────────────────────
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('cam_prefs') || '{}');
    applyTheme(THEMES.indexOf(s.theme) >= 0 ? THEMES.indexOf(s.theme) : 0, false);
    if (typeof s.mirrored === 'boolean') setMirror(s.mirrored, false);
    if (typeof s.customW === 'number') { customW = s.customW; customWInput.value = customW; }
    if (typeof s.customH === 'number') { customH = s.customH; customHInput.value = customH; }
    if (s.ratio) setRatio(s.ratio, false);
    if (typeof s.cf === 'boolean') {
      isCF = s.cf;
      cfTgl.classList.toggle('on', isCF);
    }
    if (s.cfColor) {
      cfColor = s.cfColor;
      cfPicker.value = cfColor;
      updateSwatchActive();
    }
    updateCFBorder();
    updateCFColorBtn();
    if (typeof s.leDurIdx === 'number' && s.leDurIdx >= 0 && s.leDurIdx <= 12) {
      leDurIdx = s.leDurIdx;
      leDurSldr.value = leDurIdx;
      updateLeDurDisplay();
    }
    if (s.leMode) setLeMode(s.leMode, false);
    if (typeof s.soundEnabled  === 'boolean') soundEnabled  = s.soundEnabled;
    if (typeof s.reviewModeOn  === 'boolean') reviewModeOn  = s.reviewModeOn;
    updateSoundBtn();
  } catch {
    applyTheme(0, false);
  }
}

function saveSettings() {
  try {
    localStorage.setItem('cam_prefs', JSON.stringify({
      theme: THEMES[themeIdx], mirrored: isMirrored, ratio: currentRatio, customW, customH,
      cf: isCF, cfColor, leDurIdx, leMode, lang: curLang, soundEnabled, reviewModeOn,
    }));
  } catch {}
}

// ── Slider gradient ────────────────────────────────────────────────────────
function pct(slider) {
  const min = parseFloat(slider.min) || 0;
  const max = parseFloat(slider.max) || 1;
  const val = parseFloat(slider.value);
  const p = Math.max(0, Math.min(100, ((val - min) / (max - min)) * 100));
  slider.style.setProperty('--pct', p.toFixed(1));
}

// ── Save: Web Share API on mobile (opens Save to Photos), download elsewhere ──
async function saveBlob(blob, filename) {
  const type = blob.type || 'image/png';
  try {
    const file = new File([blob], filename, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      return true;
    }
  } catch (err) {
    if (err.name === 'AbortError') return false;
  }
  const url = URL.createObjectURL(blob);
  dlLink.href = url;
  dlLink.download = filename;
  dlLink.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return true;
}

async function saveBlobsBatch(items) {
  try {
    const files = items.map(it => new File([it.blob], it.filename, { type: it.blob.type || 'image/png' }));
    if (navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ files });
      return true;
    }
  } catch (err) {
    if (err.name === 'AbortError') return false;
  }
  items.forEach((it, i) => {
    setTimeout(() => {
      const url = URL.createObjectURL(it.blob);
      dlLink.href = url; dlLink.download = it.filename;
      dlLink.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }, i * 80);
  });
  return true;
}

// ── Camera ─────────────────────────────────────────────────────────────────
function buildConstraints(deviceId) {
  if (!deviceId) {
    const mob = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    return { video: mob ? { facingMode: { ideal: 'environment' } } : { width:{ ideal:1920 }, height:{ ideal:1080 } }, audio: false };
  }
  const lbl = (devices.find(d => d.deviceId === deviceId)?.label || '').toLowerCase();
  const isFront = lbl.includes('front') || lbl.includes('facetime') ||
                  lbl.includes('facing front') || lbl.match(/\buser\b/);
  if (isFront) return { video: { facingMode: 'user' }, audio: false };
  return { video: { deviceId: { exact: deviceId } }, audio: false };
}

async function retryCameraAfterBusy(deviceId) {
  // Camera HAL on some ROMs needs time to release — two attempts with backoff
  const attempts = [
    [700,  buildConstraints(deviceId)],
    [1800, { video: true, audio: false }],
  ];
  for (const [delay, constraints] of attempts) {
    await new Promise(r => setTimeout(r, delay));
    try { return await navigator.mediaDevices.getUserMedia(constraints); }
    catch {}
  }
  return null;
}

async function startCamera(deviceId = null) {
  let ns;
  try {
    ns = await navigator.mediaDevices.getUserMedia(buildConstraints(deviceId));
  } catch (err) {
    if (err.name === 'OverconstrainedError' && deviceId) {
      try { ns = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { ideal: deviceId } }, audio: false }); }
      catch { showToast(t('camNotAccessible')); return; }
    } else if (err.name === 'NotReadableError') {
      showToast(t('camBusyRetry'), 2500);
      ns = await retryCameraAfterBusy(deviceId);
      if (!ns) return handleError(err);
    } else { return handleError(err); }
  }

  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = ns;
  const track = stream.getVideoTracks()[0];
  const ts = track?.getSettings() ?? {};
  const tl = track?.label ?? '';
  const matched = devices.find(d => d.deviceId === ts.deviceId) ?? devices.find(d => d.label === tl);
  currentDeviceId = matched?.deviceId ?? deviceId ?? ts.deviceId ?? null;

  if (deviceId && tl) showToast(tl, 2200);

  preview.srcObject = stream;
  ready = true;
  permOverlay.classList.add('hidden');
  errOverlay.classList.add('hidden');
  shutterBtn.classList.remove('off');
  recordBtn.classList.remove('off');

  await enumerateDevices();
  detectCapabilities();
}

async function enumerateDevices() {
  try {
    const all = await navigator.mediaDevices.enumerateDevices();
    const vids = all.filter(d => d.kind === 'videoinput');
    const seen = new Set();
    const unique = vids.filter(d => {
      const k = d.label.trim().toLowerCase() || d.deviceId;
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
    const labeled = unique.filter(d => d.label.trim() !== '');
    const raw = labeled.length >= 2 ? labeled : unique;
    // Sort: Selfie first, then Ultra/Wide/Tele, then Main, then others
    const typeOrder = { Selfie:0, Ultra:1, Wide:2, Tele:3, Main:4 };
    devices = [...raw].sort((a, b) => {
      const la = cameraLabel(a), lb = cameraLabel(b);
      const oa = typeOrder[la] ?? 5, ob = typeOrder[lb] ?? 5;
      return oa - ob;
    });
    renderCamSelector();
  } catch {}
}

function cameraLabel(device) {
  const raw = device.label || '';
  const l = raw.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (!l) return null;

  if (l.includes('periscop') || /\b[2-9](\.\d+)?x\b/.test(l) ||
      l.includes('telephoto') || l.includes('telefoto')) return 'Tele';
  // 'tele' alone but not 'telephone'
  if (/\btele\b/.test(l) && !l.includes('telephone')) return 'Tele';

  if (l.includes('grande angular') || l.includes('gran angular') ||
      l.includes('grand angle') || l.includes('weitwinkel') ||
      l.includes('grandangol') || l.includes('groothoek') ||
      l.includes('wide angle') || l.includes('ultra') ||
      l.includes('ultra-wide') || l.includes('ultrawide')) return 'Ultra';

  if (l.includes('front') || l.includes('frontal') || l.includes('selfie') ||
      l.includes('facetime') || l.includes('facing front') ||
      l.includes('avant') || l.includes('delantera') ||
      l.includes('anteriore') || l.includes('vorder') ||
      /\buser\b/.test(l)) return 'Selfie';

  if (l.includes('wide')) return 'Wide';

  if (l.includes('back') || l.includes('rear') || l.includes('environment') ||
      l.includes('facing back') || l.includes('traseira') || l.includes('traseiro') ||
      l.includes('trasero') || l.includes('arriere') || l.includes('hinten') ||
      l.includes('posteriore') || l.includes('principal') ||
      l.includes('dual') || l.includes('triple') || l.includes('fusion') ||
      /\bmain\b/.test(l)) return 'Main';

  const clean = raw.replace(/\s*\(.*?\)\s*/g, '').trim();
  return clean.length > 18 ? null : (clean || null);
}

function renderCamSelector() {
  camSel.innerHTML = '';
  if (devices.length < 2) return;

  const rawLabels = devices.map(d => cameraLabel(d));
  const counts = {};
  rawLabels.forEach(l => { if (l) counts[l] = (counts[l] || 0) + 1; });
  const used = {};

  devices.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'pill' + (d.deviceId === currentDeviceId ? ' active' : '');
    let lbl = rawLabels[i];
    if (!lbl) {
      lbl = d.label ? d.label.split(/\s+/)[0].slice(0, 10) : `Cam ${i + 1}`;
    } else if (counts[lbl] > 1) {
      used[lbl] = (used[lbl] || 0) + 1;
      lbl = `${lbl} ${used[lbl]}`;
    }
    btn.textContent = lbl;
    btn.title = d.label || '';
    btn.addEventListener('click', () => {
      if (d.deviceId === currentDeviceId) return;
      if (isRecording) stopRecording();
      startCamera(d.deviceId);
    });
    camSel.appendChild(btn);
  });
}

// ── Capabilities ───────────────────────────────────────────────────────────
function detectCapabilities() {
  const track = stream?.getVideoTracks()[0];
  isTorchOn = false;
  torchTgl.classList.remove('on');
  if (!deviceHasTorch) torchTgl.style.display = 'none';
  zoomRow.style.display    = 'none';
  evRow.style.display      = 'none';
  expTimeRow.style.display = 'none';
  isoRow.style.display     = 'none';
  focusRow.style.display   = 'none';
  focusMin = 0; focusMax = 0;
  expTimeMin = 0; expTimeMax = 0;
  isoMin = 0; isoMax = 0;
  expTimeSldr.value = 0; expTimeVal.textContent = t('auto');
  isoSldr.value     = 0; isoVal.textContent     = t('auto');
  focusSldr.value   = 0; focusVal.textContent   = t('auto');

  if (!track?.getCapabilities) return;
  const caps = track.getCapabilities();

  if (caps.torch) { deviceHasTorch = true; torchTgl.style.display = ''; }

  if (caps.zoom) {
    zoomSlider.min   = caps.zoom.min  ?? 1;
    zoomSlider.max   = caps.zoom.max  ?? 10;
    zoomSlider.step  = caps.zoom.step ?? 0.1;
    zoomSlider.value = caps.zoom.min  ?? 1;
    zoomVal.textContent = parseFloat(zoomSlider.value).toFixed(1) + '×';
    pct(zoomSlider);
    zoomRow.style.display = '';
  }

  if (caps.exposureCompensation) {
    evSlider.min   = caps.exposureCompensation.min  ?? -3;
    evSlider.max   = caps.exposureCompensation.max  ?? 3;
    evSlider.step  = caps.exposureCompensation.step ?? 0.5;
    evSlider.value = 0; evVal.textContent = '0';
    pct(evSlider);
    evRow.style.display = '';
  }

  if (Array.isArray(caps.exposureMode) && caps.exposureMode.includes('manual')) {
    if (caps.exposureTime) {
      expTimeMin      = caps.exposureTime.min ?? 100;
      expTimeMax      = caps.exposureTime.max ?? 1000000;
      expTimeLogMin   = Math.log(expTimeMin);
      expTimeLogRange = Math.log(expTimeMax) - expTimeLogMin;
      expTimeRow.style.display = '';
    }
    if (caps.iso) {
      isoMin = caps.iso.min ?? 50;
      isoMax = caps.iso.max ?? 3200;
      isoRow.style.display = '';
    }
  }

  const fmodes = caps.focusMode ?? [];
  const hasManualFocus = (Array.isArray(fmodes) ? fmodes : Object.values(fmodes)).includes('manual');
  if (hasManualFocus && caps.focusDistance?.max !== undefined) {
    focusMin = caps.focusDistance.min ?? 0;
    focusMax = caps.focusDistance.max ?? 1;
    focusRow.style.display = '';
  }
}

// ── Zoom ───────────────────────────────────────────────────────────────────
async function applyZoom(val) {
  const track = stream?.getVideoTracks()[0];
  if (!track) return;
  try { await track.applyConstraints({ advanced: [{ zoom: parseFloat(val) }] }); } catch {}
}

// ── Focus (0 = auto) ───────────────────────────────────────────────────────
function fmtFocus(v) {
  if (v <= 0.01) return t('auto');
  const m = focusMax - v * (focusMax - focusMin);
  if (m >= focusMax * 0.95) return '∞';
  if (m >= 1) return m.toFixed(1) + 'm';
  return Math.round(m * 100) + 'cm';
}
async function applyFocus(v) {
  const track = stream?.getVideoTracks()[0];
  if (!track) return;
  try {
    if (v <= 0.01) {
      await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    } else {
      const m = focusMax - v * (focusMax - focusMin);
      await track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: m }] });
    }
  } catch {}
}

// ── EV ────────────────────────────────────────────────────────────────────
async function applyEV(val) {
  const track = stream?.getVideoTracks()[0];
  if (!track) return;
  try { await track.applyConstraints({ advanced: [{ exposureCompensation: parseFloat(val) }] }); } catch {}
}

// ── Exposure time (0 = auto) ───────────────────────────────────────────────
function logSliderToExpTime(t) {
  if (t <= 0.01 || !expTimeMax) return null;
  return Math.exp(expTimeLogMin + t * expTimeLogRange);
}
function fmtExpTime(us) {
  if (us === null) return t('auto');
  const s = us / 1e6;
  if (s >= 1) return s.toFixed(1) + 's';
  return `1/${Math.round(1 / s)}s`;
}
async function applyExpTime(t) {
  const us = logSliderToExpTime(parseFloat(t));
  expTimeVal.textContent = fmtExpTime(us);
  pct(expTimeSldr);
  const track = stream?.getVideoTracks()[0];
  if (!track) return;
  try {
    if (us === null) await track.applyConstraints({ advanced: [{ exposureMode: 'continuous' }] });
    else             await track.applyConstraints({ advanced: [{ exposureMode: 'manual', exposureTime: us }] });
  } catch {}
}

// ── ISO (0 = auto) ─────────────────────────────────────────────────────────
function logSliderToISO(t) {
  if (t <= 0.01 || !isoMax) return null;
  return Math.round(isoMin + t * (isoMax - isoMin));
}
async function applyISO(t) {
  const iso = logSliderToISO(parseFloat(t));
  isoVal.textContent = iso === null ? t('auto') : iso.toString();
  pct(isoSldr);
  const track = stream?.getVideoTracks()[0];
  if (!track) return;
  try {
    if (iso === null) await track.applyConstraints({ advanced: [{ exposureMode: 'continuous' }] });
    else             await track.applyConstraints({ advanced: [{ exposureMode: 'manual', iso }] });
  } catch {}
}

function applyCustomRatio() {
  customW = Math.max(1, Math.min(99, parseInt(customWInput.value) || 16));
  customH = Math.max(1, Math.min(99, parseInt(customHInput.value) || 9));
  customWInput.value = customW;
  customHInput.value = customH;

// ── Long exposure ──────────────────────────────────────────────────────────
function updateLeDurDisplay() {
  const dur = LE_DURS[leDurIdx];
  if (dur === null) {
    leDurVal.textContent = t('off');
    leModeRow.style.display = 'none';
    shutterBtn.classList.remove('le-mode');
  } else {
    leDurVal.textContent = dur < 1 ? '½s' : dur + 's';
    leModeRow.style.display = '';
    shutterBtn.classList.add('le-mode');
  }
  pct(leDurSldr);
}
function setLeMode(mode, save = true) {
  leMode = mode;
  document.querySelectorAll('#leModeRow .pill').forEach(p =>
    p.classList.toggle('active', p.dataset.leMode === mode));

async function startLongExposure() {
  if (!ready || leCapturing) return;
  leCapturing = true;
  shutterBtn.classList.add('le-capturing');
  leOverlay.classList.remove('hidden');

  const vw = preview.videoWidth, vh = preview.videoHeight;
  const scale = Math.min(1, 1920 / Math.max(vw, vh, 1));
  leW = Math.round(vw * scale); leH = Math.round(vh * scale);
  leTotalMs = LE_DURS[leDurIdx] * 1000;
  leElapsed = 0; leFrameCount = 0;

  const fps = leTotalMs <= 5000 ? 10 : leTotalMs <= 30000 ? 5 : 2;
  const frameMs = 1000 / fps;

  if (leMode === 'average') {
    leAccum = new Float32Array(leW * leH * 4);
  } else {
    leStackCanvas = document.createElement('canvas');
    leStackCanvas.width = leW; leStackCanvas.height = leH;
    leStackCtx = leStackCanvas.getContext('2d');
    leStackCtx.fillStyle = leMode === 'trails' ? '#000' : '#fff';
    leStackCtx.fillRect(0, 0, leW, leH);
  }
  const tmp = document.createElement('canvas');
  tmp.width = leW; tmp.height = leH;
  const tmpCtx = tmp.getContext('2d', { willReadFrequently: leMode === 'average' });

  leInterval = setInterval(() => {
    if (!leCapturing) return;
    leElapsed += frameMs;
    const prog = Math.min(leElapsed / leTotalMs, 1);
    leBarFill.style.width = (prog * 100) + '%';
    leTimer.textContent = Math.max(0, (leTotalMs - leElapsed) / 1000).toFixed(1) + 's';
    tmpCtx.drawImage(preview, 0, 0, leW, leH);
    leFrameCount++;
    if (leMode === 'average') {
      const d = tmpCtx.getImageData(0, 0, leW, leH).data;
      const a = 1 / leFrameCount;
      for (let i = 0; i < d.length; i++) leAccum[i] += (d[i] - leAccum[i]) * a;
    } else if (leMode === 'trails') {
      leStackCtx.globalCompositeOperation = 'screen';
      leStackCtx.drawImage(tmp, 0, 0);
    } else {
      leStackCtx.globalCompositeOperation = 'multiply';
      leStackCtx.drawImage(tmp, 0, 0);
    }
    if (leElapsed >= leTotalMs) finishLongExposure();
  }, frameMs);
}

function finishLongExposure() {
  if (!leCapturing) return;
  clearInterval(leInterval);
  leCapturing = false;
  shutterBtn.classList.remove('le-capturing');
  leOverlay.classList.add('hidden');
  capCanvas.width = leW; capCanvas.height = leH;
  const ctx = capCanvas.getContext('2d');
  if (leMode === 'average' && leAccum) {
    const img = ctx.createImageData(leW, leH);
    for (let i = 0; i < leAccum.length; i++) img.data[i] = Math.round(leAccum[i]);
    ctx.putImageData(img, 0, 0);
  } else if (leStackCanvas) {
    ctx.drawImage(leStackCanvas, 0, 0);
  }
  capCanvas.toBlob(blob => {
    saveBlob(blob, `cam_le_${LE_DURS[leDurIdx]}s_${leMode}_${timestamp()}.png`);
  }, 'image/png');
  navigator.vibrate?.(70); flash();
  leAccum = null; leStackCanvas = null; leStackCtx = null;
}

function cancelLongExposure() {
  clearInterval(leInterval);
  leCapturing = false;
  shutterBtn.classList.remove('le-capturing');
  leOverlay.classList.add('hidden');
  leAccum = null; leStackCanvas = null;
  showToast(t('expCancelled'));
}

// ── Photo capture ──────────────────────────────────────────────────────────
async function capturePhoto() {
  if (!ready || isRecording) return;

  if (LE_DURS[leDurIdx] !== null) {
    leCapturing ? cancelLongExposure() : startLongExposure();
    return;
  }

  // Color frame: light up screen with chosen color to illuminate face
  if (isCF) {
    cfOverlay.style.backgroundColor = cfColor;
    cfOverlay.style.display = 'block';
    // Two rAF = guaranteed paint before capture
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await new Promise(r => setTimeout(r, 280));
  }

  const vw = preview.videoWidth, vh = preview.videoHeight;
  if (!vw || !vh) { cfOverlay.style.display = 'none'; return; }

  let cw = vw, ch = vh, sx = 0, sy = 0;
  if (currentRatio === 'free' && (cropT || cropB || cropL || cropR)) {
    // Apply crop — map viewport pixels → video pixels
    const vpRect = viewport.getBoundingClientRect();
    const scaleX = vw / vpRect.width, scaleY = vh / vpRect.height;
    sx = Math.round(cropL * scaleX);
    sy = Math.round(cropT * scaleY);
    cw = Math.round((vpRect.width  - cropL - cropR) * scaleX);
    ch = Math.round((vpRect.height - cropT - cropB) * scaleY);
  } else if (currentRatio !== 'free') {
    const [rw, rh] = currentRatio === 'custom'
      ? [customW, customH]
      : currentRatio.split(':').map(Number);
    const ar = rw / rh, vAR = vw / vh;
    if (ar > vAR) { cw = vw; ch = Math.round(vw / ar); }
    else          { ch = vh; cw = Math.round(vh * ar); }
    sx = (vw - cw) / 2; sy = (vh - ch) / 2;
  }

  capCanvas.width = cw; capCanvas.height = ch;
  const ctx = capCanvas.getContext('2d');
  if (isMirrored) {
    ctx.save(); ctx.scale(-1, 1);
    ctx.drawImage(preview, sx, sy, cw, ch, -cw, 0, cw, ch);
    ctx.restore();
  } else {
    ctx.drawImage(preview, sx, sy, cw, ch, 0, 0, cw, ch);
  }

  const facingMode = stream?.getVideoTracks()[0]?.getSettings()?.facingMode;
  const devLabel   = devices.find(d => d.deviceId === currentDeviceId)?.label ?? '';
  const isFront    = facingMode === 'user' || cameraLabel({ label: devLabel }) === 'Selfie';
  if (!isCF && !isFront) flash();
  navigator.vibrate?.([25, 0, 12]);
  if (soundEnabled) playShutterBlip();
  triggerCaptureAnim();
  shutterBtn.classList.add('pressing');
  setTimeout(() => shutterBtn.classList.remove('pressing'), 150);
  if (isCF) setTimeout(() => { cfOverlay.style.display = 'none'; }, 450);

  capCanvas.toBlob(blob => {
    if (reviewModeOn) { openReview(blob); return; }
    if (isSessionMode) {
      if (sessionPhotos.length >= SESSION_MAX) {
        showToast(t('sessionFullSave'), 3000);
        openGallery();
        return;
      }
      addToSession(blob);
    } else {
      saveBlob(blob, `cam_${timestamp()}.png`);
      if (!localStorage.getItem('cam_save_ok')) {
        localStorage.setItem('cam_save_ok', '1');
        showToast(t('photoReady'));
      }
    }
  }, 'image/png');
}

// ── Video recording ────────────────────────────────────────────────────────
async function startRecording() {
  if (!ready || !stream || isRecording) return;
  // Request the mic separately with high-quality, unprocessed audio
  audioStream = null;
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl:  false,
        sampleRate:       48000,
        sampleSize:       16,
        channelCount:     2,
      },
      video: false,
    });
  } catch (err) {
    if (err.name === 'NotAllowedError') { showToast(t('micBlocked'), 3000); }
    else { showToast(t('noMic'), 2400); }
  }

  const tracks = [...stream.getVideoTracks(), ...(audioStream?.getAudioTracks() ?? [])];
  const recStream = new MediaStream(tracks);

  recordedChunks = [];
  const types = ['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=h264,opus','video/webm;codecs=vp9,opus','video/webm'];
  const mime = types.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch { return false; } }) || '';
  const opts = mime ? { mimeType: mime } : {};
  opts.videoBitsPerSecond = 8_000_000;     // ~8 Mbps video
  opts.audioBitsPerSecond = 192_000;       // 192 kbps audio (stereo, transparent quality)
  try { mediaRecorder = new MediaRecorder(recStream, opts); }
  catch {
    try { mediaRecorder = new MediaRecorder(recStream, { mimeType: mime }); }
    catch { mediaRecorder = new MediaRecorder(recStream); }
  }
  mediaRecorder.ondataavailable = e => { if (e.data?.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = saveVideo;
  mediaRecorder.start(250);
  isRecording = true; recSecs = 0;
  recTimer.classList.add('visible'); recBadge.classList.add('visible');
  updateRecTimer();
  recInterval = setInterval(() => { recSecs++; updateRecTimer(); }, 1000);
  recordBtn.classList.add('recording');
  recordIcon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2"/>';
  shutterBtn.classList.add('off');
  navigator.vibrate?.([40,30,40]);
}
function stopRecording() {
  if (!isRecording || !mediaRecorder) return;
  mediaRecorder.stop(); isRecording = false;
  clearInterval(recInterval);
  audioStream?.getTracks().forEach(t => t.stop());
  audioStream = null;
  recTimer.classList.remove('visible'); recBadge.classList.remove('visible');
  recordBtn.classList.remove('recording');
  recordIcon.innerHTML = '<circle cx="12" cy="12" r="7"/>';
  shutterBtn.classList.remove('off');
  navigator.vibrate?.(70);
}
function saveVideo() {
  const mime = mediaRecorder?.mimeType || 'video/webm';
  const ext  = mime.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(recordedChunks, { type: mime });
  const filename = `cam_${timestamp()}.${ext}`;
  if (isSessionMode) {
    if (sessionPhotos.length >= SESSION_MAX) {
      showToast(t('sessionFullSave'), 3000);
      openGallery();
      saveBlob(blob, filename);
      return;
    }
    addToSession(blob, { isVideo: true, ext, filename });
  } else {
    saveBlob(blob, filename);
  }
}
function updateRecTimer() {
  const m = Math.floor(recSecs / 60), s = recSecs % 60;
  recTimer.textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

// ── Helpers ────────────────────────────────────────────────────────────────
function flash() {
  capFlash.classList.add('flash');
  setTimeout(() => capFlash.classList.remove('flash'), 200);
}
function timestamp() {
  return new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
}
function showError(msg) {
  errMsg.textContent = msg;
  permOverlay.classList.add('hidden');
  errOverlay.classList.remove('hidden');
  shutterBtn.classList.add('off'); recordBtn.classList.add('off');
  ready = false;
}
function handleError(err) {
  if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')
    showError(t('camDenied'));
  else if (err.name === 'NotFoundError')
    showError(t('noCamFound'));
  else if (err.name === 'NotReadableError')
    showError(t('camBusy'));
  else
    showError(t('camStartFail', err.message || err.name));
}

// ── Key handler (volume rocker) ────────────────────────────────────────────
function onKey(e) {
  if (e.key === 'Escape' && cfPopupOpen) { closeCFPopup(); return; }
  // Review overlay shortcuts
  if (!reviewOverlay.classList.contains('hidden')) {
    if (e.key === 'Escape') { e.preventDefault(); closeReview(); return; }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); commitReview(); return; }
  }
  const isVol = e.key === 'AudioVolumeUp'   || e.key === 'AudioVolumeDown' ||
                e.key === 'VolumeUp'         || e.key === 'VolumeDown' ||
                e.code === 'AudioVolumeUp'   || e.code === 'AudioVolumeDown';
  if (!isVol) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  if (ready && !isRecording && !shutterBtn.classList.contains('off')) capturePhoto();
}

// ── Bindings ───────────────────────────────────────────────────────────────
function bindControls() {
  shutterBtn.addEventListener('click', () => {
    if (!shutterBtn.classList.contains('off')) capturePhoto();
  });
  recordBtn.addEventListener('click', () => {
    if (!recordBtn.classList.contains('off')) isRecording ? stopRecording() : startRecording();
  });

  mirrorTgl.addEventListener('click',     () => setMirror(!isMirrored));
  torchTgl.addEventListener('click',      () => setTorch(!isTorchOn));
  cfTgl.addEventListener('click',         () => setCF(!isCF));
  cfColorBtn.addEventListener('click',    (e) => { e.stopPropagation(); toggleCFPopup(); });
  leCancelBtn.addEventListener('click',   cancelLongExposure);
  sessionBtn.addEventListener('click',    toggleSessionMode);
  sessionViewBtn.addEventListener('click',openGallery);
  galleryClose.addEventListener('click',  closeGallery);
  gallerySave.addEventListener('click',   saveSessionPhotos);
  galleryClear.addEventListener('click',  clearSession);
  gallerySelAll.addEventListener('click', () => {
    const allSelected = sessionPhotos.every(p => p.selected);
    sessionPhotos.forEach(p => p.selected = !allSelected);
    renderGalleryGrid();
    updateSessionPill();
  });
  fsBtn.addEventListener('click',         toggleFullscreen);
  themeBtn.addEventListener('click',      () => applyTheme(themeIdx + 1));
  langBtn.addEventListener('click',       cycleLang);
  soundBtn.addEventListener('click',      toggleSound);
  reviewModeBtn.addEventListener('click', toggleReviewMode);
  reviewSaveBtn.addEventListener('click', commitReview);
  reviewDiscardBtn.addEventListener('click', closeReview);
  capHideBtn.addEventListener('click',    toggleControls);
  permBtn.addEventListener('click',       () => startCamera());
  blindBtn.addEventListener('click',      toggleBlindMode);
  retryBtn.addEventListener('click', () => {
    errOverlay.classList.add('hidden');
    permOverlay.classList.remove('hidden');
    startCamera();
  });

  zoomSlider.addEventListener('input', () => {
    zoomVal.textContent = parseFloat(zoomSlider.value).toFixed(1) + '×';
    pct(zoomSlider);
    applyZoom(zoomSlider.value);
  });
  focusSldr.addEventListener('input', () => {
    const v = parseFloat(focusSldr.value);
    focusVal.textContent = fmtFocus(v);
    pct(focusSldr);
    applyFocus(v);
  });
  evSlider.addEventListener('input', () => {
    const v = parseFloat(evSlider.value);
    evVal.textContent = v > 0 ? `+${v}` : `${v}`;
    pct(evSlider);
    applyEV(v);
  });
  expTimeSldr.addEventListener('input', () => applyExpTime(expTimeSldr.value));
  isoSldr.addEventListener('input',     () => applyISO(isoSldr.value));
  leDurSldr.addEventListener('input', () => {
    leDurIdx = parseInt(leDurSldr.value);
    updateLeDurDisplay();
    saveSettings();
  });

  document.querySelectorAll('#ratioSelector .pill').forEach(b =>
    b.addEventListener('click', () => setRatio(b.dataset.ratio)));
  customWInput.addEventListener('change', () => { applyCustomRatio(); saveSettings(); });
  customHInput.addEventListener('change', () => { applyCustomRatio(); saveSettings(); });
  document.querySelectorAll('#leModeRow .pill').forEach(b =>
    b.addEventListener('click', () => setLeMode(b.dataset.leMode)));
  document.querySelectorAll('.swatch:not(.swatch-custom)').forEach(s =>
    s.addEventListener('click', () => { setCFColor(s.dataset.color); updateCFColorBtn(); closeCFPopup(); }));
  cfPicker.addEventListener('input', () => {
    cfColor = cfPicker.value;
    customSwatch.style.background = cfColor;
    document.querySelectorAll('.swatch:not(.swatch-custom)').forEach(s => s.classList.remove('active'));
    customSwatch.classList.add('active');
    updateCFBorder();
    updateCFColorBtn();
  });
  cfPicker.addEventListener('change', saveSettings);

  // Close CF popup on outside click
  document.addEventListener('click', (e) => {
    if (cfPopupOpen && !cfPopup.contains(e.target) && e.target !== cfColorBtn) closeCFPopup();
  });

  // Volume rocker → shutter (capture phase for priority, passive:false for preventDefault)
  document.addEventListener('keydown', onKey, { capture: true, passive: false });
  window.addEventListener('keydown',   onKey, { capture: true, passive: false });

  navigator.mediaDevices?.addEventListener?.('devicechange', enumerateDevices);
}

init();
</script>
