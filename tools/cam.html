<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>cam — luci.cat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=JetBrains+Mono:wght@400;500&family=Metamorphous&family=Cabin+Sketch:wght@400;700&family=Silkscreen:wght@400;700&family=Fascinate&display=swap" rel="stylesheet">
<style>
:root,body[data-theme="dark"]{--bg:#000000;--surface:#0c0f15;--surface2:#181d27;--surface3:#2a3142;--border:#525a6c;--border-hover:#7a8294;--text:#ffffff;--text-muted:#c4ccd8;--text-dim:#8a92a0;--accent:#ffb070;--accent-dim:rgba(255,176,112,.18);--accent-glow:rgba(255,176,112,.55);--danger:#ff8a8a;--radius:12px;--radius-sm:8px;--shadow:0 4px 28px rgba(0,0,0,.85)}
body[data-theme="dim"]{--bg:#101216;--surface:#181b20;--surface2:#1f2228;--surface3:#272a31;--border:#2e3239;--border-hover:#3e434b;--text:#d8dae0;--text-muted:#8a8e9a;--text-dim:#5c606c;--accent:#e89854;--accent-dim:rgba(232,152,84,.13);--accent-glow:rgba(232,152,84,.28);--danger:#cf6b6b;--radius:12px;--radius-sm:8px;--shadow:0 4px 24px rgba(0,0,0,.5)}
body[data-theme="light"]{--bg:#f4f2ef;--surface:#ffffff;--surface2:#f0eee9;--surface3:#e6e3dd;--border:#d4d0c8;--border-hover:#b8b4ac;--text:#2c2a26;--text-muted:#6b6860;--text-dim:#9c9890;--accent:#c47138;--accent-dim:rgba(196,113,56,.1);--accent-glow:rgba(196,113,56,.2);--danger:#c45050;--radius:12px;--radius-sm:8px;--shadow:0 4px 20px rgba(0,0,0,.08)}
body[data-theme="cottage"]{--bg:#f3eadb;--surface:#fbf6ec;--surface2:#ebe0cd;--surface3:#dfd2bb;--border:#c9b896;--border-hover:#a89377;--text:#3d2f22;--text-muted:#7a6450;--text-dim:#a89377;--accent:#c79090;--accent-dim:rgba(199,144,144,.14);--accent-glow:rgba(199,144,144,.28);--danger:#b56b5a;--radius:16px;--radius-sm:12px;--shadow:0 4px 20px rgba(120,85,45,.1)}
body[data-theme="evil"]{--bg:#08040a;--surface:#0e060c;--surface2:#180a14;--surface3:#22101c;--border:#3c1428;--border-hover:#5c1e3a;--text:#e8c0cc;--text-muted:#a87088;--text-dim:#6c3850;--accent:#dc2040;--accent-dim:rgba(220,32,64,.15);--accent-glow:rgba(220,32,64,.35);--danger:#ff2848;--radius:10px;--radius-sm:7px;--shadow:0 4px 30px rgba(220,0,40,.2)}
body[data-theme="nonchalant"]{--bg:#1e2420;--surface:#262d28;--surface2:#2e3630;--surface3:#3a4238;--border:#3d4a3e;--border-hover:#556253;--text:#d4d9ce;--text-muted:#9aa696;--text-dim:#6b7668;--accent:#8fb380;--accent-dim:rgba(143,179,128,.14);--accent-glow:rgba(143,179,128,.25);--danger:#c78a6b;--radius:12px;--radius-sm:9px;--shadow:0 4px 20px rgba(20,30,20,.3)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);font-size:15px;line-height:1.5}

.app{
  display:flex;flex-direction:column;
  height:100dvh;height:100vh;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}

/* ── Header ── */
.header{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px 8px;
  background:var(--bg);
  flex-shrink:0;z-index:10;
}
.header h1{
  font-family:'Silkscreen',monospace;font-size:22px;font-weight:400;letter-spacing:1px;
  background:linear-gradient(135deg,var(--accent),#7eaad4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
body[data-theme="light"] .header h1{background:linear-gradient(135deg,#e89854,#f0c474);-webkit-background-clip:text;background-clip:text}
body[data-theme="cottage"] .header h1{font-family:'Cabin Sketch',cursive;font-weight:700;font-size:24px;background:linear-gradient(135deg,#c79090,#9caf88);-webkit-background-clip:text;background-clip:text}
body[data-theme="evil"] .header h1{font-family:'Metamorphous',serif;font-size:20px;background:linear-gradient(135deg,#dc2040,#880020);-webkit-background-clip:text;background-clip:text}
body[data-theme="nonchalant"] .header h1{font-family:'Fascinate',cursive;font-size:18px;background:linear-gradient(135deg,#8fb380,#a8a070);-webkit-background-clip:text;background-clip:text}
.header-spacer{flex:1}
.icon-btn{
  width:34px;height:34px;flex-shrink:0;
  border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface2);color:var(--text-muted);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;padding:0;
}
.icon-btn:hover,.icon-btn:active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.icon-btn svg{width:17px;height:17px;display:block}

/* ── Viewport ── */
.viewport-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  background:#000;overflow:hidden;min-height:0;
}
.viewport{
  position:relative;background:#000;overflow:hidden;
  max-width:100%;max-height:100%;
}
.viewport[data-ratio="free"]{width:100%;height:100%}
.viewport[data-ratio="1:1"] {aspect-ratio:1/1;  width:100%;height:auto;max-height:100%}
.viewport[data-ratio="4:3"] {aspect-ratio:4/3;  width:100%;height:auto;max-height:100%}
.viewport[data-ratio="3:4"] {aspect-ratio:3/4;  height:100%;width:auto;max-width:100%}
.viewport[data-ratio="16:9"]{aspect-ratio:16/9; width:100%;height:auto;max-height:100%}
.viewport[data-ratio="9:16"]{aspect-ratio:9/16; height:100%;width:auto;max-width:100%}

#preview{width:100%;height:100%;object-fit:cover;display:block;background:#000}
#preview.mirrored{transform:scaleX(-1)}

/* Flash */
.capture-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;transition:opacity .05s}
.capture-flash.flash{opacity:.85}

/* REC badge */
.rec-badge{
  position:absolute;top:14px;left:14px;
  display:none;align-items:center;gap:6px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  color:#ff3333;font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:500;letter-spacing:1.5px;
  padding:5px 10px;border-radius:20px;z-index:4;
}
.rec-badge.visible{display:flex}
.rec-dot{width:7px;height:7px;border-radius:50%;background:#ff3333;animation:recBlink 1s ease-in-out infinite}
@keyframes recBlink{0%,100%{opacity:1}50%{opacity:0}}

/* Overlay (permission / error) */
.overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:10;padding:28px;text-align:center;color:#fff;
}
.overlay.hidden{display:none}
.overlay-icon{width:60px;height:60px;opacity:.55;margin-bottom:4px}
.overlay p{font-size:15px;color:rgba(255,255,255,.75);max-width:260px;line-height:1.5}
.perm-btn{
  margin-top:6px;padding:12px 30px;
  background:var(--accent);color:#000;
  border:none;border-radius:var(--radius);
  font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;
  transition:opacity .15s;
}
.perm-btn:active{opacity:.8}

/* ── Controls ── */
.controls{
  background:var(--bg);
  padding:10px 16px 12px;flex-shrink:0;
  display:flex;flex-direction:column;gap:9px;
  border-top:1px solid var(--border);
}

/* Pill rows */
.pill-row{
  display:flex;gap:6px;flex-wrap:nowrap;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.pill-row::-webkit-scrollbar{display:none}
.pill{
  flex-shrink:0;padding:6px 14px;border-radius:20px;
  border:1px solid var(--border);background:var(--surface2);
  color:var(--text-muted);font-family:inherit;font-size:13px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.pill:hover{border-color:var(--border-hover);color:var(--text)}
.pill.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

/* Settings row */
.settings-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* Toggle */
.toggle-group{display:flex;align-items:center;gap:8px}
.toggle-label{font-size:13px;color:var(--text-muted);font-weight:500;white-space:nowrap;user-select:none}
.toggle-btn{
  width:44px;height:26px;border-radius:13px;
  border:1px solid var(--border);background:var(--surface2);
  cursor:pointer;position:relative;transition:all .2s;padding:0;flex-shrink:0;
}
.toggle-btn::after{
  content:'';position:absolute;top:3px;left:3px;
  width:18px;height:18px;border-radius:50%;
  background:var(--text-dim);transition:all .2s;
}
.toggle-btn[aria-pressed="true"]{background:var(--accent-dim);border-color:var(--accent)}
.toggle-btn[aria-pressed="true"]::after{background:var(--accent);transform:translateX(18px)}

/* Exposure */
.exposure-group{display:flex;align-items:center;gap:8px;flex:1;min-width:160px}
.exposure-label{font-size:13px;color:var(--text-muted);font-weight:500;white-space:nowrap}
#exposureSlider{
  flex:1;height:4px;cursor:pointer;
  accent-color:var(--accent);
}
.exposure-val{font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text-muted);min-width:30px;text-align:right}

/* Capture row */
.capture-row{display:flex;align-items:center;justify-content:center;gap:22px;padding:4px 0 2px}

.shutter-btn{
  width:68px;height:68px;flex-shrink:0;border-radius:50%;
  border:3px solid var(--accent);background:transparent;
  cursor:pointer;position:relative;transition:all .12s;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.shutter-btn::after{
  content:'';width:56px;height:56px;border-radius:50%;
  background:var(--text);transition:all .12s;
}
.shutter-btn:active::after,.shutter-btn.pressing::after{width:48px;height:48px}
.shutter-btn.off{opacity:.35;cursor:not-allowed}

.record-btn{
  width:50px;height:50px;flex-shrink:0;border-radius:50%;
  border:2px solid var(--border);background:var(--surface2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;padding:0;
}
.record-btn:hover{border-color:var(--danger)}
.record-btn.recording{border-color:var(--danger);background:rgba(220,32,64,.12)}
.record-btn.off{opacity:.35;cursor:not-allowed}
.record-btn svg{width:22px;height:22px;color:var(--danger);display:block}

/* Thumbnail */
.thumb{
  width:50px;height:50px;flex-shrink:0;border-radius:var(--radius-sm);
  border:1px solid var(--border);overflow:hidden;cursor:pointer;
  background:var(--surface2);display:flex;align-items:center;justify-content:center;
  transition:border-color .15s;
}
.thumb:hover{border-color:var(--border-hover)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:20px;height:20px;color:var(--text-dim)}

/* Rec timer */
.rec-timer-row{display:flex;justify-content:center;height:16px}
.rec-timer{font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--danger);display:none}
.rec-timer.visible{display:block}

/* Landscape */
@media(orientation:landscape){
  .app{flex-direction:row}
  .header{
    flex-direction:column;width:56px;padding:12px 8px;
    border-right:1px solid var(--border);border-top:none;
  }
  .header-spacer{flex:1}
  .viewport-wrap{flex:1}
  .controls{
    width:190px;border-top:none;border-left:1px solid var(--border);
    overflow-y:auto;padding:12px 14px;
  }
}

/* Smaller phones / shorter screens */
@media(max-height:640px){
  .header{padding:6px 12px 4px}
  .header h1{font-size:18px}
  .controls{gap:6px;padding:8px 14px 10px}
  .shutter-btn{width:58px;height:58px}
  .shutter-btn::after{width:46px;height:46px}
  .record-btn,.thumb{width:44px;height:44px}
}
</style>
</head>
<body data-theme="dark">
<div class="app">

  <!-- Header -->
  <div class="header">
    <h1>cam</h1>
    <span class="header-spacer"></span>
    <button class="icon-btn" id="themeBtn" title="cycle theme" aria-label="cycle theme">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="10" cy="10" r="3.5"/>
        <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>

  <!-- Viewport -->
  <div class="viewport-wrap">
    <div class="viewport" id="viewport" data-ratio="free">
      <video id="preview" autoplay playsinline muted></video>
      <div class="capture-flash" id="captureFlash"></div>
      <div class="rec-badge" id="recBadge"><span class="rec-dot"></span>REC</div>

      <!-- Permission / initial overlay -->
      <div class="overlay" id="permOverlay">
        <svg class="overlay-icon" viewBox="0 0 64 64" fill="none" stroke="white" stroke-width="2">
          <rect x="8" y="18" width="48" height="34" rx="6"/>
          <circle cx="32" cy="35" r="10"/>
          <circle cx="32" cy="35" r="5" fill="white" opacity=".3"/>
          <rect x="23" y="13" width="18" height="9" rx="4"/>
          <circle cx="50" cy="26" r="2.5" fill="white" opacity=".6"/>
        </svg>
        <p>tap to enable your camera</p>
        <button class="perm-btn" id="permBtn">enable camera</button>
      </div>

      <!-- Error overlay -->
      <div class="overlay hidden" id="errOverlay">
        <svg class="overlay-icon" viewBox="0 0 64 64" fill="none" stroke="white" stroke-width="2">
          <circle cx="32" cy="32" r="26"/>
          <path d="M32 20v16M32 42v2"/>
        </svg>
        <p id="errMsg">something went wrong</p>
        <button class="perm-btn" id="retryBtn">try again</button>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">

    <!-- Camera selector (populated by JS) -->
    <div class="pill-row" id="cameraSelector"></div>

    <!-- Aspect ratio -->
    <div class="pill-row" id="ratioSelector">
      <button class="pill active" data-ratio="free">free</button>
      <button class="pill" data-ratio="1:1">1:1</button>
      <button class="pill" data-ratio="4:3">4:3</button>
      <button class="pill" data-ratio="3:4">3:4</button>
      <button class="pill" data-ratio="16:9">16:9</button>
      <button class="pill" data-ratio="9:16">9:16</button>
    </div>

    <!-- Mirror + Exposure -->
    <div class="settings-row">
      <div class="toggle-group">
        <span class="toggle-label">mirror</span>
        <button class="toggle-btn" id="mirrorToggle" aria-pressed="false" title="toggle mirror"></button>
      </div>
      <div class="exposure-group" id="exposureGroup" style="display:none">
        <span class="exposure-label">exp</span>
        <input type="range" id="exposureSlider" min="-3" max="3" step="0.5" value="0">
        <span class="exposure-val" id="exposureVal">0</span>
      </div>
    </div>

    <!-- Capture buttons -->
    <div class="capture-row">
      <button class="record-btn off" id="recordBtn" aria-label="record video">
        <svg id="recordIcon" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="7"/>
        </svg>
      </button>
      <button class="shutter-btn off" id="shutterBtn" aria-label="take photo"></button>
      <div class="thumb" id="thumbEl" title="open last capture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="5" width="18" height="15" rx="3"/>
          <circle cx="12" cy="12" r="4"/>
          <path d="M3 9h18"/>
        </svg>
      </div>
    </div>

    <div class="rec-timer-row">
      <span class="rec-timer" id="recTimer">0:00</span>
    </div>

  </div>
</div>

<canvas id="captureCanvas" style="display:none"></canvas>
<a id="dlLink" style="display:none"></a>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const THEMES = ['dark','dim','light','cottage','evil','nonchalant'];
const THEME_COLORS = {dark:'#000000',dim:'#101216',light:'#f4f2ef',cottage:'#f3eadb',evil:'#08040a',nonchalant:'#1e2420'};
let themeIdx = 0;
let stream = null;
let devices = [];
let currentDeviceId = null;
let isMirrored = false;
let currentRatio = 'free';
let isRecording = false;
let mediaRecorder = null;
let recordedChunks = [];
let recInterval = null;
let recSecs = 0;
let exposureSupport = 'none';
let ready = false;
let lastThumbUrl = null;

// ── DOM ────────────────────────────────────────────────────────────────────
const body          = document.body;
const preview       = document.getElementById('preview');
const viewport      = document.getElementById('viewport');
const permOverlay   = document.getElementById('permOverlay');
const errOverlay    = document.getElementById('errOverlay');
const errMsg        = document.getElementById('errMsg');
const permBtn       = document.getElementById('permBtn');
const retryBtn      = document.getElementById('retryBtn');
const shutterBtn    = document.getElementById('shutterBtn');
const recordBtn     = document.getElementById('recordBtn');
const recordIcon    = document.getElementById('recordIcon');
const mirrorToggle  = document.getElementById('mirrorToggle');
const themeBtn      = document.getElementById('themeBtn');
const exposureGroup = document.getElementById('exposureGroup');
const exposureSlider= document.getElementById('exposureSlider');
const exposureVal   = document.getElementById('exposureVal');
const camSelector   = document.getElementById('cameraSelector');
const ratioSelector = document.getElementById('ratioSelector');
const captureFlash  = document.getElementById('captureFlash');
const recBadge      = document.getElementById('recBadge');
const thumbEl       = document.getElementById('thumbEl');
const recTimer      = document.getElementById('recTimer');
const captureCanvas = document.getElementById('captureCanvas');
const dlLink        = document.getElementById('dlLink');
const themeColorMeta= document.getElementById('themeColorMeta');

// ── Init ───────────────────────────────────────────────────────────────────
function init() {
  loadSettings();
  bindControls();
  if (navigator.mediaDevices?.getUserMedia) {
    startCamera();
  } else {
    showError('camera API not supported in this browser — try Safari or Chrome');
  }
}

// ── Settings ───────────────────────────────────────────────────────────────
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('cam_prefs') || '{}');
    if (s.theme && THEMES.includes(s.theme)) applyTheme(THEMES.indexOf(s.theme), false);
    if (typeof s.mirrored === 'boolean') setMirror(s.mirrored, false);
    if (s.ratio) setRatio(s.ratio, false);
  } catch {}
}

function saveSettings() {
  try {
    localStorage.setItem('cam_prefs', JSON.stringify({
      theme: THEMES[themeIdx],
      mirrored: isMirrored,
      ratio: currentRatio,
    }));
  } catch {}
}

// ── Theme ──────────────────────────────────────────────────────────────────
function applyTheme(idx, save = true) {
  themeIdx = idx;
  body.dataset.theme = THEMES[idx];
  themeColorMeta.content = THEME_COLORS[THEMES[idx]] || '#000000';
  if (save) saveSettings();
}

// ── Camera ─────────────────────────────────────────────────────────────────
async function startCamera(deviceId = null) {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }

  let constraints;
  if (deviceId) {
    constraints = { video: { deviceId: { exact: deviceId } }, audio: false };
  } else {
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    constraints = { video: mobile ? { facingMode: { ideal: 'environment' } } : { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false };
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    preview.srcObject = stream;
    currentDeviceId = stream.getVideoTracks()[0].getSettings().deviceId ?? null;
    ready = true;

    permOverlay.classList.add('hidden');
    errOverlay.classList.add('hidden');
    shutterBtn.classList.remove('off');
    recordBtn.classList.remove('off');

    await enumerateDevices();
    detectExposure();
  } catch (err) {
    handleError(err);
  }
}

async function enumerateDevices() {
  try {
    const all = await navigator.mediaDevices.enumerateDevices();
    devices = all.filter(d => d.kind === 'videoinput');
    renderCamSelector();
  } catch {}
}

function cameraLabel(device, idx) {
  const l = (device.label || '').toLowerCase();
  if (!l) return `cam ${idx + 1}`;
  if (l.includes('front') || l.includes('facetime') || l.includes('user')) return 'selfie';
  if (l.includes('ultra') || (l.includes('wide') && l.includes('back'))) return 'ultra';
  if (l.includes('tele') || l.includes('3x') || l.includes('zoom')) return 'tele';
  if (l.includes('back') || l.includes('rear') || l.includes('environment') || l.includes('facing back')) return 'main';
  if (l.includes('facing front')) return 'selfie';
  // Trim long labels
  const clean = device.label.replace(/\s*\(.*?\)\s*/g, '').trim();
  return clean.length > 14 ? `cam ${idx + 1}` : clean;
}

function renderCamSelector() {
  camSelector.innerHTML = '';
  if (devices.length < 2) return;
  devices.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'pill' + (d.deviceId === currentDeviceId ? ' active' : '');
    btn.textContent = cameraLabel(d, i);
    btn.addEventListener('click', () => { if (d.deviceId !== currentDeviceId) { if (isRecording) stopRecording(); startCamera(d.deviceId); } });
    camSelector.appendChild(btn);
  });
}

// ── Exposure ───────────────────────────────────────────────────────────────
function detectExposure() {
  const track = stream?.getVideoTracks()[0];
  if (!track?.getCapabilities) return;
  const caps = track.getCapabilities();
  if (caps.exposureCompensation) {
    exposureSupport = 'compensation';
    exposureSlider.min   = caps.exposureCompensation.min  ?? -3;
    exposureSlider.max   = caps.exposureCompensation.max  ?? 3;
    exposureSlider.step  = caps.exposureCompensation.step ?? 0.5;
    exposureSlider.value = 0;
    exposureVal.textContent = '0';
    exposureGroup.style.display = '';
  } else {
    exposureSupport = 'none';
    exposureGroup.style.display = 'none';
  }
}

async function applyExposure(val) {
  const track = stream?.getVideoTracks()[0];
  if (!track || exposureSupport === 'none') return;
  try {
    await track.applyConstraints({ advanced: [{ exposureMode: 'manual', exposureCompensation: parseFloat(val) }] });
  } catch {}
}

// ── Mirror ─────────────────────────────────────────────────────────────────
function setMirror(val, save = true) {
  isMirrored = val;
  mirrorToggle.setAttribute('aria-pressed', val ? 'true' : 'false');
  preview.classList.toggle('mirrored', val);
  if (save) saveSettings();
}

// ── Aspect ratio ───────────────────────────────────────────────────────────
function setRatio(ratio, save = true) {
  currentRatio = ratio;
  viewport.dataset.ratio = ratio;
  document.querySelectorAll('#ratioSelector .pill').forEach(p => p.classList.toggle('active', p.dataset.ratio === ratio));
  if (save) saveSettings();
}

// ── Photo capture ──────────────────────────────────────────────────────────
function capturePhoto() {
  if (!ready || isRecording) return;
  const vw = preview.videoWidth, vh = preview.videoHeight;
  if (!vw || !vh) return;

  let cw = vw, ch = vh;
  if (currentRatio !== 'free') {
    const [rw, rh] = currentRatio.split(':').map(Number);
    const ar = rw / rh, var_ = vw / vh;
    if (ar > var_) { cw = vw; ch = Math.round(vw / ar); }
    else           { ch = vh; cw = Math.round(vh * ar); }
  }

  captureCanvas.width = cw;
  captureCanvas.height = ch;
  const ctx = captureCanvas.getContext('2d');
  const sx = (vw - cw) / 2, sy = (vh - ch) / 2;

  if (isMirrored) {
    ctx.save(); ctx.scale(-1, 1);
    ctx.drawImage(preview, sx, sy, cw, ch, -cw, 0, cw, ch);
    ctx.restore();
  } else {
    ctx.drawImage(preview, sx, sy, cw, ch, 0, 0, cw, ch);
  }

  flash();
  navigator.vibrate?.(30);
  shutterBtn.classList.add('pressing');
  setTimeout(() => shutterBtn.classList.remove('pressing'), 120);

  captureCanvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const ts  = timestamp();
    dlLink.href     = url;
    dlLink.download = `cam_${ts}.jpg`;
    dlLink.click();
    setThumb(url, 'img');
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }, 'image/jpeg', 0.95);
}

// ── Video recording ────────────────────────────────────────────────────────
function startRecording() {
  if (!ready || !stream) return;
  recordedChunks = [];
  const types = ['video/mp4;codecs=h264', 'video/mp4', 'video/webm;codecs=h264', 'video/webm'];
  const mime   = types.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch { return false; } }) || '';
  try {
    mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
  } catch {
    mediaRecorder = new MediaRecorder(stream);
  }
  mediaRecorder.ondataavailable = e => { if (e.data?.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = saveVideo;
  mediaRecorder.start(250);

  isRecording = true;
  recSecs = 0;
  recTimer.classList.add('visible');
  recBadge.classList.add('visible');
  updateRecTimer();
  recInterval = setInterval(() => { recSecs++; updateRecTimer(); }, 1000);

  recordBtn.classList.add('recording');
  recordIcon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2"/>';
  shutterBtn.classList.add('off');
  navigator.vibrate?.([40, 30, 40]);
}

function stopRecording() {
  if (!isRecording || !mediaRecorder) return;
  mediaRecorder.stop();
  isRecording = false;
  clearInterval(recInterval);
  recTimer.classList.remove('visible');
  recBadge.classList.remove('visible');
  recordBtn.classList.remove('recording');
  recordIcon.innerHTML = '<circle cx="12" cy="12" r="7"/>';
  shutterBtn.classList.remove('off');
  navigator.vibrate?.(70);
}

function saveVideo() {
  const mime = mediaRecorder?.mimeType || 'video/webm';
  const ext  = mime.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(recordedChunks, { type: mime });
  const url  = URL.createObjectURL(blob);
  dlLink.href     = url;
  dlLink.download = `cam_${timestamp()}.${ext}`;
  dlLink.click();
  setThumb(url, 'video');
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

function updateRecTimer() {
  const m = Math.floor(recSecs / 60), s = recSecs % 60;
  recTimer.textContent = `${m}:${s.toString().padStart(2, '0')}`;
}

// ── Helpers ────────────────────────────────────────────────────────────────
function flash() {
  captureFlash.classList.add('flash');
  setTimeout(() => captureFlash.classList.remove('flash'), 200);
}

function setThumb(url, type) {
  if (lastThumbUrl && !lastThumbUrl.startsWith('data:')) URL.revokeObjectURL(lastThumbUrl);
  lastThumbUrl = url;
  thumbEl.innerHTML = '';
  if (type === 'video') {
    const v = document.createElement('video');
    v.src = url; v.muted = true; v.playsInline = true;
    v.style.cssText = 'width:100%;height:100%;object-fit:cover';
    thumbEl.appendChild(v);
  } else {
    const img = document.createElement('img');
    img.src = url; img.alt = '';
    thumbEl.appendChild(img);
  }
}

function timestamp() {
  return new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
}

function showError(msg) {
  errMsg.textContent = msg;
  permOverlay.classList.add('hidden');
  errOverlay.classList.remove('hidden');
  shutterBtn.classList.add('off');
  recordBtn.classList.add('off');
  ready = false;
}

function handleError(err) {
  if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
    showError('camera access was denied — check your browser settings and reload');
  } else if (err.name === 'NotFoundError') {
    showError('no camera found on this device');
  } else if (err.name === 'NotReadableError') {
    showError('camera is busy — close other apps using it and try again');
  } else if (err.name === 'OverconstrainedError') {
    startCamera(null);
  } else {
    showError(`couldn't start camera: ${err.message || err.name}`);
  }
}

// ── Event bindings ─────────────────────────────────────────────────────────
function bindControls() {
  shutterBtn.addEventListener('click', () => { if (!shutterBtn.classList.contains('off')) capturePhoto(); });
  recordBtn.addEventListener('click', () => { if (recordBtn.classList.contains('off')) return; isRecording ? stopRecording() : startRecording(); });
  mirrorToggle.addEventListener('click', () => setMirror(!isMirrored));
  themeBtn.addEventListener('click', () => applyTheme((themeIdx + 1) % THEMES.length));
  permBtn.addEventListener('click', () => startCamera());
  retryBtn.addEventListener('click', () => { errOverlay.classList.add('hidden'); permOverlay.classList.remove('hidden'); startCamera(); });

  exposureSlider.addEventListener('input', () => {
    const v = parseFloat(exposureSlider.value);
    exposureVal.textContent = v > 0 ? `+${v}` : `${v}`;
    applyExposure(v);
  });

  document.querySelectorAll('#ratioSelector .pill').forEach(btn => {
    btn.addEventListener('click', () => setRatio(btn.dataset.ratio));
  });

  thumbEl.addEventListener('click', () => {
    const el = thumbEl.querySelector('img, video');
    if (el?.src) window.open(el.src, '_blank');
  });

  navigator.mediaDevices?.addEventListener?.('devicechange', enumerateDevices);
}

// ── Go ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
