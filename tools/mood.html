<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>mood tracker</title>
<link rel="icon" type="image/png" href="websyteicon.png">
<link rel="apple-touch-icon" href="websyteicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=JetBrains+Mono:wght@400;500&family=Metamorphous&family=Cabin+Sketch:wght@400;700&family=Silkscreen:wght@400;700&family=Fascinate&display=swap" rel="stylesheet">
<style>
:root,body[data-theme="dark"]{--bg:#000000;--surface:#0c0f15;--surface2:#181d27;--surface3:#2a3142;--border:#525a6c;--border-hover:#7a8294;--text:#ffffff;--text-muted:#c4ccd8;--text-dim:#8a92a0;--accent:#ffb070;--accent-dim:rgba(255,176,112,.18);--accent-glow:rgba(255,176,112,.55);--danger:#ff8a8a;--radius:12px;--radius-sm:8px;--shadow:0 4px 28px rgba(0,0,0,.85);--chart-bg:#0c0f15}
body[data-theme="dim"]{--bg:#101216;--surface:#181b20;--surface2:#1f2228;--surface3:#272a31;--border:#2e3239;--border-hover:#3e434b;--text:#d8dae0;--text-muted:#8a8e9a;--text-dim:#5c606c;--accent:#e89854;--accent-dim:rgba(232,152,84,.13);--accent-glow:rgba(232,152,84,.28);--danger:#cf6b6b;--radius:12px;--radius-sm:8px;--shadow:0 4px 24px rgba(0,0,0,.5);--chart-bg:#181b20}
body[data-theme="light"]{--bg:#f4f2ef;--surface:#ffffff;--surface2:#f0eee9;--surface3:#e6e3dd;--border:#d4d0c8;--border-hover:#b8b4ac;--text:#2c2a26;--text-muted:#6b6860;--text-dim:#9c9890;--accent:#c47138;--accent-dim:rgba(196,113,56,.1);--accent-glow:rgba(196,113,56,.2);--danger:#c45050;--radius:12px;--radius-sm:8px;--shadow:0 4px 20px rgba(0,0,0,.08);--chart-bg:#ffffff}
body[data-theme="cottage"]{--bg:#f3eadb;--surface:#fbf6ec;--surface2:#ebe0cd;--surface3:#dfd2bb;--border:#c9b896;--border-hover:#a89377;--text:#3d2f22;--text-muted:#7a6450;--text-dim:#a89377;--accent:#c79090;--accent-dim:rgba(199,144,144,.14);--accent-glow:rgba(199,144,144,.28);--accent2:#9caf88;--danger:#b56b5a;--radius:16px;--radius-sm:12px;--shadow:0 4px 20px rgba(120,85,45,.1),0 1px 3px rgba(120,85,45,.06);--chart-bg:#fbf6ec}
body[data-theme="evil"]{--bg:#08040a;--surface:#0e060c;--surface2:#180a14;--surface3:#22101c;--border:#3c1428;--border-hover:#5c1e3a;--text:#e8c0cc;--text-muted:#a87088;--text-dim:#6c3850;--accent:#dc2040;--accent-dim:rgba(220,32,64,.15);--accent-glow:rgba(220,32,64,.35);--danger:#ff2848;--radius:10px;--radius-sm:7px;--shadow:0 4px 30px rgba(220,0,40,.2);--chart-bg:#0e060c}
body[data-theme="nonchalant"]{--bg:#1e2420;--surface:#262d28;--surface2:#2e3630;--surface3:#3a4238;--border:#3d4a3e;--border-hover:#556253;--text:#d4d9ce;--text-muted:#9aa696;--text-dim:#6b7668;--accent:#8fb380;--accent-dim:rgba(143,179,128,.14);--accent-glow:rgba(143,179,128,.25);--danger:#c78a6b;--radius:12px;--radius-sm:9px;--shadow:0 4px 20px rgba(20,30,20,.3);--chart-bg:#262d28}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:28px;line-height:1.6;font-size:17px;overflow-x:hidden}
.header{display:flex;align-items:baseline;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.header h1{align-self:baseline}
.header .by{font-size:16px;color:var(--text-dim);white-space:nowrap;align-self:baseline;margin-left:-2px}
.header .undo-redo-pair,.header .header-btn,.header .lang-select,.header .feedback-btn,.header .header-spacer,.header select{align-self:center}
/* Header controls (desktop: just a transparent flex container; mobile: a dropdown menu) */
.header-controls{display:inline-flex;align-items:center;gap:8px}
.header-menu-toggle{display:none;width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text-muted);cursor:pointer;align-items:center;justify-content:center;padding:0;transition:background .15s,color .15s,border-color .15s;flex-shrink:0}
.header-menu-toggle svg{width:18px;height:18px}
.header-menu-toggle:hover,.header-menu-toggle.open{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
.header h1{font-size:42px;font-weight:600;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent),#7eaad4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;line-height:1;margin:0;padding:0}
body[data-theme="light"] .header h1{background:linear-gradient(135deg,#e89854,#f0c474);-webkit-background-clip:text}
body[data-theme="cottage"] .header h1{background:linear-gradient(135deg,#c79090 0%,#b87290 35%,#9caf88 70%,#d4a574 100%);-webkit-background-clip:text}
body[data-theme="evil"] .header h1{background:linear-gradient(135deg,#dc2040,#880020);-webkit-background-clip:text}
body[data-theme="nonchalant"] .header h1{background:linear-gradient(135deg,#8fb380,#a8a070);-webkit-background-clip:text;font-family:'Fascinate',cursive;letter-spacing:0;font-weight:400;font-size:42px}
body[data-theme="dark"] .header h1{font-family:'Silkscreen',monospace;font-size:36px;letter-spacing:1px;font-weight:400;background:linear-gradient(135deg,#ffb070,#ffd29c);-webkit-background-clip:text}
body[data-theme="dim"] .header h1{font-family:'Silkscreen',monospace;font-size:36px;letter-spacing:1px;font-weight:400;background:linear-gradient(135deg,#e89854,#f0c474);-webkit-background-clip:text}
:root .header h1{font-family:'Silkscreen',monospace;font-size:36px;letter-spacing:1px;font-weight:400;background:linear-gradient(135deg,#e89854,#f0c474);-webkit-background-clip:text}
body[data-theme="cottage"] .header h1{font-family:'Cabin Sketch',cursive;font-weight:700;letter-spacing:0;font-size:46px}
body[data-theme="evil"] .header h1{font-family:'Metamorphous',serif;font-weight:400;letter-spacing:1px;font-size:42px}
.header-btn{font-size:13px;padding:6px 12px;color:var(--text-muted)}
.header-spacer{flex:1}
.lang-select{padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);font-family:inherit;font-size:14px;cursor:pointer;outline:none}
/* Undo/Redo: tiny paired icon buttons next to the logo */
.undo-redo-pair{display:inline-flex;gap:0;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;align-self:center;background:var(--surface2);flex-shrink:0}
.undo-redo-btn{width:30px;height:30px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:background .15s,color .15s}
.undo-redo-btn svg{width:15px;height:15px}
.undo-redo-btn:not(:disabled):hover{background:var(--accent-dim);color:var(--accent)}
.undo-redo-btn:not(:disabled):active{background:var(--accent);color:#fff}
.undo-redo-btn:disabled{opacity:.3;cursor:not-allowed}
.undo-redo-btn:first-child{border-right:1px solid var(--border)}
.lang-select:hover{border-color:var(--accent);color:var(--accent)}
.lang-select option{background:var(--surface2);color:var(--text)}

/* Profile bar */
.profile-bar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:22px;flex-wrap:wrap}
.profile-bar-label{font-size:clamp(11px,1.2vw,14px);text-transform:uppercase;letter-spacing:1.2px;color:var(--text-dim);font-weight:500}
.profile-tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.profile-tab{display:flex;align-items:center;gap:12px;padding:5px 10px 5px 5px;border-radius:32px;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);font-family:inherit;font-size:15px;cursor:pointer;transition:all .2s;white-space:nowrap;position:relative}
.profile-tab:hover{background:var(--surface3);color:var(--text);border-color:var(--border-hover)}
.profile-tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--text);font-weight:500}
.profile-tab .tab-pic{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1.5px solid var(--border);flex-shrink:0}
.profile-tab.active .tab-pic{border-color:var(--accent)}
.profile-tab .tab-dot{width:10px;height:10px;border-radius:50%;background:var(--text-dim);margin-left:4px}
.profile-tab.active .tab-dot{background:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
.profile-tab > span:not(.tab-dot){padding:0 2px 0 0}
.profile-tab .tab-menu-btn{width:26px;height:26px;border-radius:50%;border:1px solid transparent;background:var(--surface3);color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-left:2px;transition:all .15s;padding:0;flex-shrink:0}
.profile-tab .tab-menu-btn svg{width:14px;height:14px;display:block}
.profile-tab .tab-menu-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:scale(1.08)}
.profile-tab.active .tab-menu-btn{background:rgba(255,255,255,.08);color:var(--text)}
.ctx-menu{position:absolute;top:100%;left:0;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:4px 0;min-width:160px;display:none}
.ctx-menu.open{display:block}
.ctx-menu-item{display:block;width:100%;padding:9px 18px;background:none;border:none;color:var(--text-muted);font-family:inherit;font-size:15px;text-align:left;cursor:pointer}
.ctx-menu-item:hover{background:var(--surface2);color:var(--text)}
.profile-actions{display:flex;gap:8px;align-items:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--border-hover);color:var(--text);background:var(--surface3)}
.btn-accent{background:var(--accent-dim);border-color:rgba(164,139,207,.3);color:var(--accent)}
.btn-accent:hover{background:rgba(164,139,207,.22);border-color:var(--accent)}
.btn-sm{padding:5px 12px;font-size:13px}
.btn svg{width:16px;height:16px}

/* Chart tabs */
.chart-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chart-tab{padding:7px 18px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-family:inherit;font-size:14px;cursor:pointer;transition:all .2s}
.chart-tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.chart-tab:hover{background:var(--surface2);color:var(--text)}

/* Chart */
.chart-container canvas{width:100%;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);display:block;margin-bottom:8px}

/* Stats */
.stats-bar{display:flex;gap:20px;padding:12px 18px;margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);flex-wrap:wrap;font-size:15px;color:var(--text-muted)}
.stat-item{display:inline-flex;align-items:center;gap:10px;line-height:1.4}
.stat-item strong{color:var(--text);font-weight:600}
.stat-label{color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.6px;font-size:.85em}
/* Both .stat-icon and .stat-dot are exactly 18×18 outer boxes so the text column lines up across all stat items */
.stat-icon{flex-shrink:0;width:18px;height:18px;color:var(--text-muted);opacity:.85;display:inline-block}
.stat-icon svg{width:100%;height:100%;display:block}
/* The dot's visible color comes from inline style="background:#color".
   We use box-shadow inset of the same surface color to mask the outer ring,
   creating the visual effect of an 8×8 dot inside an 18×18 footprint. */
.stat-dot{flex-shrink:0;width:18px;height:18px;border-radius:50%;box-sizing:border-box;border:5px solid var(--surface);background-clip:padding-box}

/* Panels */
.panels-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
@media(max-width:900px){.panels-grid{grid-template-columns:1fr}}
.panel{padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.panel-watermarked{overflow:hidden;isolation:isolate}
.panel-watermark{position:absolute;right:-40px;bottom:-50px;width:300px;height:300px;color:var(--text);opacity:.025;transform:rotate(-42deg);transform-origin:center;pointer-events:none;z-index:0}
.panel-watermark.flip-h{width:243px;height:243px;right:-20px;bottom:0;transform:rotate(-170deg) scaleX(-1)}
body[data-theme="light"] .panel-watermark{opacity:.04}
body[data-theme="cottage"] .panel-watermark{opacity:.05}
body[data-theme="evil"] .panel-watermark{opacity:.035;color:var(--accent)}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.panel-title{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);display:flex;align-items:center;gap:8px}
.panel-title::before{content:'';width:3px;height:16px;border-radius:2px;background:var(--accent)}
.field-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--text-dim);font-weight:500;letter-spacing:.4px;text-transform:uppercase}
.field input,.field select{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:15px;outline:none;transition:border-color .2s;width:160px}
.field select{font-family:'DM Sans',sans-serif;cursor:pointer}
.field select option{background:var(--surface2);color:var(--text)}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.field input[type="color"]{width:42px;height:38px;padding:2px;cursor:pointer}

/* Tags */
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:16px;font-size:14px;font-weight:500;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);cursor:default;transition:all .15s}
.tag .tag-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tag .tag-x{width:18px;height:18px;border-radius:50%;border:none;background:transparent;color:var(--text-dim);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tag .tag-x:hover{background:var(--danger);color:#fff}
.med-pill{cursor:pointer;user-select:none}
.med-pill.selected{border-color:var(--accent);background:var(--accent-dim);color:var(--text)}
.axis-toggle{cursor:pointer;user-select:none}
.axis-toggle.show-axis{border-color:var(--accent);background:var(--accent-dim);color:var(--text)}

/* Med/hormone settings */
.item-settings{margin-top:10px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2)}
.item-settings-title{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;font-weight:500}

/* Recurring */
.recur-section{margin-top:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);overflow:hidden}
.recur-header{padding:10px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px;user-select:none}
.recur-header:hover{color:var(--text)}
.recur-header .arrow{font-size:11px;transition:transform .2s}
.recur-header .arrow.open{transform:rotate(180deg)}
.recur-body{padding:0 14px 14px;display:none}
.recur-body.open{display:block}

/* Date selects */
.date-selects{display:flex;gap:4px}
.date-selects select{padding:10px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;cursor:pointer}
.date-selects select:focus{border-color:var(--accent)}
.date-selects .ds-day{width:60px}
.date-selects .ds-month{width:130px}
.date-selects .ds-year{width:85px}

/* Range bar */
.range-bar{display:flex;align-items:center;gap:12px;margin-top:16px;padding:10px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);flex-wrap:wrap}
.toggle-bar{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 18px;background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);flex-wrap:wrap;margin-top:-1px}
.toggle-pair{display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.range-input-pair{display:inline-flex;align-items:center;gap:8px;flex-shrink:0}
.recur-group{display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.range-bar+.toggle-bar{border-top:1px dashed var(--border)}
.range-bar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.range-bar:has(+.toggle-bar){border-radius:var(--radius) var(--radius) 0 0}
.toggle-bar-title{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-right:4px}
.range-bar label{font-size:15px;color:var(--text-dim);font-weight:500}
.range-bar input[type="number"]{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:15px;width:80px;outline:none}
.toggle-switch{position:relative;width:40px;height:22px;cursor:pointer;display:inline-block;vertical-align:middle;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:var(--surface3);border-radius:11px;transition:background .2s,border-color .2s;border:1px solid var(--border)}
.toggle-slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;bottom:3px;background:var(--text-muted);border-radius:50%;transition:transform .2s ease,background .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle-switch:hover .toggle-slider{border-color:var(--border-hover)}
.toggle-switch input:checked+.toggle-slider{background:var(--accent-dim);border-color:var(--accent)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(18px);background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle-label{font-size:14px;color:var(--text-muted)}

/* Custom add modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex;overscroll-behavior:contain}
/* Lock background scroll when any modal is open (modern :has() + JS fallback class) */
html:has(.modal-overlay.open),body:has(.modal-overlay.open),body.modal-open,html.modal-open{overflow:hidden!important}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;width:480px;max-width:92vw;max-height:90vh;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.modal h3{font-size:20px;font-weight:600;margin-bottom:18px;flex-shrink:0}
/* The named content divs become scrollable; rest of modal is fixed-flex */
.modal #wizardContent,.modal #catalogList,.modal #addMedBody,.modal #addHormoneBody,.modal #infoBody,.modal #emojiPickerBody,.modal #cropperBody,.modal #baselineEditBody,.modal #dataMgmtBody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1;min-height:0;padding-right:6px;margin-right:-6px}
.modal input[type="text"],.modal input[type="number"]{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:inherit;font-size:15px;outline:none;margin-bottom:14px}
.modal input:focus{border-color:var(--accent)}
.modal-buttons{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);flex-shrink:0}
.modal-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;font-weight:500}
.baseline-options{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.baseline-options.vertical{flex-direction:column}
.baseline-opt{flex:1;min-width:120px;padding:14px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);font-family:inherit;font-size:14px;text-align:center;cursor:pointer;transition:all .2s;line-height:1.5}
.baseline-opt:hover{border-color:var(--border-hover);color:var(--text)}
.baseline-opt.selected{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);font-weight:500}
.baseline-opt .opt-title{font-weight:600;font-size:15px;margin-bottom:4px}
.baseline-opt .opt-desc{font-size:12px;color:var(--text-dim);font-weight:400}

/* History */
.history-panel{margin-top:22px;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.history-tabs{display:flex;gap:6px;margin-bottom:14px}
.history-tab{padding:7px 20px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-family:inherit;font-size:15px;cursor:pointer;transition:all .2s}
.history-tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.history-table{width:100%;border-collapse:collapse;font-size:15px;table-layout:auto}
.history-table th{padding:9px 10px;text-align:left;color:var(--text-dim);font-weight:500;text-transform:uppercase;font-size:11px;letter-spacing:.6px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
.history-table th:hover{color:var(--text)}
.history-table td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:14px;vertical-align:middle}
/* Day column compact */
.history-table th:nth-child(2),.history-table td:nth-child(2){width:50px}
/* Action column hugs the right */
.history-table th:last-child,.history-table td:last-child{width:1%;white-space:nowrap;text-align:right}
.history-table tr:hover td{color:var(--text);background:var(--surface2)}
.hist-actions{text-align:right;white-space:nowrap;vertical-align:middle}
.hist-actions > *{vertical-align:middle}
.hist-actions > *+*{margin-left:5px}
.hist-btn{padding:5px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;box-sizing:border-box}
.hist-btn svg{width:14px;height:14px;display:block}
.hist-btn:hover{color:var(--text);border-color:var(--border-hover)}
.hist-btn.hist-del:hover{color:var(--danger);border-color:var(--danger)}
/* Toggle inside history row: matches button height for flush alignment */
.hist-toggle{margin:0 4px;align-self:center;flex-shrink:0}
/* Med-name in history: truncate long names, expand on tap/hover */
.med-name{display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;cursor:pointer;transition:max-width .25s ease}
.med-name:hover,.med-name.expanded{max-width:300px}
.history-empty{color:var(--text-dim);font-size:15px;padding:14px 0}

.dow-tag{font-family:'JetBrains Mono',monospace;font-size:.78em;color:var(--text-dim);font-weight:400;letter-spacing:-.3px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:12px 24px;border-radius:22px;font-size:16px;box-shadow:var(--shadow);opacity:0;transition:all .35s cubic-bezier(.16,1,.3,1);z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#importInput,#pfpInput{display:none}
/* Chart resizer - 4-way pull tabs */
.chart-wrapper{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;gap:0;margin-bottom:8px;position:relative}
.chart-wrapper .chart-container{grid-column:2;grid-row:2;min-width:200px;min-height:200px;overflow:hidden}
.chart-wrapper .grip-corner{width:10px;height:10px;background:transparent}
.chart-grip{display:flex;align-items:center;justify-content:center;cursor:col-resize;user-select:none;position:relative;opacity:.4;transition:all .25s;color:var(--text-dim);font-size:11px;font-weight:700;flex-shrink:0}
.chart-grip.grip-h{width:14px;grid-row:2}
.chart-grip.grip-v{height:14px;grid-column:2;cursor:row-resize}
.chart-grip-l{grid-column:1}
.chart-grip-r{grid-column:3}
.chart-grip-t{grid-row:1}
.chart-grip-b{grid-row:3}
.chart-grip::before{content:'';position:absolute;border-radius:2px;background:var(--text-dim);transition:all .25s}
.chart-grip.grip-h::before{top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:40px}
.chart-grip.grip-v::before{top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:2px}
.chart-grip::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:12px;height:12px;background:var(--text-dim);border-radius:3px;transition:all .25s;z-index:2;box-shadow:inset 0 0 0 2px var(--bg)}
.chart-grip:hover,.chart-grip.active{opacity:1}
.chart-grip:hover::before,.chart-grip.active::before{background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.chart-grip:hover::after,.chart-grip.active::after{background:var(--accent);box-shadow:inset 0 0 0 2px var(--bg),0 0 6px var(--accent-glow)}
#gripL::before,#gripR::before{height:70%}
#gripT::before,#gripB::before{width:70%}
#gripL:hover::before,#gripR:hover::before,#gripL.active::before,#gripR.active::before{height:75%}
#gripT:hover::before,#gripB:hover::before,#gripT.active::before,#gripB.active::before{width:75%}
#gripL::before,#gripR::before{height:70%}
#gripL:hover::before,#gripR:hover::before,#gripL.active::before,#gripR.active::before{height:75%}

@keyframes sparkle{0%,100%{box-shadow:0 0 4px var(--accent-glow)}50%{box-shadow:0 0 16px var(--accent),0 0 30px var(--accent-glow)}}
.add-profile-btn.sparkle{animation:sparkle 1.5s ease-in-out infinite}
.catalog-gear{position:absolute;bottom:10px;right:10px;width:32px;height:32px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .2s}
.catalog-gear:hover{color:var(--accent);border-color:var(--accent);transform:rotate(30deg)}
/* Inline variant: lives next to the panel-header's primary action button instead of overlapping content */
.catalog-gear-inline{position:static;width:30px;height:30px;flex-shrink:0}
.catalog-list{max-height:60vh;overflow-y:auto;margin:-8px -4px 12px -4px;padding:4px}
.catalog-row{display:grid;grid-template-columns:22px minmax(120px,1.4fr) 58px 78px 18px 70px 14px 70px 18px 56px;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);font-size:14px;border:1px solid transparent;border-bottom:1px solid var(--border)}
.catalog-row.med-row{grid-template-columns:22px 1fr 58px 78px}
.catalog-row.tracked{background:var(--accent-dim)}
.catalog-swatch{width:22px;height:22px;border-radius:4px;flex-shrink:0;cursor:pointer;padding:0;border:1px solid var(--border)}
.catalog-name{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.catalog-tag{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:0;background:none;border:none}
.cat-prehrt-btn{flex-shrink:0;width:28px;height:18px;padding:0;margin-right:4px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text-dim);cursor:pointer;transition:all .15s}
.cat-prehrt-btn:hover{border-color:var(--accent);color:var(--text)}
.cat-prehrt-btn.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.cat-prehrt-btn svg{display:block}
.catalog-unit-select{padding:4px 6px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer;width:100%}
.catalog-range-input{padding:4px 5px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;width:100%;box-sizing:border-box;min-width:0;-moz-appearance:textfield}
.catalog-range-input::-webkit-outer-spin-button,.catalog-range-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* Hide native number spinners on inputs inside steppers (they're replaced by buttons) */
.stepper input[type="number"]::-webkit-outer-spin-button,
.stepper input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input[type="number"]{-moz-appearance:textfield;appearance:textfield}
/* Stepper widget: −  [input]  + */
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);overflow:hidden;height:36px;flex-shrink:0}
.stepper input{
  border:none!important;
  background:transparent!important;
  width:60px;
  text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  color:var(--text);
  padding:0 4px;
  margin:0;
  outline:none;
  height:100%;
  min-width:0;
}
.stepper input:focus{background:var(--surface)!important}
.stepper-btn{
  width:36px;
  height:100%;
  border:none;
  background:var(--surface3);
  color:var(--text-muted);
  font-size:18px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
  transition:background .12s,color .12s;
  font-family:inherit;
  line-height:1;
  padding:0;
  flex-shrink:0;
}
.stepper-btn:hover{background:var(--accent-dim);color:var(--accent)}
.stepper-btn:active{background:var(--accent);color:#fff}
.stepper-btn:first-child{border-right:1px solid var(--border)}
.stepper-btn:last-child{border-left:1px solid var(--border)}
.stepper.stepper-sm{height:32px}
.stepper.stepper-sm input{width:48px;font-size:13px}
.stepper.stepper-sm .stepper-btn{width:30px;font-size:16px}
.catalog-del-btn{background:none;border:none;cursor:pointer;padding:3px 4px;margin-left:6px;color:var(--text-dim);display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;border-radius:4px;transition:color .15s,background .15s}
.catalog-del-btn:hover{color:var(--danger);background:rgba(207,107,107,.12)}
.catalog-range-dash{color:var(--text-dim);font-size:11px;text-align:center}
/* ═══ Cottage theme — pressed flowers, aged paper, walnut warmth ═══ */
body[data-theme="cottage"]{
  background-image:
    radial-gradient(ellipse at top left,rgba(199,144,144,.05) 0%,transparent 50%),
    radial-gradient(ellipse at bottom right,rgba(156,175,136,.05) 0%,transparent 50%),
    repeating-linear-gradient(98deg,rgba(168,147,119,.018) 0px,rgba(168,147,119,.018) 1px,transparent 1px,transparent 4px);
  background-attachment:fixed;
}
/* Panels: aged-paper feel with warm sepia shadow + soft top-edge highlight */
body[data-theme="cottage"] .panel,
body[data-theme="cottage"] .history-panel{
  border:1px solid var(--border);
  background:linear-gradient(180deg,#fdf9f0 0%,var(--surface) 6%,var(--surface) 94%,#f4ead8 100%);
  box-shadow:0 4px 16px rgba(120,85,45,.08),0 1px 3px rgba(120,85,45,.06),inset 0 1px 0 rgba(255,255,255,.6);
}
/* Buttons: pill-y with rose-gold gradient on accent */
body[data-theme="cottage"] .btn{border-radius:14px;background:linear-gradient(180deg,var(--surface),var(--surface2));border-color:var(--border)}
body[data-theme="cottage"] .btn:hover{background:linear-gradient(180deg,var(--surface2),var(--surface3));border-color:var(--border-hover)}
body[data-theme="cottage"] .btn-accent{
  background:linear-gradient(135deg,#d4a4a4 0%,#c79090 50%,#b87a8a 100%);
  border:1px solid rgba(150,90,90,.3);
  color:#fdf9f0;
  text-shadow:0 1px 1px rgba(120,60,70,.3);
  box-shadow:0 2px 8px rgba(199,144,144,.3),inset 0 1px 0 rgba(255,255,255,.4);
  font-weight:600;
}
body[data-theme="cottage"] .btn-accent:hover{
  background:linear-gradient(135deg,#dcafaf,#cf9c9c,#c08591);
  box-shadow:0 3px 12px rgba(199,144,144,.45),inset 0 1px 0 rgba(255,255,255,.5);
}
/* Profile tabs: soft pillows */
body[data-theme="cottage"] .profile-tab{border-radius:18px;background:linear-gradient(180deg,var(--surface),var(--surface2))}
body[data-theme="cottage"] .profile-tab.active{
  background:linear-gradient(135deg,rgba(199,144,144,.18),rgba(156,175,136,.14));
  border-color:var(--accent);
  box-shadow:0 2px 8px rgba(199,144,144,.18),inset 0 1px 0 rgba(255,255,255,.5);
}
/* Tags with sage-tinted hover */
body[data-theme="cottage"] .tag{border-radius:14px;background:linear-gradient(180deg,var(--surface),var(--surface2))}
body[data-theme="cottage"] .tag.selected{
  background:linear-gradient(135deg,rgba(199,144,144,.16),rgba(156,175,136,.12));
}
/* Chart tabs: stitched feel */
body[data-theme="cottage"] .chart-tab{background:linear-gradient(180deg,var(--surface),var(--surface2));border-color:var(--border)}
body[data-theme="cottage"] .chart-tab.active{
  background:linear-gradient(135deg,rgba(199,144,144,.2),rgba(156,175,136,.16));
  border-color:var(--accent);
  color:var(--text);
}
/* Section titles get a tiny floral flourish */
body[data-theme="cottage"] .panel-title::after{
  content:"  ❀";
  color:var(--accent);
  font-size:.85em;
  opacity:.7;
}
body[data-theme="cottage"] .header h1::after{content:" 🌸";font-size:24px;-webkit-text-fill-color:initial}
/* Inputs: warmer cream */
body[data-theme="cottage"] input[type="text"],
body[data-theme="cottage"] input[type="number"],
body[data-theme="cottage"] input[type="date"],
body[data-theme="cottage"] select,
body[data-theme="cottage"] textarea{
  background:#fdf9f0;
  border-color:var(--border);
}
body[data-theme="cottage"] input:focus,
body[data-theme="cottage"] select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-dim);
}
/* Toggle slider: rose-on-cream */
body[data-theme="cottage"] .toggle-slider{background:#dcc9aa}
body[data-theme="cottage"] .toggle-switch input:checked+.toggle-slider{
  background:linear-gradient(135deg,#c79090,#b88298);
}
/* Range bar/toggle bar: paper-card feel */
body[data-theme="cottage"] .range-bar,
body[data-theme="cottage"] .toggle-bar{
  background:linear-gradient(180deg,#fdf9f0,var(--surface));
  box-shadow:0 2px 10px rgba(120,85,45,.06),inset 0 1px 0 rgba(255,255,255,.5);
}
/* Stats bar: muted cream card */
body[data-theme="cottage"] .stats-bar{
  background:linear-gradient(180deg,var(--surface2),var(--surface3));
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
}
/* Modals get a warm overlay tint and paper interior */
body[data-theme="cottage"] .modal-overlay{background:rgba(80,55,35,.45)}
body[data-theme="cottage"] .modal{
  background:linear-gradient(180deg,#fdf9f0,var(--surface));
  box-shadow:0 12px 40px rgba(80,55,35,.25),inset 0 1px 0 rgba(255,255,255,.6);
}
/* Watermark feels more like a faded illustration */
body[data-theme="cottage"] .panel-watermark{color:var(--accent);opacity:.06}
/* Catalog-gear gets a soft rose tint on hover */
body[data-theme="cottage"] .catalog-gear:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
/* Evil theme — sharp, menacing */
body[data-theme="evil"] .panel,body[data-theme="evil"] .history-panel{border:1px solid var(--border);box-shadow:0 2px 20px rgba(220,32,64,.08),inset 0 0 40px rgba(220,32,64,.03)}
body[data-theme="evil"] .btn-accent{background:linear-gradient(180deg,#e83858,#a00020);color:#fff!important;border:1px solid #5a0018;box-shadow:0 0 12px rgba(220,32,64,.4),inset 0 1px 0 rgba(255,255,255,.1);text-shadow:0 1px 2px rgba(0,0,0,.6);font-weight:600}
body[data-theme="evil"] .btn-accent:hover{background:linear-gradient(180deg,#ff486a,#c00028);box-shadow:0 0 20px rgba(220,32,64,.6),inset 0 1px 0 rgba(255,255,255,.15)}
body[data-theme="evil"] .header h1{text-shadow:0 0 20px rgba(220,32,64,.4);filter:drop-shadow(0 0 6px rgba(220,32,64,.3))}
body[data-theme="evil"] .profile-tab.active{box-shadow:0 0 10px rgba(220,32,64,.4)}
/* Nonchalant theme — laid-back natural greens */
body[data-theme="nonchalant"] .panel,body[data-theme="nonchalant"] .history-panel{border:1px solid var(--border);box-shadow:0 2px 14px rgba(30,40,30,.18)}
body[data-theme="nonchalant"] .btn-accent{background:linear-gradient(180deg,#9cbf8c,#7a9e6e);color:#1e2420!important;border:1px solid #6a8a60;font-weight:500}
body[data-theme="nonchalant"] .btn-accent:hover{background:linear-gradient(180deg,#abd099,#87a87a)}
/* ════════ Responsive design ════════
   Philosophy: keep desktop as-is. Tablet gets light shrinking. Mobile gets a
   deliberate vertical layout with explicit sizes (not vw-based, which behaves
   unpredictably on real phones) and proper touch-friendly controls. */

/* Tablet: panels still side-by-side but sizes shrink slightly */
@media(max-width:1024px){
  body{padding:20px}
  .header h1{font-size:36px}
  body[data-theme="dark"] .header h1{font-size:30px}
  body[data-theme="cottage"] .header h1{font-size:38px}
}

/* Tablet narrow: panels stack, but layout still holds desktop-ish proportions */
@media(max-width:900px){
  body{padding:16px}
  .panels-grid{grid-template-columns:1fr;gap:14px}
  .header-spacer{flex-basis:100%;width:0;height:0;margin:0}
  .header h1{font-size:32px}
  body[data-theme="dark"] .header h1{font-size:26px}
  body[data-theme="cottage"] .header h1{font-size:34px}
  .header .by{font-size:14px}
}

/* Mobile: deliberate vertical layout — explicit pixel sizes, NOT vw */
@media(max-width:640px){
  body{padding:8px 6px;font-size:14px}

  /* ── Header: logo first, buttons fit around it ── */
  .header{gap:8px;margin-bottom:14px;align-items:center;position:relative;flex-wrap:nowrap;min-height:38px}
  /* Logo gets a generous starting size; JS shrinks it to fit if needed via inline style */
  .header h1{font-size:32px;line-height:1;flex-shrink:0;white-space:nowrap;min-width:0}
  body[data-theme="dark"] .header h1{font-size:24px;letter-spacing:.5px}
  body[data-theme="cottage"] .header h1{font-size:34px}
  body[data-theme="evil"] .header h1,body[data-theme="nonchalant"] .header h1{font-size:30px}
  .header .by{display:none}
  .header-spacer{display:none}
  .header .undo-redo-pair{position:static;margin:0;flex-shrink:0;margin-left:auto}
  .undo-redo-btn{width:28px;height:28px}
  .undo-redo-btn svg{width:13px;height:13px}
  .header-menu-toggle{width:34px;height:34px;flex-shrink:0}
  .header-menu-toggle svg{width:16px;height:16px}
  .header-controls{
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    z-index:50;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    box-shadow:var(--shadow);
    padding:10px;
    flex-direction:column;
    align-items:stretch;
    gap:8px;
    min-width:200px;
    display:none;
  }
  .header-controls.open{display:flex}
  .header-controls .lang-select,
  .header-controls .feedback-btn{
    width:100%;
    justify-content:center;
    text-align:center;
    flex-direction:row!important;
    padding:8px 12px;
    font-size:13px;
    min-height:38px;
    box-sizing:border-box;
  }
  .header-controls .feedback-btn{
    font-size:13px!important;
    padding:8px 12px!important;
    width:100%!important;
    height:auto!important;
    border-radius:var(--radius-sm)!important;
    line-height:1.3;
  }
  .header-controls .feedback-btn span{display:inline;font-size:11px;margin:0 0 0 6px;opacity:.7}
  .header-controls .feedback-btn br{display:none}
  /* Standalone ? button stays visible on mobile, sized to match the gear */
  .header-info-btn{width:30px!important;height:30px!important;font-size:14px!important}
  .header-menu-toggle{display:inline-flex}

  /* ── Profile bar: tabs scroll, buttons wrap to next row ── */
  .profile-bar{padding:10px 12px;gap:8px;row-gap:8px;flex-wrap:wrap}
  .profile-bar-label{font-size:11px;flex-shrink:0}
  #profileTabs,.profile-tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:3px;flex:1;min-width:0;scrollbar-width:thin;gap:6px;flex-wrap:nowrap!important;mask-image:linear-gradient(to right,#000 calc(100% - 20px),transparent);-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 20px),transparent)}
  #profileTabs::-webkit-scrollbar,.profile-tabs::-webkit-scrollbar{height:3px}
  #profileTabs::-webkit-scrollbar-thumb,.profile-tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .profile-tab{flex-shrink:0;font-size:13px;padding:3px 6px 3px 3px;border-radius:24px}
  .profile-tab .tab-pic{width:30px;height:30px}
  .profile-tab .tab-menu-btn{width:24px;height:24px;font-size:14px}
  /* Profile actions wrap to a new row, even split */
  .profile-actions{display:flex;flex-basis:100%;width:100%;gap:6px;flex-wrap:wrap}
  .profile-actions .btn{flex:1;min-width:0;justify-content:center;font-size:12px;padding:7px 8px;min-height:34px}
  .profile-actions .btn[title*="Data"]{flex:0 0 auto;min-width:38px;width:38px;padding:7px}

  /* ── Chart tabs: scroll horizontally, taller for taps, with fade affordance on right ── */
  .chart-tabs-wrap{position:relative}
  .chart-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:thin;gap:6px;mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent);-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}
  .chart-tabs::-webkit-scrollbar{height:3px}
  .chart-tab{flex-shrink:0;padding:7px 14px;font-size:12px;min-height:34px;border-radius:18px}

  /* ── Range bar: From/To side-by-side, action buttons in row below ── */
  .range-bar{padding:10px 12px;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
  .range-input-pair{gap:6px;justify-content:center;flex-shrink:1}
  .range-input-pair label{font-size:12px;color:var(--text-muted);flex-shrink:0}
  /* Action buttons (Start Date / Export PNG / Print) — give them enough flex-basis that the
     text+icon never clip; the row wraps to a second line on narrow iPhones rather than truncating. */
  .range-bar > .btn{padding:7px 10px;font-size:11px;min-height:34px;justify-content:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .range-bar-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
  .range-bar-actions .btn{padding:8px 8px;font-size:12px;min-height:38px;display:flex;align-items:center;justify-content:center;gap:5px;width:100%;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .range-bar-actions .btn:last-child{grid-column:1 / -1}
  .range-bar-actions .btn svg{width:14px;height:14px;flex-shrink:0}
  .range-bar-actions .btn span{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .range-bar > div[style*="flex:1"]{flex-basis:100%;width:0;height:0;margin:0;display:block!important}
  /* Steppers smaller & more compact for the day pickers */
  .range-bar .stepper{height:32px}
  .range-bar .stepper input{width:46px;font-size:13px;padding:0 2px}
  .range-bar .stepper-btn{width:28px;font-size:15px}

  /* ── Toggle bar: pairs wrap as units ── */
  .toggle-bar{padding:12px;gap:10px 16px;flex-wrap:wrap;justify-content:center}
  .toggle-pair{gap:7px}
  .toggle-bar .toggle-label{font-size:12px}

  /* ── Panels ── */
  .panel{padding:14px;padding-bottom:48px}
  .panel-title{font-size:13px;letter-spacing:.8px}
  .panel-header{margin-bottom:10px}
  .panel-header .btn{font-size:12px;padding:7px 11px;min-height:34px}
  .catalog-gear{bottom:8px;right:8px;width:32px;height:32px}

  /* ── Charts: collapse the resize-grid on mobile so the chart spans full width ── */
  .chart-resizer{max-width:100%!important;margin:0!important}
  .chart-wrapper{margin-bottom:6px;display:block;grid-template-columns:none!important}
  .chart-wrapper .grip-corner,
  .chart-wrapper .chart-grip.grip-h{display:none}
  .chart-wrapper .chart-container{grid-column:auto;grid-row:auto;width:100%;min-width:0}
  .chart-grip.grip-v{display:flex;opacity:.55;height:30px;cursor:row-resize;touch-action:none;width:100%;grid-column:auto}
  .chart-grip.grip-v::before{width:50px;height:3px}

  /* ── History panel ── */
  .history-panel{padding:12px;overflow:hidden}
  /* The table itself scrolls horizontally inside the panel if needed */
  .history-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:0 12px}
  .history-tabs{flex-wrap:wrap;gap:4px}
  .history-tab{font-size:12px;padding:6px 14px;min-height:34px}
  .history-table{font-size:12px;width:100%;table-layout:auto}
  .history-table th,.history-table td{padding:7px 6px;white-space:nowrap;vertical-align:middle}
  .history-table th:nth-child(2),.history-table td:nth-child(2){width:auto;min-width:30px;padding-left:0;padding-right:0}
  .history-table th:last-child,.history-table td:last-child{width:auto;text-align:right;padding-left:6px;padding-right:0}
  .med-name{max-width:80px}
  .med-name.expanded{max-width:200px}
  .history-table .hist-actions{display:inline-flex;flex-direction:row;gap:4px;justify-content:flex-end;flex-wrap:nowrap;align-items:center}
  /* Tighter buttons on mobile */
  .hist-btn{width:28px;height:28px;padding:4px}
  .hist-btn svg{width:13px;height:13px}
  /* Compact action buttons: icon-only edit/delete, hide text label */
  .hist-btn{padding:4px 7px;font-size:11px;min-height:30px;min-width:30px;display:inline-flex;align-items:center;justify-content:center}
  .hist-btn svg{width:13px;height:13px}

  /* ── Modals: bottom-sheet style ── */
  .modal-overlay{padding:0;align-items:flex-end;overflow:hidden}
  .modal{
    max-width:100vw!important;
    width:100vw;
    max-height:88vh;
    border-radius:18px 18px 0 0;
    padding:0;
    margin:0;
    box-shadow:0 -8px 30px rgba(0,0,0,.4);
    display:flex;
    flex-direction:column;
    overflow:hidden;/* contains the scroll body */
  }
  /* Sheet drag handle */
  .modal::before{
    content:"";
    display:block;
    width:40px;height:4px;
    background:var(--border);
    border-radius:2px;
    margin:10px auto 6px;
    flex-shrink:0;
  }
  /* Title fixed at top */
  .modal h3{
    font-size:17px;
    margin:0;
    padding:8px 18px 12px;
    flex-shrink:0;
    border-bottom:1px solid var(--border);
  }
  .modal h4{font-size:14px;margin:14px 0 6px}
  /* Scrollable middle area = everything between h3 and modal-buttons */
  .modal > h3 ~ *:not(.modal-buttons){
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:0 18px;
  }
  /* The LAST scrollable element gets bottom padding for breathing room above sticky footer */
  .modal > h3 ~ *:not(.modal-buttons):last-of-type{padding-bottom:16px}
  /* ALL content between h3 and modal-buttons should share scroll container behavior.
     But we want one unified scrollable area. Use a flex:1 wrapper trick: */
  .modal > h3 ~ *:not(.modal-buttons){flex:0 0 auto}
  /* Make ONE scroll wrapper around ALL non-fixed content via wrap */
  .modal > h3 ~ *:not(.modal-buttons){min-height:0}
  /* Better: target the predictable id-named content divs as scroll containers */
  .modal #wizardContent,
  .modal #catalogList,
  .modal #addMedBody,
  .modal #addHormoneBody,
  .modal #infoBody,
  .modal #emojiPickerBody,
  .modal #cropperBody,
  .modal #baselineEditBody,
  .modal #dataMgmtBody{
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    flex:1;
    min-height:0;
    padding:14px 18px;
  }
  /* Fixed footer */
  .modal-buttons{
    background:var(--surface);
    padding:12px 18px;
    margin:0;
    border-top:1px solid var(--border);
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    flex-shrink:0;
  }
  .modal-buttons .btn{flex:1;min-width:120px;justify-content:center;min-height:42px;font-size:14px}

  /* ── Catalog: simplified rows ── */
  .catalog-row{grid-template-columns:22px 1fr 50px 60px!important;gap:6px;padding:8px;font-size:12px}
  .catalog-row .catalog-range-input,.catalog-row .catalog-range-dash{display:none}
  .catalog-row > span:nth-child(5),
  .catalog-row > span:nth-child(8){display:none}

  /* ── Stats bar wraps ── */
  /* ── Stats bar: label on its own row, items below ── */
  .stats-bar{flex-wrap:wrap;gap:6px 12px;padding:10px;font-size:11px}
  .stats-bar .stat-item{font-size:11px}
  .stats-bar > .stat-item:first-child{flex-basis:100%;width:100%;margin-bottom:2px}

  /* ── Form inputs full width ── */
  .field input,.field select,.field textarea{width:100%;font-size:14px;padding:10px 12px;min-height:42px}
  .field-row{flex-direction:column;gap:10px}
  .field-row .field{width:100%}
  .date-selects{display:flex;gap:6px}
  .date-selects select{padding:9px 6px;font-size:13px;flex:1;min-width:0}

  /* ── Wizard steps: vertical chips ── */
  .baseline-options{flex-direction:column;gap:10px}
  .baseline-opt{width:100%;padding:14px}
  .opt-title{font-size:14px}
  .opt-desc{font-size:12px}
  /* Wizard chips bigger for taps */
  .wizard-content .tag{font-size:13px;padding:7px 12px;min-height:34px}

  /* ── Toast bottom sheet style ── */
  #toast{bottom:14px;left:14px;right:14px;max-width:none;text-align:center;font-size:13px;padding:12px 16px}

  /* ── Profile context menu wider for fingers ── */
  .ctx-menu{min-width:200px}
  .ctx-menu-item{padding:12px 16px;font-size:14px}
}

/* Tiny phones (under 380px) — extra tight */
@media(max-width:380px){
  body{padding:8px}
  /* Logo sizes already vw-clamped, no need to override */
  .undo-redo-btn{width:26px;height:26px}
  .undo-redo-btn svg{width:12px;height:12px}
  .header-menu-toggle{width:30px;height:30px}
  .header-menu-toggle svg{width:14px;height:14px}
  .profile-bar{padding:8px 10px;gap:6px}
  .profile-tab{font-size:12px}
  .profile-tab .tab-pic{width:28px;height:28px}
  .panel{padding:12px;padding-bottom:46px}
}

/* Touch device tap targets — applies regardless of width */
@media(hover:none){
  /* Touch devices — bigger tap targets, but NOT for toggle sliders (those have their own size) */
  button:not(.toggle-switch):not(.tab-menu-btn):not(.stepper-btn),
  select,
  .profile-tab,.chart-tab,.history-tab{min-height:34px}
  .toggle-switch,.toggle-switch input,.toggle-slider{min-height:0}
  .chart-grip{opacity:.65}
}

@media print{body{background:#fff!important;color:#333!important;padding:10mm}canvas{page-break-inside:avoid}.header,.profile-bar,.range-bar,.toggle-bar,.panels-grid,.history-panel,.chart-tabs,.stats-bar,.toast,.modal-overlay{display:none!important}.chart-container canvas{border:1px solid #ccc}}
</style>
<style>
/* ── Mood-specific components ── */
.emoji-scale{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-bottom:14px;padding:6px 2px}
.emoji-opt{width:34px;height:34px;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;border-radius:50%;transition:transform .18s cubic-bezier(.34,1.56,.64,1),filter .18s;filter:grayscale(.55) opacity(.7);padding:0}
.emoji-opt:hover{transform:scale(1.55) translateY(-4px);filter:grayscale(0) opacity(1)}
.emoji-opt.sel{filter:grayscale(0) opacity(1);background:var(--accent-dim);box-shadow:0 0 0 2px var(--accent)}
.mood-display{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:14px}

.mood-display .mood-lbl{font-size:14px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}

.tag-pill{cursor:pointer;user-select:none}
.tag-pill.sel{border-color:var(--accent);background:var(--accent-dim);color:var(--text)}
.notes-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:inherit;font-size:14px;outline:none;resize:vertical;min-height:42px}

.epick-cat{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px;font-weight:600}
.crop-stage{position:relative;width:260px;height:260px;margin:0 auto 14px;border-radius:50%;overflow:hidden;background:#000;cursor:grab;touch-action:none}
.crop-stage canvas{display:block}
.wizard-step{margin-bottom:8px}
.med-name-cell{display:flex;align-items:center;gap:8px}
.tag-cell{display:flex;flex-wrap:wrap;gap:3px}
.tag-mini{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--surface3);color:var(--text-muted)}
</style>
</head>

<div class="panels-grid">
  <!-- LEFT: Log Mood -->

<div class="modal-overlay" id="renameModal"><div class="modal" style="width:360px"><h3>Rename Profile</h3><input type="text" id="renameInput"><div class="modal-buttons"><button class="btn" onclick="closeModal('renameModal')">Cancel</button><button class="btn btn-accent" onclick="confirmRename()">Save</button></div></div></div>

<div class="modal-overlay" id="tagAddModal"><div class="modal" style="width:360px"><h3>Add Tag</h3><input type="text" id="tagAddInput" placeholder="e.g. sleep"><div class="modal-buttons"><button class="btn" onclick="closeModal('tagAddModal')">Cancel</button><button class="btn btn-accent" onclick="confirmAddTag()">Add</button></div></div></div>
<script>
/* ════════════ Medication catalog ════════════ */
const CAT_COLORS={HRT:'#e070ba',SSRI:'#5ea3e0',SNRI:'#5ec5d0',Antipsychotic:'#b58fe0',MoodStabilizer:'#7ec78a',Anxiety:'#e0c45e',Stimulant:'#e08a5e',Other:'#9aa6b0',Therapy:'#9caf88'};
function mk(id,name,group,unit){return {id,name,group,unit,color:CAT_COLORS[group.replace(/[^A-Za-z]/g,'')]||'#888'};}
const MED_CATALOG=[
 mk('estradiol','Estradiol (oral/SL)','HRT','mg'),mk('estradiol_val','Estradiol Valerate','HRT','mg'),
 mk('estradiol_cyp','Estradiol Cypionate','HRT','mg'),mk('estradiol_patch','Estradiol Patch','HRT','mcg/day'),
 mk('estradiol_gel','Estradiol Gel','HRT','mg'),mk('progesterone','Progesterone','HRT','mg'),
 mk('testosterone','Testosterone','HRT','mg'),mk('testosterone_gel','Testosterone Gel','HRT','mg'),
 mk('spironolactone','Spironolactone','HRT','mg'),mk('bicalutamide','Bicalutamide','HRT','mg'),
 mk('finasteride','Finasteride','HRT','mg'),mk('cyproterone','Cyproterone Acetate','HRT','mg'),
 mk('sertraline','Sertraline','SSRI','mg'),mk('fluoxetine','Fluoxetine','SSRI','mg'),
 mk('escitalopram','Escitalopram','SSRI','mg'),mk('citalopram','Citalopram','SSRI','mg'),
 mk('paroxetine','Paroxetine','SSRI','mg'),mk('fluvoxamine','Fluvoxamine','SSRI','mg'),
 mk('venlafaxine','Venlafaxine','SNRI','mg'),mk('duloxetine','Duloxetine','SNRI','mg'),
 mk('desvenlafaxine','Desvenlafaxine','SNRI','mg'),mk('levomilnacipran','Levomilnacipran','SNRI','mg'),
 mk('quetiapine','Quetiapine','Antipsychotic','mg'),mk('aripiprazole','Aripiprazole','Antipsychotic','mg'),
 mk('olanzapine','Olanzapine','Antipsychotic','mg'),mk('risperidone','Risperidone','Antipsychotic','mg'),
 mk('lurasidone','Lurasidone','Antipsychotic','mg'),mk('ziprasidone','Ziprasidone','Antipsychotic','mg'),
 mk('clozapine','Clozapine','Antipsychotic','mg'),
 mk('lithium','Lithium','Mood Stabilizer','mg'),mk('valproate','Valproate','Mood Stabilizer','mg'),
 mk('lamotrigine','Lamotrigine','Mood Stabilizer','mg'),mk('carbamazepine','Carbamazepine','Mood Stabilizer','mg'),
 mk('oxcarbazepine','Oxcarbazepine','Mood Stabilizer','mg'),
 mk('alprazolam','Alprazolam','Anxiety','mg'),mk('clonazepam','Clonazepam','Anxiety','mg'),
 mk('lorazepam','Lorazepam','Anxiety','mg'),mk('diazepam','Diazepam','Anxiety','mg'),
 mk('buspirone','Buspirone','Anxiety','mg'),mk('hydroxyzine','Hydroxyzine','Anxiety','mg'),
 mk('methylphenidate','Methylphenidate','Stimulant','mg'),mk('amphetamine','Amphetamine','Stimulant','mg'),
 mk('lisdexamfetamine','Lisdexamfetamine','Stimulant','mg'),mk('atomoxetine','Atomoxetine','Stimulant','mg'),
 mk('modafinil','Modafinil','Stimulant','mg'),mk('guanfacine','Guanfacine','Stimulant','mg'),
 mk('clonidine','Clonidine','Stimulant','mg'),
 mk('bupropion','Bupropion','Other','mg'),mk('mirtazapine','Mirtazapine','Other','mg'),
 mk('trazodone','Trazodone','Other','mg'),mk('vortioxetine','Vortioxetine','Other','mg'),
 mk('nortriptyline','Nortriptyline','Other','mg'),mk('amitriptyline','Amitriptyline','Other','mg'),
 mk('gabapentin','Gabapentin','Other','mg'),mk('pregabalin','Pregabalin','Other','mg'),
 mk('naltrexone','Naltrexone','Other','mg'),mk('melatonin','Melatonin','Other','mg'),
 mk('cbt','CBT','Therapy','session'),mk('dbt','DBT','Therapy','session'),
 mk('act','ACT','Therapy','session'),mk('emdr','EMDR','Therapy','session'),
 mk('somatic','Somatic','Therapy','session'),mk('psychodynamic','Psychodynamic','Therapy','session'),
 mk('cft','CFT','Therapy','session'),mk('schema','Schema Therapy','Therapy','session'),
 mk('person_centred','Person-Centred','Therapy','session'),mk('group','Group Therapy','Therapy','session'),
];
const CATALOG_BY_ID={};MED_CATALOG.forEach(m=>CATALOG_BY_ID[m.id]=m);
const GROUP_ORDER=['HRT','SSRI','SNRI','Antipsychotic','Mood Stabilizer','Anxiety','Stimulant','Other','Therapy'];

/* mood emoji scale -10..+10 (21 steps) */
const MOOD_EMOJI=['😭','😢','😖','😞','😔','😟','🙁','😕','🫤','😶','😐','🙂','🙂','😊','😀','😃','😄','😁','🤗','🤩','🥰'];
function moodEmoji(v){const i=Math.max(-10,Math.min(10,Math.round(v)))+10;return MOOD_EMOJI[i];}
function moodLabel(v){if(v<=-9)return 'Awful';if(v<=-6)return 'Very Low';if(v<=-3)return 'Low';if(v<0)return 'Down';if(v===0)return 'Neutral';if(v<=2)return 'Okay';if(v<=4)return 'Good';if(v<=6)return 'Great';if(v<=8)return 'Excellent';return 'Amazing';}
const MOOD_LEGEND=[[-10,'😭','Awful'],[-5,'😟','Low'],[0,'😐','Neutral'],[5,'😀','Great'],[10,'🥰','Amazing']];
const TAG_PRESETS=['anxiety','depression','energy','sleep','dysphoria','mood swings','irritability','brain fog','pain','appetite','libido','social','work','exercise'];

/* ════════════ State ════════════ */
const LS_KEY='mood_tracker_v1', THEME_KEY='mood_theme';
let profiles={}, activeProfileName=null;
let undoStack=[], redoStack=[];
let selectedMood=0, histTab='mood', selectedDoseMed=null, chartView='multi';
let editingMoodId=null;

function blankProfile(){const d=new Date();return {startDate:isoDate(d),profilePic:'',medications:[],customMeds:[],medCustom:{},doses:{},moods:[],tags:TAG_PRESETS.slice(0,6),tMin:-20,xMax:200,_migrated:true};}
function P(){return profiles[activeProfileName];}
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseISO(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function dayOffset(iso){const a=parseISO(P().startDate),b=parseISO(iso);return Math.round((b-a)/86400000);}
function offsetToDate(off){const a=parseISO(P().startDate);return new Date(a.getTime()+off*86400000);}

function allMedDefs(){const out=[];P().medications.forEach(id=>{const c=CATALOG_BY_ID[id];if(c)out.push(c);});(P().customMeds||[]).forEach(c=>out.push(c));return out;}
function medDef(id){return CATALOG_BY_ID[id]||(P().customMeds||[]).find(c=>c.id===id);}
function medColor(id){const cu=(P().medCustom||{})[id];if(cu&&cu.color)return cu.color;const d=medDef(id);return d?d.color:'#888';}
function medUnit(id){const cu=(P().medCustom||{})[id];if(cu&&cu.unit)return cu.unit;const d=medDef(id);return d?d.unit:'mg';}

/* ════════════ Persistence + undo ════════════ */
function save(){localStorage.setItem(LS_KEY,JSON.stringify({profiles,active:activeProfileName}));}
function snapshotState(){return JSON.stringify({profiles,active:activeProfileName});}
function pushUndo(){undoStack.push(snapshotState());if(undoStack.length>50)undoStack.shift();redoStack.length=0;updateUndoRedoButtons();}
function restoreState(s){const o=JSON.parse(s);profiles=o.profiles;activeProfileName=o.active;}
function undo(){if(!undoStack.length)return;redoStack.push(snapshotState());restoreState(undoStack.pop());save();renderAll();updateUndoRedoButtons();}
function redo(){if(!redoStack.length)return;undoStack.push(snapshotState());restoreState(redoStack.pop());save();renderAll();updateUndoRedoButtons();}
function updateUndoRedoButtons(){document.getElementById('undoBtn').disabled=!undoStack.length;document.getElementById('redoBtn').disabled=!redoStack.length;}

/* ════════════ Toast ════════════ */
let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

/* ════════════ Theme ════════════ */
function setTheme(t){document.body.dataset.theme=t;localStorage.setItem(THEME_KEY,t);document.getElementById('themeSelect').value=t;render();}
function toggleHeaderMenu(){document.getElementById('headerControls').classList.toggle('open');document.getElementById('headerMenuToggle').classList.toggle('open');}

function closeModal(id){document.getElementById(id).classList.remove('open');document.body.classList.remove('modal-open');}
function openModal(id){document.getElementById(id).classList.add('open');document.body.classList.add('modal-open');}
function stepInput(id,d){const el=document.getElementById(id);el.value=(parseFloat(el.value)||0)+d;updateRange();}
function toggleRecur(h){h.parentElement.querySelector('.recur-body').classList.toggle('open');h.querySelector('.arrow').classList.toggle('open');}

/* ════════════ Date selects ════════════ */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fillDateSelects(dEl,mEl,yEl,date){
  dEl.innerHTML='';for(let i=1;i<=31;i++)dEl.add(new Option(i,i));
  mEl.innerHTML='';MONTHS.forEach((m,i)=>mEl.add(new Option(m,i+1)));
  yEl.innerHTML='';const ny=new Date().getFullYear();for(let y=ny+1;y>=ny-15;y--)yEl.add(new Option(y,y));
  dEl.value=date.getDate();mEl.value=date.getMonth()+1;yEl.value=date.getFullYear();
}
function readDateSelects(dEl,mEl,yEl){return new Date(+yEl.value,+mEl.value-1,+dEl.value);}

/* ════════════ Profile tabs ════════════ */
function renderProfileTabs(){
  const box=document.getElementById('profileTabs');box.innerHTML='';
  Object.keys(profiles).forEach(name=>{
    const t=document.createElement('div');t.className='profile-tab'+(name===activeProfileName?' active':'');
    const p=profiles[name];
    const pic=p.profilePic?`<img class="tab-pic" src="${p.profilePic}">`:`<span class="tab-dot"></span>`;
    t.innerHTML=pic+`<span>${esc(name)}</span><button class="tab-menu-btn" title="Options"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>`;
    t.querySelector('span:not(.tab-dot)')?.addEventListener('click',()=>{if(name!==activeProfileName){activeProfileName=name;save();renderAll();}});
    if(p.profilePic)t.querySelector('.tab-pic').addEventListener('click',()=>{activeProfileName=name;save();renderAll();});
    if(t.querySelector('.tab-dot'))t.querySelector('.tab-dot').addEventListener('click',()=>{activeProfileName=name;save();renderAll();});
    t.querySelector('.tab-menu-btn').addEventListener('click',e=>{e.stopPropagation();openCtxMenu(t,name);});
    box.appendChild(t);
  });
}
function openCtxMenu(tab,name){
  document.querySelectorAll('.ctx-menu').forEach(m=>m.remove());
  const m=document.createElement('div');m.className='ctx-menu open';
  m.innerHTML=`<button class="ctx-menu-item" data-a="rename">Rename</button>
    <button class="ctx-menu-item" data-a="pic">Set Picture</button>
    <button class="ctx-menu-item" data-a="emoji">Pick Emoji</button>
    <button class="ctx-menu-item" data-a="del">Delete</button>`;
  tab.appendChild(m);
  m.querySelectorAll('.ctx-menu-item').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();const a=b.dataset.a;m.remove();
    activeProfileName=name;
    if(a==='rename')openRename();
    else if(a==='pic')document.getElementById('pfpInput').click();
    else if(a==='emoji')openEmojiPicker();
    else if(a==='del')deleteProfile(name);
  }));
  setTimeout(()=>document.addEventListener('click',function h(){m.remove();document.removeEventListener('click',h);}),0);
}
function deleteProfile(name){
  if(Object.keys(profiles).length<=1){toast('Cannot delete the last profile');return;}
  if(!confirm('Delete profile "'+name+'"?'))return;
  pushUndo();delete profiles[name];activeProfileName=Object.keys(profiles)[0];save();renderAll();toast('Profile deleted');
}
let renameTarget=null;
function openRename(){renameTarget=activeProfileName;document.getElementById('renameInput').value=activeProfileName;openModal('renameModal');}
function confirmRename(){
  const nv=document.getElementById('renameInput').value.trim();if(!nv||nv===renameTarget){closeModal('renameModal');return;}
  if(profiles[nv]){toast('Name already exists');return;}
  pushUndo();const np={};Object.keys(profiles).forEach(k=>{np[k===renameTarget?nv:k]=profiles[k];});profiles=np;
  if(activeProfileName===renameTarget)activeProfileName=nv;save();closeModal('renameModal');renderAll();
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ════════════ Log Mood panel ════════════ */
function renderEmojiScale(){
  const box=document.getElementById('emojiScale');box.innerHTML='';
  for(let v=-10;v<=10;v++){
    const b=document.createElement('button');b.className='emoji-opt'+(v===selectedMood?' sel':'');
    b.textContent=moodEmoji(v);b.title=v;b.onclick=()=>{selectedMood=v;renderEmojiScale();updateMoodDisplay();};
    box.appendChild(b);
  }
}
function updateMoodDisplay(){
  document.getElementById('moodBigEmoji').textContent=moodEmoji(selectedMood);
  document.getElementById('moodValDisp').textContent=(selectedMood>0?'+':'')+selectedMood;
  document.getElementById('moodLblDisp').textContent=moodLabel(selectedMood);
}
function renderMoodLegend(){
  const box=document.getElementById('moodLegend');box.innerHTML='';
  MOOD_LEGEND.forEach(([v,e,l])=>{box.insertAdjacentHTML('beforeend',`<div class="ml-item"><span class="ml-emoji">${e}</span><span>${l}</span><span>${v>0?'+':''}${v}</span></div>`);});
}
let selectedTags=new Set();
function renderMoodTags(){
  const box=document.getElementById('moodTagRow');box.innerHTML='';
  (P().tags||[]).forEach(tag=>{
    const t=document.createElement('div');t.className='tag tag-pill'+(selectedTags.has(tag)?' sel':'');
    t.textContent=tag;t.onclick=()=>{selectedTags.has(tag)?selectedTags.delete(tag):selectedTags.add(tag);renderMoodTags();};
    box.appendChild(t);
  });
  const add=document.createElement('div');add.className='tag tag-pill';add.style.cursor='pointer';add.innerHTML='+ tag';
  add.onclick=()=>openAddTag();box.appendChild(add);
}
function openAddTag(){document.getElementById('tagAddInput').value='';openModal('tagAddModal');}
function confirmAddTag(){const v=document.getElementById('tagAddInput').value.trim();if(!v){closeModal('tagAddModal');return;}
  pushUndo();if(!P().tags.includes(v))P().tags.push(v);save();closeModal('tagAddModal');renderMoodTags();}
function logMood(){
  pushUndo();
  const date=readDateSelects(document.getElementById('moodDay'),document.getElementById('moodMonth'),document.getElementById('moodYear'));
  const iso=isoDate(date);const notes=document.getElementById('moodNotes').value.trim();
  const entry={id:editingMoodId||('m'+Date.now()+Math.random().toString(36).slice(2,6)),day:dayOffset(iso),date:iso,mood:selectedMood,tags:[...selectedTags],notes};
  if(editingMoodId){const i=P().moods.findIndex(m=>m.id===editingMoodId);if(i>=0)P().moods[i]=entry;editingMoodId=null;}
  else P().moods.push(entry);
  P().moods.sort((a,b)=>a.day-b.day);
  document.getElementById('moodNotes').value='';selectedTags.clear();
  save();renderAll();toast('Mood logged');
}

/* ════════════ Add Dosage panel ════════════ */
function renderDoseMedPills(){
  const box=document.getElementById('doseMedPills');box.innerHTML='';
  const defs=allMedDefs();
  if(!defs.length){box.innerHTML='<span style="color:var(--text-dim);font-size:13px">No medications tracked. Use the gear to add some.</span>';selectedDoseMed=null;return;}

/* ════════════ Step function for meds ════════════ */
function doseStepSeries(id){
  const arr=(P().doses[id]||[]).slice().sort((a,b)=>a[0]-b[0]);
  return arr; // [day,amount]
}
function doseAtDay(arr,day){let v=0;for(const[d,a]of arr){if(d<=day)v=a;else break;}return v;}

/* ════════════ Catmull-Rom spline ════════════ */
function catmullRom(ctx,pts){
  if(pts.length<2){return;}
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];
    const cp1x=p1.x+(p2.x-p0.x)/6,cp1y=p1.y+(p2.y-p0.y)/6;
    const cp2x=p2.x-(p3.x-p1.x)/6,cp2y=p2.y-(p3.y-p1.y)/6;
    ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,p2.x,p2.y);
  }
}

/* ════════════ Draw chart ════════════ */
let chartDPR=1;
function render(){
  const canvas=document.getElementById('chart');const ctx=canvas.getContext('2d');
  const cssW=canvas.parentElement.clientWidth;
  const cssH=parseInt(canvas.dataset.h||'420');
  const dpr=window.devicePixelRatio||1;chartDPR=dpr;
  canvas.width=cssW*dpr;canvas.height=cssH*dpr;canvas.style.height=cssH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.body);
  const C={bg:cs.getPropertyValue('--chart-bg').trim(),text:cs.getPropertyValue('--text').trim(),dim:cs.getPropertyValue('--text-dim').trim(),muted:cs.getPropertyValue('--text-muted').trim(),border:cs.getPropertyValue('--border').trim(),accent:cs.getPropertyValue('--accent').trim()};
  ctx.clearRect(0,0,cssW,cssH);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cssW,cssH);

  const opt={grid:tg('tgGrid'),legend:tg('tgLegend'),labels:tg('tgLabels'),values:tg('tgValues'),guides:tg('tgGuides'),doseChanges:tg('tgDoseChanges'),lines:tg('tgLines'),curves:tg('tgCurves')};
  const xMin=parseFloat(document.getElementById('xMinInput').value)||-20;
  const xMax=parseFloat(document.getElementById('xMaxInput').value)||200;
  const padL=46,padR=46,padT=18,padB=34;
  const plotW=cssW-padL-padR,plotH=cssH-padT-padB;
  const x2px=d=>padL+(d-xMin)/(xMax-xMin)*plotW;
  const showMood=chartView==='multi'||chartView==='mood';
  const medIds=chartView==='multi'?allMedDefs().map(d=>d.id):chartView.startsWith('med:')?[chartView.slice(4)]:[];
  // med y scale (left)
  let maxDose=1;medIds.forEach(id=>doseStepSeries(id).forEach(([,a])=>{if(a>maxDose)maxDose=a;}));
  const dose2px=v=>padT+plotH-(v/maxDose)*plotH;
  // mood y scale (right) -10..10
  const mood2px=v=>padT+plotH-((v+10)/20)*plotH;

  // grid
  if(opt.grid){ctx.strokeStyle=C.border;ctx.globalAlpha=.4;ctx.lineWidth=1;
    for(let gx=Math.ceil(xMin/25)*25;gx<=xMax;gx+=25){const px=x2px(gx);ctx.beginPath();ctx.moveTo(px,padT);ctx.lineTo(px,padT+plotH);ctx.stroke();}
    for(let i=0;i<=4;i++){const py=padT+plotH*i/4;ctx.beginPath();ctx.moveTo(padL,py);ctx.lineTo(padL+plotW,py);ctx.stroke();}
    ctx.globalAlpha=1;}
  // axis labels
  ctx.fillStyle=C.dim;ctx.font='11px JetBrains Mono, monospace';ctx.textAlign='center';
  for(let gx=Math.ceil(xMin/50)*50;gx<=xMax;gx+=50){ctx.fillText('d'+gx,x2px(gx),cssH-12);}

  // zero line for mood
  if(showMood){
    const zy=mood2px(0);
    ctx.strokeStyle=C.dim;ctx.setLineDash([5,4]);ctx.globalAlpha=.7;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(padL,zy);ctx.lineTo(padL+plotW,zy);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
    // right axis labels
    ctx.fillStyle=C.dim;ctx.textAlign='left';
    [10,5,0,-5,-10].forEach(v=>{ctx.fillText((v>0?'+':'')+v,padL+plotW+6,mood2px(v)+4);});
  }
  // left axis labels (dose)
  if(medIds.length){ctx.fillStyle=C.dim;ctx.textAlign='right';
    for(let i=0;i<=4;i++){const v=maxDose*(4-i)/4;ctx.fillText(v.toFixed(maxDose<5?1:0),padL-6,padT+plotH*i/4+4);}}

  // med step lines
  if(opt.lines)medIds.forEach(id=>{
    const arr=doseStepSeries(id);if(!arr.length)return;
    ctx.strokeStyle=medColor(id);ctx.lineWidth=2;ctx.beginPath();
    let started=false,prevY=null;
    for(let i=0;i<arr.length;i++){
      const[d,a]=arr[i];const px=x2px(d),py=dose2px(a);
      if(!started){ctx.moveTo(Math.max(padL,x2px(xMin)),py);ctx.lineTo(px,py);started=true;}
      else{ctx.lineTo(px,prevY);ctx.lineTo(px,py);}
      prevY=py;
    }
    ctx.lineTo(padL+plotW,prevY);ctx.stroke();
    // dose change labels
    if(opt.doseChanges){ctx.fillStyle=medColor(id);ctx.font='10px JetBrains Mono, monospace';ctx.textAlign='center';
      arr.forEach(([d,a])=>{if(d>=xMin&&d<=xMax)ctx.fillText(a+'',x2px(d),dose2px(a)-6);});}
  });

  // mood curve
  if(showMood){
    const ms=P().moods.filter(m=>m.day>=xMin-5&&m.day<=xMax+5).sort((a,b)=>a.day-b.day);
    if(ms.length){
      const pts=ms.map(m=>({x:x2px(m.day),y:mood2px(m.mood),m}));
      // area fills (green above zero, red below)
      const zy=mood2px(0);
      ctx.save();
      ctx.beginPath();catmullRom(ctx,pts);
      ctx.lineTo(pts[pts.length-1].x,zy);ctx.lineTo(pts[0].x,zy);ctx.closePath();
      // clip top half green
      ctx.save();ctx.beginPath();ctx.rect(padL,padT,plotW,zy-padT);ctx.clip();
      ctx.fillStyle='rgba(126,199,138,.18)';ctx.fill();ctx.restore();
      ctx.save();ctx.beginPath();ctx.rect(padL,zy,plotW,padT+plotH-zy);ctx.clip();
      ctx.fillStyle='rgba(224,120,120,.18)';ctx.fill();ctx.restore();
      ctx.restore();
      // line
      if(opt.curves){ctx.strokeStyle=C.accent;ctx.lineWidth=2.5;ctx.beginPath();catmullRom(ctx,pts);ctx.stroke();}
      else{ctx.strokeStyle=C.accent;ctx.lineWidth=2.5;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();}
      // dots + value labels
      pts.forEach(p=>{
        ctx.fillStyle=p.m.mood>=0?'#7ec78a':'#e07878';
        ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=C.bg;ctx.lineWidth=1.5;ctx.stroke();
        if(opt.values){ctx.fillStyle=C.text;ctx.font='10px JetBrains Mono, monospace';ctx.textAlign='center';
          ctx.fillText((p.m.mood>0?'+':'')+p.m.mood,p.x,p.y-9);}
      });
    }
  }

  // legend
  if(opt.legend){
    let lx=padL+6,ly=padT+10;ctx.textAlign='left';ctx.font='12px DM Sans, sans-serif';
    function leg(color,label){ctx.fillStyle=color;ctx.fillRect(lx,ly-8,12,4);ctx.fillStyle=C.muted;ctx.fillText(label,lx+18,ly-1);lx+=ctx.measureText(label).width+44;if(lx>cssW-120){lx=padL+6;ly+=18;}}
    if(showMood)leg(C.accent,'Mood');
    medIds.forEach(id=>{const d=medDef(id);if(d)leg(medColor(id),d.name);});
  }
}

/* ════════════ Stats ════════════ */
function renderStats(){
  const box=document.getElementById('statsBar');
  const today=Math.round((new Date()-parseISO(P().startDate))/86400000);
  const ms=P().moods.slice().sort((a,b)=>a.day-b.day);
  let avg=0,best=null,worst=null;
  if(ms.length){avg=ms.reduce((s,m)=>s+m.mood,0)/ms.length;
    best=ms.reduce((a,b)=>b.mood>a.mood?b:a);worst=ms.reduce((a,b)=>b.mood<a.mood?b:a);}
  // streak: consecutive days with an entry up to most recent
  let streak=0;
  if(ms.length){const days=new Set(ms.map(m=>m.day));let d=ms[ms.length-1].day;while(days.has(d)){streak++;d--;}}
  const icon=s=>`<span class="stat-icon">${s}</span>`;
  box.innerHTML=`
    <span class="stat-item"><span class="stat-label">Tracking</span> <strong>Day ${today}</strong></span>
    <span class="stat-item">${icon(ms.length?moodEmoji(avg):'😐')} <span class="stat-label">Avg</span> <strong>${ms.length?(avg>0?'+':'')+avg.toFixed(1):'—'}</strong></span>
    <span class="stat-item"><span class="stat-label">Entries</span> <strong>${ms.length}</strong></span>
    <span class="stat-item"><span class="stat-label">Streak</span> <strong>${streak} day${streak===1?'':'s'}</strong></span>
    <span class="stat-item">${best?icon(moodEmoji(best.mood)):''} <span class="stat-label">Best</span> <strong>${best?(best.mood>0?'+':'')+best.mood:'—'}</strong></span>
    <span class="stat-item">${worst?icon(moodEmoji(worst.mood)):''} <span class="stat-label">Worst</span> <strong>${worst?(worst.mood>0?'+':'')+worst.mood:'—'}</strong></span>`;
}

  }else{

    box.innerHTML=html+'</tbody></table>';
  }

/* ════════════ Resize grips ════════════ */
function setupGrips(){
  const canvas=document.getElementById('chart');const resizer=document.getElementById('chartResizer');
  if(!canvas.dataset.h)canvas.dataset.h='420';
  const vert=(grip)=>{
    grip.addEventListener('pointerdown',e=>{
      e.preventDefault();grip.classList.add('active');grip.setPointerCapture(e.pointerId);
      const startY=e.clientY,startH=parseInt(canvas.dataset.h);
      const move=ev=>{canvas.dataset.h=Math.max(200,startH+(ev.clientY-startY));render();};
      const up=()=>{grip.classList.remove('active');grip.removeEventListener('pointermove',move);grip.removeEventListener('pointerup',up);};
      grip.addEventListener('pointermove',move);grip.addEventListener('pointerup',up);
    });
  };
  const horiz=(grip,dir)=>{
    grip.addEventListener('pointerdown',e=>{
      e.preventDefault();grip.classList.add('active');grip.setPointerCapture(e.pointerId);
      const startX=e.clientX,startW=resizer.offsetWidth;
      const move=ev=>{const dw=(ev.clientX-startX)*(dir==='l'?-2:2);resizer.style.maxWidth=Math.max(300,startW+dw)+'px';resizer.style.marginLeft='auto';resizer.style.marginRight='auto';render();};
      const up=()=>{grip.classList.remove('active');grip.removeEventListener('pointermove',move);grip.removeEventListener('pointerup',up);};
      grip.addEventListener('pointermove',move);grip.addEventListener('pointerup',up);
    });
  };
  vert(document.getElementById('gripB'));
  horiz(document.getElementById('gripL'),'l');
  horiz(document.getElementById('gripR'),'r');
}

      row.appendChild(btn);box.appendChild(row);
