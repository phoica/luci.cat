/* ════════════ Wizard ════════════ */
let wizardStep=0,wizardData=null;
function openNewProfileModal(){
  wizardStep=0;
  wizardData={name:'',pic:'',startDate:isoDate(new Date()),tags:TAG_PRESETS.slice(0,6),meds:[]};
  document.getElementById('wizardTitle').textContent='New Profile';
  renderWizard();openModal('wizardModal');
}
function renderWizard(){
  const c=document.getElementById('wizardContent');
  document.getElementById('wizardBack').style.visibility=wizardStep===0?'hidden':'visible';
  document.getElementById('wizardNext').textContent=wizardStep===3?'Create':'Next';
  if(wizardStep===0){
    c.innerHTML=`<div class="wizard-step"><div class="modal-label">Profile name</div>
      <input type="text" id="wzName" placeholder="e.g. Me" value="${esc(wizardData.name)}">
      <div class="modal-label">Photo / Emoji</div>
      <div style="display:flex;gap:10px;align-items:center">
        <div id="wzPicPreview" style="width:64px;height:64px;border-radius:50%;background:var(--surface3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px">${wizardData.pic?`<img src="${wizardData.pic}" style="width:100%;height:100%;object-fit:cover">`:'🙂'}</div>
        <button class="btn btn-sm" onclick="document.getElementById('pfpInput').dataset.wizard='1';document.getElementById('pfpInput').click()">Upload</button>
        <button class="btn btn-sm" onclick="wizardEmoji()">Emoji</button>
      </div></div>`;
  }else if(wizardStep===1){
    fillThenRenderWizardDate();
    c.innerHTML=`<div class="wizard-step"><div class="modal-label">Tracking start date (day 0)</div>
      <div class="date-selects" style="margin-top:6px"><select class="ds-day" id="wzDay"></select><select class="ds-month" id="wzMonth"></select><select class="ds-year" id="wzYear"></select></div></div>`;
    setTimeout(()=>fillDateSelects(document.getElementById('wzDay'),document.getElementById('wzMonth'),document.getElementById('wzYear'),parseISO(wizardData.startDate)),0);
  }else if(wizardStep===2){
    c.innerHTML=`<div class="wizard-step"><div class="modal-label">Pick tags to track (optional)</div><div class="tag-row" id="wzTags"></div></div>`;
    setTimeout(()=>{const box=document.getElementById('wzTags');TAG_PRESETS.forEach(t=>{const el=document.createElement('div');el.className='tag tag-pill'+(wizardData.tags.includes(t)?' sel':'');el.textContent=t;el.onclick=()=>{wizardData.tags.includes(t)?wizardData.tags=wizardData.tags.filter(x=>x!==t):wizardData.tags.push(t);renderWizard();};box.appendChild(el);});},0);
  }else if(wizardStep===3){
    c.innerHTML=`<div class="wizard-step"><div class="modal-label">Add medications (optional)</div><div id="wzMeds" class="catalog-list" style="max-height:40vh"></div></div>`;
    setTimeout(()=>{const box=document.getElementById('wzMeds');GROUP_ORDER.forEach(g=>{const meds=MED_CATALOG.filter(m=>m.group===g);if(!meds.length)return;const h=document.createElement('div');h.className='epick-cat';h.textContent=g;box.appendChild(h);meds.forEach(m=>{const sel=wizardData.meds.includes(m.id);const row=document.createElement('div');row.className='catalog-row med-row'+(sel?' tracked':'');row.innerHTML=`<span class="catalog-swatch" style="background:${m.color}"></span><span class="catalog-name">${esc(m.name)}</span><span class="catalog-tag">${esc(m.unit)}</span>`;const b=document.createElement('button');b.className='btn btn-sm'+(sel?' btn-accent':'');b.textContent=sel?'Added':'+ Add';b.onclick=()=>{sel?wizardData.meds=wizardData.meds.filter(x=>x!==m.id):wizardData.meds.push(m.id);renderWizard();};row.appendChild(b);box.appendChild(row);});});},0);
  }
}
function fillThenRenderWizardDate(){}
function wizardEmoji(){emojiTarget='wizard';openEmojiPicker();}
function wizardBack(){if(wizardStep===0){closeModal('wizardModal');return;}captureWizardStep();wizardStep--;renderWizard();}
function wizardNext(){captureWizardStep();if(wizardStep<3){wizardStep++;renderWizard();return;}
  // create
  let name=wizardData.name.trim()||'Profile';let n=name,i=2;while(profiles[n])n=name+' '+(i++);
  pushUndo();const p=blankProfile();p.profilePic=wizardData.pic;p.startDate=wizardData.startDate;p.tags=wizardData.tags.slice();p.medications=wizardData.meds.slice();
  profiles[n]=p;activeProfileName=n;save();closeModal('wizardModal');renderAll();toast('Profile created');
}
function captureWizardStep(){
  if(wizardStep===0){const el=document.getElementById('wzName');if(el)wizardData.name=el.value;}
  else if(wizardStep===1){const d=document.getElementById('wzDay');if(d)wizardData.startDate=isoDate(readDateSelects(d,document.getElementById('wzMonth'),document.getElementById('wzYear')));}
}

/* ════════════ Profile pic upload + crop ════════════ */
let cropImg=null,cropPan={x:0,y:0},cropTarget='profile';
function onPfpFile(e){
  const f=e.target.files[0];if(!f)return;const isWiz=e.target.dataset.wizard==='1';e.target.dataset.wizard='';
  cropTarget=isWiz?'wizard':'profile';
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{cropImg=img;cropPan={x:0,y:0};document.getElementById('cropZoom').value=1;openModal('cropModal');drawCrop();};img.src=r.result;};r.readAsDataURL(f);e.target.value='';
}
function drawCrop(){
  if(!cropImg)return;const cv=document.getElementById('cropCanvas');const ctx=cv.getContext('2d');
  const z=parseFloat(document.getElementById('cropZoom').value);
  const base=Math.max(cv.width/cropImg.width,cv.height/cropImg.height);
  const scale=base*z;const w=cropImg.width*scale,h=cropImg.height*scale;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(cropImg,(cv.width-w)/2+cropPan.x,(cv.height-h)/2+cropPan.y,w,h);
}
(function cropPanSetup(){
  const stage=document.getElementById('cropStage');let drag=false,sx,sy;
  stage.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;stage.setPointerCapture(e.pointerId);stage.style.cursor='grabbing';});
  stage.addEventListener('pointermove',e=>{if(!drag)return;cropPan.x+=e.clientX-sx;cropPan.y+=e.clientY-sy;sx=e.clientX;sy=e.clientY;drawCrop();});
  stage.addEventListener('pointerup',()=>{drag=false;stage.style.cursor='grab';});
})();
function saveCrop(){
  const out=document.createElement('canvas');out.width=200;out.height=200;const octx=out.getContext('2d');
  const src=document.getElementById('cropCanvas');octx.drawImage(src,0,0,src.width,src.height,0,0,200,200);
  const data=out.toDataURL('image/jpeg',0.85);
  if(cropTarget==='wizard'){wizardData.pic=data;renderWizard();}
  else{pushUndo();P().profilePic=data;save();renderProfileTabs();}
  closeModal('cropModal');
}

/* ════════════ Emoji picker ════════════ */
let emojiTarget='profile';
const EMOJI_CATS={'Faces':['😀','😄','😊','🙂','😎','🥳','😇','🤓','😌','😏','🥰','😍','🤗','😴','🤔','😅'],'Animals':['🐱','🐶','🦊','🐻','🐼','🐨','🦁','🐯','🐰','🐹','🦄','🐸','🦋','🐙','🦦','🐧'],'Nature':['🌸','🌼','🌷','🌹','🌻','🍀','🌿','🌙','⭐','☀️','🌈','🔥','💧','❄️','🍄','🌊'],'Symbols':['💜','💙','💚','💛','🧡','❤️','🩷','✨','💫','🎀','🎈','💎','🦴','🩹','🌟','💝']};
function openEmojiPicker(){
  const b=document.getElementById('emojiPickerBody');b.innerHTML='';
  Object.entries(EMOJI_CATS).forEach(([cat,list])=>{
    const h=document.createElement('div');h.className='epick-cat';h.textContent=cat;b.appendChild(h);
    const g=document.createElement('div');g.className='emoji-picker-grid';
    list.forEach(em=>{const btn=document.createElement('button');btn.textContent=em;btn.onclick=()=>emojiToPic(em);g.appendChild(btn);});
    b.appendChild(g);
  });
  openModal('emojiModal');
}
function emojiToPic(em){
  const cv=document.createElement('canvas');cv.width=120;cv.height=120;const ctx=cv.getContext('2d');
  const cs=getComputedStyle(document.body);ctx.fillStyle=cs.getPropertyValue('--surface3').trim();ctx.fillRect(0,0,120,120);
  ctx.font='80px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(em,60,66);
  const data=cv.toDataURL('image/png');
  if(emojiTarget==='wizard'){wizardData.pic=data;renderWizard();}
  else{pushUndo();P().profilePic=data;save();renderProfileTabs();}
  emojiTarget='profile';closeModal('emojiModal');
}

/* ════════════ Render all ════════════ */
function renderAll(){
  renderProfileTabs();renderChartTabs();renderEmojiScale();updateMoodDisplay();renderMoodLegend();renderMoodTags();
  renderDoseMedPills();renderStats();renderHistory();
  document.getElementById('xMinInput').value=P().tMin;document.getElementById('xMaxInput').value=P().xMax;
  // sync date selects to today
  const today=new Date();
  fillDateSelects(document.getElementById('moodDay'),document.getElementById('moodMonth'),document.getElementById('moodYear'),today);
  fillDateSelects(document.getElementById('doseDay'),document.getElementById('doseMonth'),document.getElementById('doseYear'),today);
  render();
}

/* ════════════ Init ════════════ */
function init(){
  setTheme(localStorage.getItem(THEME_KEY)||'dark');
  const raw=localStorage.getItem(LS_KEY);
  if(raw){try{const o=JSON.parse(raw);profiles=o.profiles||{};activeProfileName=o.active;}catch(_){}}
  if(!profiles||!Object.keys(profiles).length){profiles={'Me':blankProfile()};activeProfileName='Me';save();}
  if(!activeProfileName||!profiles[activeProfileName])activeProfileName=Object.keys(profiles)[0];
  // migrate
  Object.values(profiles).forEach(p=>{p.moods=p.moods||[];p.doses=p.doses||{};p.tags=p.tags||TAG_PRESETS.slice(0,6);p.medications=p.medications||[];p.customMeds=p.customMeds||[];p.medCustom=p.medCustom||{};if(p.tMin==null)p.tMin=-20;if(p.xMax==null)p.xMax=200;if(!p.startDate)p.startDate=isoDate(new Date());});
  setupGrips();renderAll();
  window.addEventListener('resize',()=>render());
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)redo();else undo();}
    if(e.key==='Escape')document.querySelectorAll('.modal-overlay.open').forEach(m=>{m.classList.remove('open');document.body.classList.remove('modal-open');});
  });
  document.querySelectorAll('.modal-overlay').forEach(ov=>ov.addEventListener('click',e=>{if(e.target===ov){ov.classList.remove('open');document.body.classList.remove('modal-open');}}));
}
init();
</script>
