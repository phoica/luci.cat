<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>Mood Tracker</title>
<link rel="icon" type="image/png" href="websyteicon.png">
<link rel="apple-touch-icon" href="websyteicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=JetBrains+Mono:wght@400;500&family=Metamorphous&family=Cabin+Sketch:wght@400;700&family=Silkscreen:wght@400;700&family=Fascinate&display=swap" rel="stylesheet">
<style>
:root,body[data-theme="dark"]{--bg:#000;--surface:#0c0f15;--surface2:#181d27;--surface3:#2a3142;--border:#525a6c;--border-hover:#7a8294;--text:#fff;--text-muted:#c4ccd8;--text-dim:#8a92a0;--accent:#ffb070;--accent-dim:rgba(255,176,112,.18);--accent-glow:rgba(255,176,112,.55);--danger:#ff8a8a;--radius:12px;--radius-sm:8px;--shadow:0 4px 28px rgba(0,0,0,.85);--pos:#4ade80;--pos-dim:rgba(74,222,128,.16);--neg:#f87171;--neg-dim:rgba(248,113,113,.16)}
body[data-theme="dim"]{--bg:#101216;--surface:#181b20;--surface2:#1f2228;--surface3:#272a31;--border:#2e3239;--border-hover:#3e434b;--text:#d8dae0;--text-muted:#8a8e9a;--text-dim:#5c606c;--accent:#e89854;--accent-dim:rgba(232,152,84,.13);--accent-glow:rgba(232,152,84,.28);--danger:#cf6b6b;--radius:12px;--radius-sm:8px;--shadow:0 4px 24px rgba(0,0,0,.5);--pos:#4ade80;--pos-dim:rgba(74,222,128,.13);--neg:#f87171;--neg-dim:rgba(248,113,113,.13)}
body[data-theme="light"]{--bg:#f4f2ef;--surface:#fff;--surface2:#f0eee9;--surface3:#e6e3dd;--border:#d4d0c8;--border-hover:#b8b4ac;--text:#2c2a26;--text-muted:#6b6860;--text-dim:#9c9890;--accent:#c47138;--accent-dim:rgba(196,113,56,.1);--accent-glow:rgba(196,113,56,.2);--danger:#c45050;--radius:12px;--radius-sm:8px;--shadow:0 4px 20px rgba(0,0,0,.08);--pos:#16a34a;--pos-dim:rgba(22,163,74,.1);--neg:#dc2626;--neg-dim:rgba(220,38,38,.1)}
body[data-theme="cottage"]{--bg:#f3eadb;--surface:#fbf6ec;--surface2:#ebe0cd;--surface3:#dfd2bb;--border:#c9b896;--border-hover:#a89377;--text:#3d2f22;--text-muted:#7a6450;--text-dim:#a89377;--accent:#c79090;--accent-dim:rgba(199,144,144,.14);--accent-glow:rgba(199,144,144,.28);--danger:#b56b5a;--radius:16px;--radius-sm:12px;--shadow:0 4px 20px rgba(120,85,45,.1),0 1px 3px rgba(120,85,45,.06);--pos:#6b9e6b;--pos-dim:rgba(107,158,107,.14);--neg:#c47070;--neg-dim:rgba(196,112,112,.14)}
body[data-theme="evil"]{--bg:#08040a;--surface:#0e060c;--surface2:#180a14;--surface3:#22101c;--border:#3c1428;--border-hover:#5c1e3a;--text:#e8c0cc;--text-muted:#a87088;--text-dim:#6c3850;--accent:#dc2040;--accent-dim:rgba(220,32,64,.15);--accent-glow:rgba(220,32,64,.35);--danger:#ff2848;--radius:10px;--radius-sm:7px;--shadow:0 4px 30px rgba(220,0,40,.2);--pos:#a040c0;--pos-dim:rgba(160,64,192,.15);--neg:#dc2040;--neg-dim:rgba(220,32,64,.15)}
body[data-theme="nonchalant"]{--bg:#1e2420;--surface:#262d28;--surface2:#2e3630;--surface3:#3a4238;--border:#3d4a3e;--border-hover:#556253;--text:#d4d9ce;--text-muted:#9aa696;--text-dim:#6b7668;--accent:#8fb380;--accent-dim:rgba(143,179,128,.14);--accent-glow:rgba(143,179,128,.25);--danger:#c78a6b;--radius:12px;--radius-sm:9px;--shadow:0 4px 20px rgba(20,30,20,.3);--pos:#8fb380;--pos-dim:rgba(143,179,128,.15);--neg:#c78a6b;--neg-dim:rgba(199,138,107,.15)}

*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:28px;line-height:1.6;font-size:17px;overflow-x:hidden}

/* ── Header ── */
.header{display:flex;align-items:center;gap:8px;margin-bottom:24px;flex-wrap:nowrap}
.header h1{font-size:42px;font-weight:600;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent),#a8c4e8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;line-height:1;flex-shrink:0}
body[data-theme="light"] .header h1{background:linear-gradient(135deg,#e89854,#f0c474);-webkit-background-clip:text}
body[data-theme="cottage"] .header h1{font-family:'Cabin Sketch',cursive;font-weight:700;font-size:46px;background:linear-gradient(135deg,#c79090,#9caf88,#d4a574);-webkit-background-clip:text}
body[data-theme="evil"] .header h1{font-family:'Metamorphous',serif;font-weight:400;letter-spacing:1px;font-size:42px;background:linear-gradient(135deg,#dc2040,#880020);-webkit-background-clip:text}
body[data-theme="nonchalant"] .header h1{font-family:'Fascinate',cursive;font-weight:400;font-size:42px;background:linear-gradient(135deg,#8fb380,#a8a070);-webkit-background-clip:text}
body[data-theme="dark"] .header h1,:root .header h1{font-family:'Silkscreen',monospace;font-size:36px;letter-spacing:1px;font-weight:400;background:linear-gradient(135deg,#ffb070,#ffd29c);-webkit-background-clip:text}
body[data-theme="dim"] .header h1{font-family:'Silkscreen',monospace;font-size:36px;letter-spacing:1px;font-weight:400;background:linear-gradient(135deg,#e89854,#f0c474);-webkit-background-clip:text}
.header .by{font-size:15px;color:var(--text-dim);flex-shrink:0}
.header-spacer{flex:1;min-width:0}
.header-controls{display:inline-flex;align-items:center;gap:8px;flex-shrink:0}
.header-menu-toggle{display:none;width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text-muted);cursor:pointer;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.header-menu-toggle svg{width:18px;height:18px}
.header-menu-toggle:hover,.header-menu-toggle.open{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}

/* ── Profile bar ── */
.profile-bar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:22px;flex-wrap:wrap}
.profile-bar-label{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-dim);font-weight:600;white-space:nowrap;flex-shrink:0}
.profile-tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.profile-tab{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:32px;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);font-family:inherit;font-size:14px;cursor:pointer;transition:all .2s;white-space:nowrap;position:relative;flex-shrink:0}
.profile-tab:hover{background:var(--surface3);color:var(--text);border-color:var(--border-hover)}
.profile-tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--text);font-weight:500}
.tab-dot{width:9px;height:9px;border-radius:50%;background:var(--text-dim);flex-shrink:0}
.profile-tab.active .tab-dot{background:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
.tab-menu-btn{width:21px;height:21px;border-radius:50%;border:none;background:var(--surface3);color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:all .15s;flex-shrink:0}
.tab-menu-btn svg{width:11px;height:11px}
.tab-menu-btn:hover{background:var(--accent);color:#fff}
.ctx-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:4px 0;min-width:150px;display:none}
.ctx-menu.open{display:block}
.ctx-menu-item{display:block;width:100%;padding:9px 16px;background:none;border:none;color:var(--text-muted);font-family:inherit;font-size:14px;text-align:left;cursor:pointer}
.ctx-menu-item:hover{background:var(--surface2);color:var(--text)}
.ctx-menu-item.danger:hover{color:var(--danger)}
.profile-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--border-hover);color:var(--text);background:var(--surface3)}
.btn-accent{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.btn-accent:hover{background:var(--accent);color:#fff}
.btn-sm{padding:5px 12px;font-size:13px}
.btn svg{width:15px;height:15px;flex-shrink:0}
body[data-theme="cottage"] .btn-accent{background:linear-gradient(135deg,#d4a4a4,#c79090,#b87a8a);border-color:rgba(150,90,90,.3);color:#fdf9f0;font-weight:600;box-shadow:0 2px 8px rgba(199,144,144,.3),inset 0 1px 0 rgba(255,255,255,.4)}
body[data-theme="evil"] .btn-accent{background:linear-gradient(180deg,#e83858,#a00020);color:#fff!important;border-color:#5a0018;box-shadow:0 0 12px rgba(220,32,64,.4);font-weight:600}
body[data-theme="nonchalant"] .btn-accent{background:linear-gradient(180deg,#9cbf8c,#7a9e6e);color:#1e2420!important;border-color:#6a8a60;font-weight:500}

/* ── Layout ── */
.panels-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.panels-grid{grid-template-columns:1fr}}
.panel{padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px}
.panel-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);display:flex;align-items:center;gap:8px;flex-shrink:0}
.panel-title::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--accent);flex-shrink:0}
body[data-theme="cottage"] .panel{background:linear-gradient(180deg,#fdf9f0 0%,var(--surface) 6%,var(--surface) 94%,#f4ead8 100%);box-shadow:0 4px 16px rgba(120,85,45,.08),inset 0 1px 0 rgba(255,255,255,.6)}
body[data-theme="cottage"] .panel-title::after{content:" ❀";color:var(--accent);font-size:.85em;opacity:.7}

/* ── Emoji picker ── */
.emoji-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 8px 8px;margin-bottom:10px}
.emoji-row{display:flex;align-items:flex-end;justify-content:center;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:16px;scrollbar-width:none}
.emoji-row::-webkit-scrollbar{display:none}
.emoji-btn{font-size:20px;line-height:1;cursor:pointer;border:2px solid transparent;border-radius:50%;padding:4px;background:transparent;transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .1s,border-color .1s,box-shadow .1s;user-select:none;-webkit-user-select:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;width:36px;height:36px}
.emoji-btn:hover{transform:scale(1.55) translateY(-7px);z-index:2}
.emoji-btn.selected{transform:scale(1.6) translateY(-9px);border-color:var(--accent);box-shadow:0 0 14px var(--accent-glow);z-index:3}
.emoji-btn.neg:hover{background:var(--neg-dim);border-color:var(--neg)}
.emoji-btn.neg.selected{background:var(--neg-dim);border-color:var(--neg);box-shadow:0 0 12px rgba(248,113,113,.4)}
.emoji-btn.pos:hover{background:var(--pos-dim);border-color:var(--pos)}
.emoji-btn.pos.selected{background:var(--pos-dim);border-color:var(--pos);box-shadow:0 0 12px rgba(74,222,128,.35)}
.emoji-btn.neutral:hover,.emoji-btn.neutral.selected{background:var(--accent-dim)}
.emoji-axis{display:flex;justify-content:space-between;padding:0 2px;font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin-top:-12px}
.mood-readout{text-align:center;margin:10px 0 0;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.mood-value{font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace;transition:color .15s;color:var(--text-dim)}
.mood-label{font-size:13px;color:var(--text-muted);min-height:18px}
.mood-legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--border);margin:12px 0 0;font-size:12px;color:var(--text-muted)}
.legend-item{display:flex;align-items:center;gap:4px}

/* ── Field ── */
.field-label{font-size:11px;color:var(--text-dim);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.date-selects{display:flex;gap:4px}
.date-selects select,.ds-day,.ds-month,.ds-year{padding:9px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;cursor:pointer}
.date-selects select:focus{border-color:var(--accent)}
.ds-day{width:54px}
.ds-month{width:110px}
.ds-year{width:78px}

/* ── Tags ── */
.tag-row{display:flex;gap:5px;flex-wrap:wrap;min-height:28px;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:14px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);cursor:pointer;transition:all .15s;user-select:none;flex-shrink:0}
.tag:hover{background:var(--surface3);border-color:var(--border-hover);color:var(--text)}
.tag.selected{border-color:var(--accent);background:var(--accent-dim);color:var(--text)}
.tag-x{width:14px;height:14px;border-radius:50%;border:none;background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:1;flex-shrink:0}
.tag-x:hover{background:var(--danger);color:#fff}

/* ── Med pills in log panel ── */
.med-log-row{display:flex;gap:5px;flex-wrap:wrap;min-height:24px;margin-bottom:8px}
.med-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:14px;font-size:12px;font-weight:500;border:1.5px solid transparent;cursor:pointer;transition:all .15s;user-select:none;flex-shrink:0}
.med-pill:hover{filter:brightness(1.1)}
.med-pill.checked{box-shadow:0 0 0 2px var(--text);opacity:1}
.med-pill:not(.checked){opacity:.5}

/* ── Tracked meds list ── */
.med-list{display:flex;flex-direction:column;gap:8px}
.med-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);font-size:14px}
.med-color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.med-info{flex:1;min-width:0}
.med-name-text{font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.med-sub{font-size:12px;color:var(--text-dim)}
.med-actions{display:flex;gap:4px;flex-shrink:0}
.med-action-btn{width:26px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:all .15s}
.med-action-btn svg{width:13px;height:13px}
.med-action-btn:hover{color:var(--text);border-color:var(--border-hover)}
.med-action-btn.del:hover{color:var(--danger);border-color:var(--danger)}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px}
.stat-card .s-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);font-weight:600;margin-bottom:3px}
.stat-card .s-val{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text);line-height:1.2}
.stat-card .s-sub{font-size:11px;color:var(--text-muted);margin-top:2px}

/* ── Chart ── */
.chart-section{margin-top:20px;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.chart-section canvas{width:100%;display:block;border-radius:var(--radius-sm)}
body[data-theme="cottage"] .chart-section{background:linear-gradient(180deg,#fdf9f0 0%,var(--surface) 4%);box-shadow:0 4px 16px rgba(120,85,45,.06)}

/* ── History ── */
.history-section{margin-top:20px;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.history-table{width:100%;border-collapse:collapse;font-size:14px}
.history-table th{padding:8px 10px;text-align:left;color:var(--text-dim);font-weight:500;text-transform:uppercase;font-size:10px;letter-spacing:.6px;border-bottom:1px solid var(--border)}
.history-table td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text-muted);vertical-align:middle}
.history-table tr:last-child td{border-bottom:none}
.history-table tr:hover td{color:var(--text);background:var(--surface2)}
.hist-btn{padding:4px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;transition:all .15s;flex-shrink:0}
.hist-btn:hover{color:var(--danger);border-color:var(--danger)}
.hist-btn svg{width:12px;height:12px}
.mood-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-weight:600;font-family:'JetBrains Mono',monospace;font-size:12px}
.mood-badge.pos{background:var(--pos-dim);color:var(--pos)}
.mood-badge.neg{background:var(--neg-dim);color:var(--neg)}
.mood-badge.neutral{background:var(--accent-dim);color:var(--accent)}
.hist-pills{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.hist-med-pill{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:500;opacity:.85}
.hist-tag{font-size:10px;padding:2px 7px;border-radius:8px;border:1px solid var(--border);color:var(--text-dim)}
.history-empty{color:var(--text-dim);font-size:14px;padding:12px 0}

/* ── Catalog modal ── */
.cat-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.cat-tab{padding:5px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);font-family:inherit;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.cat-tab.active{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.cat-tab:hover:not(.active){background:var(--surface3);color:var(--text)}
.catalog-grid{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;padding-right:4px}
.catalog-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);cursor:pointer;transition:all .15s}
.catalog-item:hover{background:var(--surface3);border-color:var(--border-hover)}
.catalog-item.selected{border-color:var(--accent);background:var(--accent-dim)}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-item-main{flex:1;min-width:0}
.cat-item-name{font-size:14px;font-weight:500;color:var(--text)}
.cat-item-sub{font-size:11px;color:var(--text-dim);margin-top:1px}
.cat-item-badge{font-size:10px;padding:2px 7px;border-radius:8px;border:1px solid var(--border);color:var(--text-dim);flex-shrink:0;white-space:nowrap}

/* ── Med add/edit form ── */
.med-form{display:flex;flex-direction:column;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.med-form .field-label{margin-bottom:4px}
.med-form input[type="text"],.med-form input[type="number"],.med-form select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:inherit;font-size:14px;outline:none}
.med-form input:focus,.med-form select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.med-form .row{display:flex;gap:8px}
.med-form .row>*{flex:1;min-width:0}
.color-swatches{display:flex;gap:6px;flex-wrap:wrap}
.color-swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .15s;flex-shrink:0}
.color-swatch:hover{transform:scale(1.15)}
.color-swatch.selected{border-color:var(--text);transform:scale(1.15)}

/* ── No profile ── */
.no-profile{text-align:center;padding:60px 20px;color:var(--text-dim)}
.no-profile .big{font-size:50px;margin-bottom:12px}
.no-profile p{font-size:16px;margin-bottom:20px}

/* ── Toast ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:11px 22px;border-radius:22px;font-size:15px;box-shadow:var(--shadow);opacity:0;transition:all .35s cubic-bezier(.16,1,.3,1);z-index:200;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Modals ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
html:has(.modal-overlay.open){overflow:hidden!important}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:0;width:460px;max-width:100%;max-height:90vh;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:22px 24px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-head h3{font-size:18px;font-weight:600}
.modal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 24px}
.modal-foot{padding:14px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0}
.modal input[type="text"]{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:inherit;font-size:15px;outline:none;margin-bottom:0}
.modal input[type="text"]:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.modal-body .field-label{display:block;margin-bottom:6px}
body[data-theme="cottage"] .modal{background:linear-gradient(180deg,#fdf9f0,var(--surface));box-shadow:0 12px 40px rgba(80,55,35,.25),inset 0 1px 0 rgba(255,255,255,.6)}

/* ── Theme select ── */
.theme-select{padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);font-family:inherit;font-size:13px;cursor:pointer;outline:none}
.theme-select:hover{border-color:var(--accent);color:var(--accent)}
.theme-select option{background:var(--surface2);color:var(--text)}

/* ── Responsive ── */
@media(max-width:1024px){body{padding:20px}.header h1{font-size:36px}body[data-theme="dark"] .header h1{font-size:30px}body[data-theme="cottage"] .header h1{font-size:38px}}
@media(max-width:900px){body{padding:16px}.panels-grid{grid-template-columns:1fr;gap:14px}.header h1{font-size:32px}body[data-theme="dark"] .header h1{font-size:26px}body[data-theme="cottage"] .header h1{font-size:34px}}
@media(max-width:640px){
  body{padding:10px 8px;font-size:15px}
  .header{margin-bottom:14px;gap:6px}
  .header h1{font-size:28px}
  body[data-theme="dark"] .header h1,:root .header h1{font-size:22px;letter-spacing:.5px}
  body[data-theme="dim"] .header h1{font-size:22px}
  body[data-theme="cottage"] .header h1{font-size:30px}
  body[data-theme="evil"] .header h1,body[data-theme="nonchalant"] .header h1{font-size:26px}
  .header .by{display:none}
  .header-spacer{display:none}
  .header-controls{position:absolute;top:56px;right:8px;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:10px;flex-direction:column;align-items:stretch;gap:8px;min-width:180px;display:none}
  .header-controls.open{display:flex}
  .header-controls .theme-select,.header-controls .btn{width:100%;justify-content:center}
  .header-menu-toggle{display:inline-flex}
  .header{position:relative;flex-wrap:nowrap}
  .profile-bar{padding:8px 12px;gap:8px}
  .profile-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;padding-bottom:2px;mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent);-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent)}
  .profile-actions{flex-basis:100%;gap:6px}
  .profile-actions .btn{flex:1;justify-content:center;font-size:12px;padding:7px 8px}
  .panel{padding:14px}
  .date-selects select{flex:1;min-width:0;padding:9px 4px;font-size:13px}
  .emoji-btn{width:30px;height:30px;font-size:17px}
  .stats-grid{gap:8px}
  .stat-card .s-val{font-size:18px}
  .chart-section,.history-section{padding:14px}
  .modal-overlay{padding:0;align-items:flex-end}
  .modal{max-width:100vw!important;width:100vw;max-height:88vh;border-radius:16px 16px 0 0}
  .modal::before{content:"";display:block;width:40px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0;flex-shrink:0}
  .modal-head{padding:10px 18px 14px}
  .modal-body{padding:0 18px 8px}
  .modal-foot{padding:12px 18px;flex-wrap:wrap}
  .modal-foot .btn{flex:1;min-width:0;justify-content:center;min-height:42px}
  .cat-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent);-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent)}
  .cat-tab{flex-shrink:0}
  .history-table th,.history-table td{padding:7px 6px;font-size:12px}
  .toast{left:10px;right:10px;max-width:none;text-align:center}
  .ctx-menu-item{padding:12px 16px;font-size:14px}
}
@media(max-width:380px){body{padding:8px 6px}.header h1{font-size:24px}body[data-theme="dark"] .header h1,:root .header h1{font-size:20px}}
@media(hover:none){button:not(.tab-menu-btn):not(.tag-x):not(.med-action-btn):not(.hist-btn),.profile-tab,.cat-tab{min-height:36px}}
</style>

const CAT_NAMES=['All','HRT','SSRI','SNRI','Antipsychotic','Mood Stabilizer','Anxiety','Stimulant','Other','Therapy'];

// ── Mood data ───────────────────────────────────────────────────────────────
const MOODS=[
  {v:-10,e:'😭',label:'Awful',c:'neg'},{v:-9,e:'😢',label:'Miserable',c:'neg'},
  {v:-8,e:'😰',label:'Scared',c:'neg'},{v:-7,e:'😞',label:'Down',c:'neg'},
  {v:-6,e:'😣',label:'Struggling',c:'neg'},{v:-5,e:'😟',label:'Worried',c:'neg'},
  {v:-4,e:'😕',label:'Uneasy',c:'neg'},{v:-3,e:'😔',label:'Low',c:'neg'},
  {v:-2,e:'😑',label:'Flat',c:'neg'},{v:-1,e:'😶',label:'Muted',c:'neg'},
  {v:0,e:'😐',label:'Neutral',c:'neutral'},
  {v:1,e:'🙂',label:'Okay',c:'pos'},{v:2,e:'😊',label:'Good',c:'pos'},
  {v:3,e:'😌',label:'Calm',c:'pos'},{v:4,e:'😀',label:'Happy',c:'pos'},
  {v:5,e:'😄',label:'Great',c:'pos'},{v:6,e:'😃',label:'Joyful',c:'pos'},
  {v:7,e:'😁',label:'Excited',c:'pos'},{v:8,e:'🤗',label:'Warm',c:'pos'},
  {v:9,e:'😍',label:'Wonderful',c:'pos'},{v:10,e:'🤩',label:'Amazing',c:'pos'},
];
const LEGEND_PTS=[-10,-5,0,5,10];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ── State ───────────────────────────────────────────────────────────────────
let S={profiles:[],currentId:null};
let pendingMood=null, pendingTags=new Set(), pendingMedIds=new Set();
let renamingId=null, editingMedId=null;
let activeCatFilter='All', selectedCatalogItem=null, chosenColor=CAT_COLORS[0];

function curP(){return S.profiles.find(p=>p.id===S.currentId)||null}

// ── Persistence ─────────────────────────────────────────────────────────────
const SK='mood-tracker-v2';
function save(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
function load(){
  try{const r=localStorage.getItem(SK);if(r)S=JSON.parse(r)}catch(e){}
  if(!Array.isArray(S.profiles))S.profiles=[];
  S.profiles.forEach(p=>{
    if(!Array.isArray(p.meds))p.meds=[];
    if(!Array.isArray(p.tags))p.tags=[];
    if(!Array.isArray(p.entries))p.entries=[];
  });
}

// ── Theme ────────────────────────────────────────────────────────────────────
function applyTheme(t){
  document.body.setAttribute('data-theme',t||'');
  document.getElementById('themeSelect').value=t||'';
  try{localStorage.setItem('mood-theme',t||'')}catch(e){}
}

// ── Toast ────────────────────────────────────────────────────────────────────
let _tt;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2200)}

// ── Helpers ──────────────────────────────────────────────────────────────────
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function todayStr(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function p2(n){return String(n).padStart(2,'0')}
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmtD(s){const d=parseD(s);return`${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`}
function fmtDs(s){const d=parseD(s);return`${MONTHS[d.getMonth()]} ${d.getDate()}`}
function moodOf(v){return MOODS.find(m=>m.v===v)||MOODS[10]}
function dateStr(y,m,d){return`${y}-${p2(Number(m)+1)}-${p2(Number(d))}`}

// Date select builder
function buildDateSelects(baseId,initStr){
  const init=initStr?initStr.split('-').map(Number):[new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate()];
  const mOpts=MONTHS.map((mn,i)=>`<option value="${i}"${i===init[1]-1?' selected':''}>${mn}</option>`).join('');
  let dOpts='';for(let i=1;i<=31;i++)dOpts+=`<option value="${i}"${i===init[2]?' selected':''}>${i}</option>`;
  const yr=new Date().getFullYear();let yOpts='';for(let y=yr+1;y>=yr-5;y--)yOpts+=`<option value="${y}"${y===init[0]?' selected':''}>${y}</option>`;
  return`<select class="ds-month" id="${baseId}M">${mOpts}</select><select class="ds-day" id="${baseId}D">${dOpts}</select><select class="ds-year" id="${baseId}Y">${yOpts}</select>`;
}
function getDateFrom(baseId){
  const m=document.getElementById(baseId+'M')?.value;
  const d=document.getElementById(baseId+'D')?.value;
  const y=document.getElementById(baseId+'Y')?.value;
  if(m==null||!d||!y)return todayStr();
  return dateStr(y,m,d);
}

// ── Profile ops ──────────────────────────────────────────────────────────────
function addProfile(name){const id=uid();S.profiles.push({id,name,entries:[],tags:[],meds:[]});S.currentId=id;save();render()}
function deleteProfile(id){S.profiles=S.profiles.filter(p=>p.id!==id);if(S.currentId===id)S.currentId=S.profiles[0]?.id||null;save();render()}
function renameProfile(id,name){const p=S.profiles.find(p=>p.id===id);if(p){p.name=name;save();render()}}

// ── Entry ops ────────────────────────────────────────────────────────────────
function addEntry(date,mood,tags,medIds){
  const p=curP();if(!p)return;
  p.entries.push({id:uid(),date,mood,tags:[...tags],meds:[...medIds]});
  p.entries.sort((a,b)=>a.date.localeCompare(b.date));
  save();
}
function delEntry(eid){const p=curP();if(!p)return;p.entries=p.entries.filter(e=>e.id!==eid);save();render()}

// ── Med ops ──────────────────────────────────────────────────────────────────
function addMed(name,color,category,dose,unit,startDate,notes){
  const p=curP();if(!p)return;
  p.meds.push({id:uid(),name,color,category,dose,unit,startDate,endDate:null,notes:notes||''});
  save();
}
function deleteMed(mid){const p=curP();if(!p)return;p.meds=p.meds.filter(m=>m.id!==mid);save();render()}
function editMed(mid,dose,unit,endDate,notes){
  const p=curP();if(!p)return;
  const m=p.meds.find(m=>m.id===mid);if(!m)return;
  m.dose=dose;m.unit=unit;m.endDate=endDate||null;m.notes=notes;save();render();
}

// ── Main render ──────────────────────────────────────────────────────────────
function render(){renderProfiles();renderMain()}

function renderProfiles(){
  const tabs=document.getElementById('profileTabs');tabs.innerHTML='';
  for(const p of S.profiles){
    const tab=document.createElement('button');
    tab.className='profile-tab'+(p.id===S.currentId?' active':'');
    const menu=document.createElement('div');
    menu.className='ctx-menu';
    menu.innerHTML=`<button class="ctx-menu-item" data-a="rename">rename</button><button class="ctx-menu-item danger" data-a="delete">delete</button>`;
    const menuBtn=document.createElement('button');
    menuBtn.className='tab-menu-btn';
    menuBtn.innerHTML=`<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="8" cy="13" r="1.5"/></svg>`;
    const nameSpan=document.createElement('span');nameSpan.textContent=p.name;
    const dot=document.createElement('span');dot.className='tab-dot';
    tab.appendChild(dot);tab.appendChild(nameSpan);tab.appendChild(menuBtn);tab.appendChild(menu);
    menuBtn.addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.ctx-menu.open').forEach(m=>{if(m!==menu)m.classList.remove('open')});menu.classList.toggle('open')});
    menu.addEventListener('click',e=>{const btn=e.target.closest('[data-a]');if(!btn)return;e.stopPropagation();menu.classList.remove('open');if(btn.dataset.a==='delete'){if(confirm(`Delete "${p.name}"? All data will be lost.`))deleteProfile(p.id)}else{renamingId=p.id;document.getElementById('renameInput').value=p.name;openModal('renameModal');setTimeout(()=>document.getElementById('renameInput').focus(),50)}});
    tab.addEventListener('click',e=>{if(e.target.closest('.tab-menu-btn')||e.target.closest('.ctx-menu'))return;S.currentId=p.id;pendingMood=null;pendingTags=new Set();pendingMedIds=new Set();render()});
    tabs.appendChild(tab);
  }
}

function renderMain(){
  const el=document.getElementById('mainContent');
  const p=curP();
  if(!p){el.innerHTML=`<div class="no-profile"><div class="big">🌙</div><p>no profiles yet</p><button class="btn btn-accent" onclick="document.getElementById('addProfileBtn').click()">+ add profile</button></div>`;return}

  const today=new Date();
  const mOpts=MONTHS.map((m,i)=>`<option value="${i}"${i===today.getMonth()?' selected':''}>${m}</option>`).join('');
  let dOpts='';for(let i=1;i<=31;i++)dOpts+=`<option value="${i}"${i===today.getDate()?' selected':''}>${i}</option>`;
  const ty=today.getFullYear();let yOpts='';for(let y=ty+1;y>=ty-5;y--)yOpts+=`<option value="${y}"${y===ty?' selected':''}>${y}</option>`;

  const activeMeds=p.meds.filter(m=>{
    if(!m.startDate)return false;
    const t=todayStr();
    return m.startDate<=t&&(!m.endDate||m.endDate>=t);
  });

  el.innerHTML=`
  <div class="panels-grid">
    <div class="panel">
      <div class="panel-header"><span class="panel-title">log mood</span></div>
      <div class="emoji-wrap">
        <div class="emoji-row" id="emojiRow">
          ${MOODS.map(m=>`<button class="emoji-btn ${m.c}${pendingMood===m.v?' selected':''}" data-v="${m.v}">${m.e}</button>`).join('')}
        </div>
        <div class="emoji-axis"><span>−10</span><span>0</span><span>+10</span></div>
        <div class="mood-readout">
          <div class="mood-value" id="moodVal" style="color:${pendingMood===null?'var(--text-dim)':pendingMood>0?'var(--pos)':pendingMood<0?'var(--neg)':'var(--accent)'}">${pendingMood===null?'—':pendingMood>0?`+${pendingMood}`:pendingMood}</div>
          <div class="mood-label" id="moodLbl">${pendingMood!==null?moodOf(pendingMood).label:''}</div>
        </div>
      </div>
      <div class="mood-legend">${LEGEND_PTS.map(v=>{const m=moodOf(v);return`<div class="legend-item">${m.e} ${m.label}</div>`}).join('')}</div>

      <div style="margin-top:14px">
        <div class="field-label">date</div>
        <div class="date-selects"><select class="ds-month" id="logM">${mOpts}</select><select class="ds-day" id="logD">${dOpts}</select><select class="ds-year" id="logY">${yOpts}</select></div>
      </div>

      ${activeMeds.length?`<div style="margin-top:12px">
        <div class="field-label">active meds today <span style="color:var(--text-dim);font-size:10px;text-transform:none;letter-spacing:0">(tap to include)</span></div>
        <div class="med-log-row" id="medLogRow">${activeMeds.map(m=>`<span class="med-pill${pendingMedIds.has(m.id)?' checked':''}" data-mid="${m.id}" style="background:${m.color}22;color:${m.color};border-color:${m.color}">${esc(m.name)}${m.dose?` ${m.dose}${m.unit}`:''}‎</span>`).join('')}</div>
      </div>`:''}

      <div style="margin-top:12px">
        <div class="field-label">tags</div>
        <div class="tag-row" id="tagRow">${renderTags()}</div>
        <button class="btn btn-sm" id="addTagBtn">+ tag</button>
      </div>
      <button class="btn btn-accent" id="logBtn" style="margin-top:16px;width:100%;justify-content:center;font-size:16px">log mood</button>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">medications &amp; therapy</span>
        <button class="btn btn-sm btn-accent" id="addMedOpenBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>add
        </button>
      </div>
      <div class="med-list" id="medList">${renderMedList(p)}</div>
      ${!p.meds.length?'<div style="color:var(--text-dim);font-size:13px;padding:8px 0">no medications tracked yet</div>':''}
    </div>
  </div>

  <div style="margin-top:20px;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)${document.body.getAttribute('data-theme')==='cottage'?' background:linear-gradient(180deg,#fdf9f0 0%,var(--surface) 6%)':''}">
    <div class="panel-header"><span class="panel-title">stats</span></div>
    ${renderStats(p)}
  </div>

  <div class="chart-section">
    <div class="panel-header"><span class="panel-title">mood over time</span></div>
    <canvas id="moodChart"></canvas>
  </div>

  <div class="history-section">
    <div class="panel-header">
      <span class="panel-title">history</span>
      <span style="font-size:12px;color:var(--text-dim)">${p.entries.length} entr${p.entries.length===1?'y':'ies'}</span>
    </div>
    ${renderHistory(p)}
  </div>`;

  // Emoji events
  document.querySelectorAll('.emoji-btn').forEach(btn=>{
    const v=parseInt(btn.dataset.v);
    btn.addEventListener('click',()=>selectMood(v));

    btn.addEventListener('mouseleave',()=>{const lbl=document.getElementById('moodLbl');if(lbl)lbl.textContent=pendingMood!==null?moodOf(pendingMood).label:''});

  document.querySelectorAll('.med-pill').forEach(pill=>{

      pill.classList.toggle('checked',pendingMedIds.has(mid));
    });

  document.getElementById('addTagBtn')?.addEventListener('click',()=>{document.getElementById('tagInput').value='';openModal('addTagModal');setTimeout(()=>document.getElementById('tagInput').focus(),50)});

  document.getElementById('addMedOpenBtn')?.addEventListener('click',openAddMedModal);

  requestAnimationFrame(()=>drawChart(p));
}

function renderMedList(p){
  if(!p.meds.length)return'';
  return p.meds.map(m=>{
    const ended=m.endDate&&m.endDate<todayStr();
    return`<div class="med-item">
      <div class="med-color-dot" style="background:${m.color}"></div>
      <div class="med-info">
        <div class="med-name-text" style="color:${ended?'var(--text-dim)':'var(--text)'};${ended?'text-decoration:line-through':''}">${esc(m.name)}${m.dose?` <span style="color:var(--text-dim);font-size:12px;font-weight:400">${m.dose} ${m.unit}</span>`:''}</div>
        <div class="med-sub">${m.category} · started ${fmtDs(m.startDate)}${m.endDate?' · ended '+fmtDs(m.endDate):''}${m.notes?' · '+esc(m.notes):''}</div>
      </div>
      <div class="med-actions">
        <button class="med-action-btn" data-action="edit" data-mid="${m.id}" title="edit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="med-action-btn del" data-mid="${m.id}" title="remove">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');
}

function renderTags(){
  const p=curP();if(!p)return'';
  return p.tags.map(t=>`<span class="tag${pendingTags.has(t)?' selected':''}" data-tag="${esc(t)}">${esc(t)}<button class="tag-x">×</button></span>`).join('');
}
function bindTagEvents(){
  document.querySelectorAll('#tagRow .tag').forEach(tag=>{
    tag.addEventListener('click',e=>{
      if(e.target.closest('.tag-x')){const p=curP();if(!p)return;p.tags=p.tags.filter(t=>t!==tag.dataset.tag);pendingTags.delete(tag.dataset.tag);save();refreshTags();return}
      pendingTags.has(tag.dataset.tag)?pendingTags.delete(tag.dataset.tag):pendingTags.add(tag.dataset.tag);refreshTags();
    });
  });
}
function refreshTags(){const r=document.getElementById('tagRow');if(!r)return;r.innerHTML=renderTags();bindTagEvents()}

function selectMood(v){pendingMood=v;selectMoodDisplay(v)}
function selectMoodDisplay(v){
  document.querySelectorAll('.emoji-btn').forEach(b=>b.classList.toggle('selected',parseInt(b.dataset.v)===v));
  const val=document.getElementById('moodVal');const lbl=document.getElementById('moodLbl');
  if(val){val.textContent=v>0?`+${v}`:String(v);val.style.color=v>0?'var(--pos)':v<0?'var(--neg)':'var(--accent)'}
  if(lbl)lbl.textContent=moodOf(v).label;
}

function handleLog(){
  if(pendingMood===null){toast('pick a mood first 👆');return}
  const d=dateStr(document.getElementById('logY').value,document.getElementById('logM').value,document.getElementById('logD').value);
  addEntry(d,pendingMood,pendingTags,pendingMedIds);
  pendingMood=null;pendingTags=new Set();pendingMedIds=new Set();
  render();toast('mood logged ✓');
}

function renderStats(p){
  if(!p.entries.length)return`<div style="color:var(--text-dim);font-size:14px;padding:8px 0">no entries yet</div>`;
  const moods=p.entries.map(e=>e.mood);
  const avg=moods.reduce((a,b)=>a+b,0)/moods.length;
  const best=Math.max(...moods),worst=Math.min(...moods);
  const bE=p.entries.find(e=>e.mood===best),wE=p.entries.find(e=>e.mood===worst);
  const dates=new Set(p.entries.map(e=>e.date));
  let streak=0;const d=new Date();
  while(true){const s=`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;if(!dates.has(s))break;streak++;d.setDate(d.getDate()-1)}
  const avgM=MOODS.reduce((p,c)=>Math.abs(c.v-avg)<Math.abs(p.v-avg)?c:p);
  return`<div class="stats-grid">
    <div class="stat-card"><div class="s-label">avg mood</div><div class="s-val">${avgM.e} ${avg>0?'+':''}${avg.toFixed(1)}</div></div>
    <div class="stat-card"><div class="s-label">streak</div><div class="s-val">${streak}d</div><div class="s-sub">consecutive days</div></div>
    <div class="stat-card"><div class="s-label">best day</div><div class="s-val" style="color:var(--pos)">${best>0?'+':''}${best}</div><div class="s-sub">${fmtDs(bE.date)}</div></div>
    <div class="stat-card"><div class="s-label">worst day</div><div class="s-val" style="color:var(--neg)">${worst}</div><div class="s-sub">${fmtDs(wE.date)}</div></div>
    <div class="stat-card" style="grid-column:1/-1"><div class="s-label">entries</div><div class="s-val">${p.entries.length} <span style="font-size:13px;font-weight:400;color:var(--text-muted)">· ${p.meds.length} med${p.meds.length!==1?'s':''} tracked</span></div></div>
  </div>`;
}

function renderHistory(p){
  if(!p.entries.length)return`<div class="history-empty">no entries yet</div>`;
  const medMap=Object.fromEntries((p.meds||[]).map(m=>[m.id,m]));
  return`<div style="overflow-x:auto"><table class="history-table"><thead><tr><th>date</th><th>mood</th><th></th></tr></thead><tbody>
    ${[...p.entries].reverse().map(e=>{
      const m=moodOf(e.mood);const cls=e.mood>0?'pos':e.mood<0?'neg':'neutral';
      const pills=(e.meds||[]).filter(id=>medMap[id]).map(id=>{const md=medMap[id];return`<span class="hist-med-pill" style="background:${md.color}22;color:${md.color}">${esc(md.name)}</span>`}).join('');
      const tags=(e.tags||[]).map(t=>`<span class="hist-tag">${esc(t)}</span>`).join('');
      const extras=pills||tags?`<div class="hist-pills">${pills}${tags}</div>`:'';
      return`<tr>
        <td style="font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap">${fmtD(e.date)}</td>
        <td><span class="mood-badge ${cls}">${m.e} ${e.mood>0?'+':''}${e.mood}</span>${extras}</td>
        <td style="text-align:right"><button class="hist-btn" data-eid="${e.id}" title="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg></button></td>
      </tr>`;
    }).join('')}
  </tbody></table></div>`;
}

// ── Chart ────────────────────────────────────────────────────────────────────
function drawChart(p){
  const canvas=document.getElementById('moodChart');if(!canvas)return;
  const cw=canvas.parentElement.clientWidth-2;
  canvas.width=Math.max(300,cw);

  const entries=[...p.entries].sort((a,b)=>a.date.localeCompare(b.date));
  const meds=p.meds||[];

  // Med track height
  const medH=meds.length?Math.min(meds.length*18+10,meds.length*18+14):0;
  canvas.height=240+medH;
  const W=canvas.width,H=canvas.height;
  const PAD={t:20,r:20,b:36+medH,l:44};
  const cW=W-PAD.l-PAD.r,cH=H-PAD.t-PAD.b;
  const ctx=canvas.getContext('2d');
  const cs=getComputedStyle(document.body);
  const cv=v=>cs.getPropertyValue(v).trim();
  const colBg=cv('--surface2'),colBorder=cv('--border'),colDim=cv('--text-dim');
  const colAccent=cv('--accent'),colPos=cv('--pos'),colNeg=cv('--neg'),colSurf=cv('--bg');

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=colBg;
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(0,0,W,H,8);else ctx.rect(0,0,W,H);ctx.fill();

  if(!entries.length){ctx.fillStyle=colDim;ctx.font='14px DM Sans,sans-serif';ctx.textAlign='center';ctx.fillText('no entries yet',W/2,(H-medH)/2);return}

  const allDates=entries.map(e=>e.date);
  const minDate=allDates[0],maxDate=allDates[allDates.length-1];
  const minTs=parseD(minDate).getTime(),maxTs=parseD(maxDate).getTime();
  const span=Math.max(maxTs-minTs,86400000);

  const xOf=d=>{const ts=parseD(d).getTime();return PAD.l+(entries.length===1?cW/2:(ts-minTs)/span*cW)};
  const yOf=v=>PAD.t+cH*(1-(v+10)/20);
  const zeroY=yOf(0);

  // Med background bands
  if(meds.length){
    meds.forEach((m,i)=>{
      const sTs=m.startDate?parseD(m.startDate).getTime():minTs;
      const eTs=m.endDate?parseD(m.endDate).getTime():Date.now();
      const sx=PAD.l+Math.max(0,(sTs-minTs)/span*cW);
      const ex=PAD.l+Math.min(cW,(eTs-minTs)/span*cW);
      if(ex<=sx)return;
      ctx.fillStyle=m.color+'28';
      ctx.fillRect(sx,PAD.t,ex-sx,cH);
      ctx.fillStyle=m.color+'40';
      ctx.fillRect(sx,PAD.t,2,cH);
    });
  }

  // Grid
  for(const v of[-10,-5,0,5,10]){
    const y=yOf(v);
    ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+cW,y);
    if(v===0){ctx.strokeStyle=colAccent;ctx.lineWidth=1.5;ctx.setLineDash([6,4])}
    else{ctx.strokeStyle=colBorder;ctx.lineWidth=1;ctx.setLineDash([3,4])}
    ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=colDim;ctx.font='11px JetBrains Mono,monospace';ctx.textAlign='right';
    ctx.fillText(v>0?`+${v}`:String(v),PAD.l-6,y+4);
  }

  // Area fills
  if(entries.length>=2){
    ctx.beginPath();ctx.moveTo(xOf(entries[0].date),Math.min(yOf(entries[0].mood),zeroY));
    entries.forEach(e=>ctx.lineTo(xOf(e.date),Math.min(yOf(e.mood),zeroY)));
    ctx.lineTo(xOf(entries[entries.length-1].date),zeroY);ctx.lineTo(xOf(entries[0].date),zeroY);ctx.closePath();
    const gp=ctx.createLinearGradient(0,PAD.t,0,zeroY);gp.addColorStop(0,colPos+'55');gp.addColorStop(1,colPos+'0a');ctx.fillStyle=gp;ctx.fill();

    ctx.beginPath();ctx.moveTo(xOf(entries[0].date),Math.max(yOf(entries[0].mood),zeroY));
    entries.forEach(e=>ctx.lineTo(xOf(e.date),Math.max(yOf(e.mood),zeroY)));
    ctx.lineTo(xOf(entries[entries.length-1].date),zeroY);ctx.lineTo(xOf(entries[0].date),zeroY);ctx.closePath();
    const gn=ctx.createLinearGradient(0,zeroY,0,PAD.t+cH);gn.addColorStop(0,colNeg+'0a');gn.addColorStop(1,colNeg+'55');ctx.fillStyle=gn;ctx.fill();
  }

  // Line
  ctx.beginPath();ctx.strokeStyle=colAccent;ctx.lineWidth=2;ctx.lineJoin='round';
  entries.forEach((e,i)=>{const x=xOf(e.date),y=yOf(e.mood);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();

  // Dots
  entries.forEach(e=>{
    const x=xOf(e.date),y=yOf(e.mood);const col=e.mood>0?colPos:e.mood<0?colNeg:colAccent;
    ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
    ctx.strokeStyle=colSurf;ctx.lineWidth=2;ctx.stroke();
  });

  // X labels
  ctx.fillStyle=colDim;ctx.font='11px DM Sans,sans-serif';ctx.textAlign='center';
  const maxL=Math.max(2,Math.floor(cW/70));const step=Math.max(1,Math.floor(entries.length/maxL));
  const shown=new Set();
  for(let i=0;i<entries.length;i+=step){ctx.fillText(fmtDs(entries[i].date),xOf(entries[i].date),H-medH-PAD.b+cH+16);shown.add(i)}
  if(!shown.has(entries.length-1))ctx.fillText(fmtDs(entries[entries.length-1].date),xOf(entries[entries.length-1].date),H-medH-PAD.b+cH+16);

  // Med timeline tracks at bottom
  if(meds.length){
    const trackTop=H-medH+4;
    meds.forEach((m,i)=>{
      const y=trackTop+i*18;
      const sTs=m.startDate?parseD(m.startDate).getTime():minTs;
      const eTs=m.endDate?parseD(m.endDate).getTime():Date.now();
      const sx=PAD.l+Math.max(0,(sTs-minTs)/span*cW);
      const ex=PAD.l+Math.min(cW,(eTs-minTs)/span*cW);
      ctx.fillStyle=m.color+'33';ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(sx,y,Math.max(4,ex-sx),14,3);else ctx.rect(sx,y,Math.max(4,ex-sx),14);ctx.fill();
      ctx.fillStyle=m.color;ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(sx,y,Math.min(4,ex-sx||4),14,3);else ctx.rect(sx,y,Math.min(4,ex-sx||4),14);ctx.fill();
      ctx.fillStyle=colDim;ctx.font='10px DM Sans,sans-serif';ctx.textAlign='left';
      ctx.fillText(m.name,sx+6,y+10);
    });
  }
}

// ── Add med modal ─────────────────────────────────────────────────────────────
function openAddMedModal(){
  selectedCatalogItem=null;activeCatFilter='All';chosenColor=CAT_COLORS[0];
  document.getElementById('catalogView').style.display='';
  document.getElementById('medFormView').style.display='none';
  document.getElementById('addMedBack').style.display='none';
  document.getElementById('saveMedBtn').style.display='none';
  document.getElementById('addMedTitle').textContent='add medication';
  renderCatalog();
  openModal('addMedModal');
}
function renderCatalog(){
  // Tabs
  const tabsEl=document.getElementById('catTabs');
  tabsEl.innerHTML=CAT_NAMES.map(n=>`<button class="cat-tab${activeCatFilter===n?' active':''}" data-cat="${n}">${n}</button>`).join('');
  tabsEl.querySelectorAll('.cat-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{activeCatFilter=btn.dataset.cat;renderCatalog()});
  });
  // Grid
  const grid=document.getElementById('catalogGrid');
  const items=activeCatFilter==='All'?CATALOG:CATALOG.filter(c=>c.cat===activeCatFilter);
  grid.innerHTML=items.map((item,i)=>`<div class="catalog-item" data-idx="${CATALOG.indexOf(item)}">
    <div class="cat-dot" style="background:${item.color}"></div>
    <div class="cat-item-main">
      <div class="cat-item-name">${esc(item.name)}</div>
      <div class="cat-item-sub">${esc(item.sub)}</div>
    </div>
    <span class="cat-item-badge">${item.cat}</span>
  </div>`).join('');
  grid.querySelectorAll('.catalog-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const item=CATALOG[parseInt(el.dataset.idx)];
      selectedCatalogItem=item;chosenColor=item.color;
      // Show form
      document.getElementById('catalogView').style.display='none';
      document.getElementById('medFormView').style.display='';
      document.getElementById('addMedBack').style.display='';
      document.getElementById('saveMedBtn').style.display='';
      document.getElementById('addMedTitle').textContent=item.name;
      document.getElementById('selectedCatItem').innerHTML=`<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2)"><div style="width:10px;height:10px;border-radius:50%;background:${item.color}"></div><div><div style="font-size:14px;font-weight:500;color:var(--text)">${esc(item.name)}</div><div style="font-size:11px;color:var(--text-dim)">${esc(item.sub)} · ${item.cat}</div></div></div>`;
      document.getElementById('medDoseInput').value=item.defaultDose||'';
      document.getElementById('medUnitInput').value=item.units||'mg';
      document.getElementById('medNotesInput').value='';
      document.getElementById('medStartSelects').innerHTML=buildDateSelects('addMedStart',todayStr());
      renderColorSwatches();
    });
  });
}
function renderColorSwatches(){
  const el=document.getElementById('colorSwatches');if(!el)return;
  el.innerHTML=CAT_COLORS.map(c=>`<div class="color-swatch${c===chosenColor?' selected':''}" style="background:${c}" data-c="${c}"></div>`).join('');
  el.querySelectorAll('.color-swatch').forEach(sw=>{
    sw.addEventListener('click',()=>{chosenColor=sw.dataset.c;renderColorSwatches()});
  });
}

document.getElementById('addMedBack').addEventListener('click',()=>{
  document.getElementById('catalogView').style.display='';
  document.getElementById('medFormView').style.display='none';
  document.getElementById('addMedBack').style.display='none';
  document.getElementById('saveMedBtn').style.display='none';
  document.getElementById('addMedTitle').textContent='add medication';
});
document.getElementById('cancelMedBtn').addEventListener('click',()=>closeModal('addMedModal'));
document.getElementById('addMedModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal('addMedModal')});
document.getElementById('saveMedBtn').addEventListener('click',()=>{
  if(!selectedCatalogItem)return;
  const dose=document.getElementById('medDoseInput').value;
  const unit=document.getElementById('medUnitInput').value;
  const start=getDateFrom('addMedStart');
  const notes=document.getElementById('medNotesInput').value.trim();
  addMed(selectedCatalogItem.name,chosenColor,selectedCatalogItem.cat,dose,unit,start,notes);
  closeModal('addMedModal');toast(`${selectedCatalogItem.name} added ✓`);render();
});

// ── Edit med modal ──────────────────────────────────────────────────────────
function openEditMedModal(mid){
  const p=curP();if(!p)return;
  const m=p.meds.find(m=>m.id===mid);if(!m)return;
  editingMedId=mid;
  document.getElementById('editMedTitle').textContent=m.name;
  document.getElementById('editDoseInput').value=m.dose||'';
  document.getElementById('editUnitInput').value=m.unit||'mg';
  document.getElementById('editNotesInput').value=m.notes||'';
  document.getElementById('medEndSelects').innerHTML=buildDateSelects('editMedEnd',m.endDate||todayStr());
  document.getElementById('medEndCheck').checked=!!m.endDate;
  openModal('editMedModal');
}
document.getElementById('cancelEditMedBtn').addEventListener('click',()=>closeModal('editMedModal'));
document.getElementById('editMedModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal('editMedModal')});
document.getElementById('saveEditMedBtn').addEventListener('click',()=>{
  if(!editingMedId)return;
  const dose=document.getElementById('editDoseInput').value;
  const unit=document.getElementById('editUnitInput').value;
  const endDate=document.getElementById('medEndCheck').checked?getDateFrom('editMedEnd'):null;
  const notes=document.getElementById('editNotesInput').value.trim();
  editMed(editingMedId,dose,unit,endDate,notes);
  closeModal('editMedModal');toast('saved ✓');
});

// ── Profile modals ───────────────────────────────────────────────────────────
document.getElementById('addProfileBtn').addEventListener('click',()=>{document.getElementById('profileNameInput').value='';openModal('addProfileModal');setTimeout(()=>document.getElementById('profileNameInput').focus(),50)});
document.getElementById('cancelProfileBtn').addEventListener('click',()=>closeModal('addProfileModal'));
document.getElementById('addProfileModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal('addProfileModal')});
document.getElementById('saveProfileBtn').addEventListener('click',()=>{const n=document.getElementById('profileNameInput').value.trim();if(!n)return;closeModal('addProfileModal');addProfile(n)});
document.getElementById('profileNameInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('saveProfileBtn').click()});

document.getElementById('cancelRenameBtn').addEventListener('click',()=>closeModal('renameModal'));
document.getElementById('renameModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal('renameModal')});
document.getElementById('saveRenameBtn').addEventListener('click',()=>{const n=document.getElementById('renameInput').value.trim();if(!n||!renamingId)return;closeModal('renameModal');renameProfile(renamingId,n);renamingId=null});
document.getElementById('renameInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('saveRenameBtn').click()});

// ── Tag modal ────────────────────────────────────────────────────────────────
document.getElementById('cancelTagBtn').addEventListener('click',()=>closeModal('addTagModal'));
document.getElementById('addTagModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal('addTagModal')});
document.getElementById('saveTagBtn').addEventListener('click',()=>{
  const n=document.getElementById('tagInput').value.trim();if(!n)return;
  const p=curP();if(!p)return;if(!p.tags.includes(n))p.tags.push(n);
  save();closeModal('addTagModal');refreshTags();
});
document.getElementById('tagInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('saveTagBtn').click()});

// ── Modal helpers ─────────────────────────────────────────────────────────────
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}

// ── Theme & header ───────────────────────────────────────────────────────────
document.getElementById('themeSelect').addEventListener('change',e=>{applyTheme(e.target.value);const p=curP();if(p)requestAnimationFrame(()=>drawChart(p))});
document.getElementById('headerMenuToggle').addEventListener('click',()=>{const c=document.getElementById('headerControls');c.classList.toggle('open');document.getElementById('headerMenuToggle').classList.toggle('open',c.classList.contains('open'))});
document.addEventListener('click',e=>{
  document.querySelectorAll('.ctx-menu.open').forEach(m=>m.classList.remove('open'));
  if(!e.target.closest('#headerMenuToggle')&&!e.target.closest('#headerControls'))document.getElementById('headerControls').classList.remove('open');
});

// ── Export / Import ──────────────────────────────────────────────────────────
document.getElementById('exportBtn').addEventListener('click',()=>{
  const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(S,null,2));a.download='mood-export.json';a.click();
});
document.getElementById('importTrigger').addEventListener('click',()=>document.getElementById('importInput').click());
document.getElementById('importInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{try{const imp=JSON.parse(ev.target.result);if(!Array.isArray(imp.profiles))throw 0;S=imp;if(!S.currentId&&S.profiles.length)S.currentId=S.profiles[0].id;save();render();toast('imported!')}catch{toast('invalid file')}};
  r.readAsText(f);e.target.value='';
});

// ── Init ─────────────────────────────────────────────────────────────────────
load();
try{applyTheme(localStorage.getItem('mood-theme')||'')}catch(e){applyTheme('')}
render();
window.addEventListener('resize',()=>{const p=curP();if(p)requestAnimationFrame(()=>drawChart(p))});
</script>
